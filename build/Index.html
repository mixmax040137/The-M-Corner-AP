<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title><?= appName ?></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ tokens ============ ---------------------------------
   ธีมสว่าง/มืด ครอบคลุม 3 สถานะ:
   :root                              = ธีมสว่าง (ค่าตั้งต้น)
   prefers-color-scheme + :not(light) = ผู้ใช้ตั้ง OS เป็นมืด และไม่ได้เลือกสว่างไว้
   [data-theme="dark"]                = ผู้ใช้เลือกมืดเอง
   สีทุกสีนิยามเป็นตัวแปรที่นี่ที่เดียว — ห้ามใส่สีตรง ๆ ในคอมโพเนนต์
   โทนกลางเอียงไปทางน้ำเงินโคบอลต์ให้เข้ากับสีหลัก แทนที่จะใช้เทากลาง ๆ
------------------------------------------------------------------- */
:root{
  --bg:#f2f5fa; --surface:#fff; --surface-2:#f7f9fc;
  --ink:#0f1729; --ink-2:#33405a; --muted:#5f6d87; --faint:#8d9ab2;
  --line:#e0e6f0; --line-2:#eef1f7;
  --nav:#101a30; --nav-2:#1b2846; --nav-ink:#b8c4dc; --nav-sec:#61708f;
  --brand:#2c5cc5; --brand-ink:#fff; --brand-soft:#e8eeff; --brand-2:#5b87e8;
  --ok:#0e8a5f; --ok-soft:#e3f5ed; --ok-2:#3fb383;
  --warn:#b26a00; --warn-soft:#fdf1df; --warn-2:#d9963a;
  --danger:#c62828; --danger-soft:#fdeaea;
  --info:#0b6fa4; --info-soft:#e5f1f9;
  --r:12px; --r-sm:8px;
  --sh:0 1px 2px rgba(15,23,41,.05), 0 1px 3px rgba(15,23,41,.06);
  --sh-lg:0 12px 32px rgba(15,23,41,.16);
  --nav-w:236px;
  --font-ui:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Thai',var(--font-ui);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111b; --surface:#141b28; --surface-2:#1a2231;
    --ink:#e6ecf7; --ink-2:#bfc9db; --muted:#8794ab; --faint:#67738c;
    --line:#232d3f; --line-2:#1c2534;
    --nav:#080c14; --nav-2:#141c2b; --nav-ink:#94a2bd; --nav-sec:#59657e;
    --brand:#6f9bff; --brand-ink:#0b1020; --brand-soft:#17244a; --brand-2:#9dbaff; --brand-2:#9dbaff;
    --ok:#35c98a; --ok-soft:#0f2a20; --ok-2:#6fdcac; --ok-2:#6fdcac;
    --warn:#e0a340; --warn-soft:#2c2113; --warn-2:#f0c477; --warn-2:#f0c477;
    --danger:#f0716b; --danger-soft:#2e1818;
    --info:#4cb6ea; --info-soft:#10242f;
    --sh:0 1px 2px rgba(0,0,0,.45);
    --sh-lg:0 16px 40px rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#141b28; --surface-2:#1a2231;
  --ink:#e6ecf7; --ink-2:#bfc9db; --muted:#8794ab; --faint:#67738c;
  --line:#232d3f; --line-2:#1c2534;
  --nav:#080c14; --nav-2:#141c2b; --nav-ink:#94a2bd; --nav-sec:#59657e;
  --brand:#6f9bff; --brand-ink:#0b1020; --brand-soft:#17244a; --brand-2:#9dbaff;
  --ok:#35c98a; --ok-soft:#0f2a20; --ok-2:#6fdcac;
  --warn:#e0a340; --warn-soft:#2c2113; --warn-2:#f0c477;
  --danger:#f0716b; --danger-soft:#2e1818;
  --info:#4cb6ea; --info-soft:#10242f;
  --sh:0 1px 2px rgba(0,0,0,.45);
  --sh-lg:0 16px 40px rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}

/* ============ layout ============ */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--nav);color:var(--nav-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:.1px;font-family:var(--font-display);font-weight:600}
.brand span{font-size:11.5px;color:var(--nav-sec)}
.nav-list{padding:10px 10px 20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sec{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--nav-sec);padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--nav-ink);font-size:13.5px;border:0;background:0;width:100%;text-align:left;
}
.nav-item:hover{background:var(--nav-2);color:#fff}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 7px;font-size:11px}
.nav-item.on .badge{background:rgba(255,255,255,.25)}
.nav-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--nav-sec)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.top h1{font-size:17.5px;margin:0;font-weight:600;letter-spacing:-.1px;font-family:var(--font-display);text-wrap:balance}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:20px 22px 64px;max-width:1320px;width:100%}

.burger{display:none;background:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer}

/* ============ controls ============ */
.sel,.inp,.ta{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 11px;font-size:13.5px;width:100%;outline:0;transition:border-color .15s,box-shadow .15s;
}
.sel:focus,.inp:focus,.ta:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ta{min-height:74px;resize:vertical}
.sel{cursor:pointer;padding-right:26px}
.w-auto{width:auto}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-sm);padding:7px 13px;font-size:13.5px;cursor:pointer;font-weight:500;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dgr{color:var(--danger);border-color:var(--danger)}
.btn.dgr:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:5px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}

/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;font-family:var(--font-display);text-wrap:balance}
.card-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.flush{padding:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:23px;font-weight:600;letter-spacing:-.4px;margin-top:5px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.kpi .cap{font-size:11.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.accent{background:var(--brand-soft);border-color:transparent}
.kpi.accent .lbl{color:var(--brand)}
.kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--danger)} .kpi.warn .val{color:var(--warn)}

/* progress */
.pbar{height:10px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.pbar.lg{height:16px}
.pbar.ok>i{background:linear-gradient(90deg,var(--ok),var(--ok-2))}
.pbar.warn>i{background:linear-gradient(90deg,var(--warn),var(--warn-2))}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.pmeta b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ============ table ============ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{
  text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;
}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.t-actions{display:flex;gap:4px;justify-content:flex-end}

/* ============ badges ============ */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.dgr{background:var(--danger-soft);color:var(--danger)}
.b.info{background:var(--info-soft);color:var(--info)}
.b.mute{background:var(--line-2);color:var(--muted)}

/* ============ room grid ============ */
.floors{display:flex;flex-direction:column;gap:12px}
.floor{display:flex;gap:12px;align-items:flex-start}
.floor-tag{
  flex:0 0 62px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:center;font-size:11.5px;color:var(--muted);
}
.floor-tag b{display:block;font-size:17px;color:var(--ink)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;flex:1}
.room{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;
  cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden;
}
.room:hover{transform:translateY(-1px);box-shadow:var(--sh-lg);border-color:var(--brand)}
.room .no{font-weight:600;font-size:15.5px;letter-spacing:0;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.room .st{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.room .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:99px;background:var(--line)}
.room.s-ok .dot{background:var(--ok)} .room.s-warn .dot{background:var(--warn)}
.room.s-dgr .dot{background:var(--danger)} .room.s-info .dot{background:var(--info)}
.room.s-ok{border-left:3px solid var(--ok)} .room.s-warn{border-left:3px solid var(--warn)}
.room.s-dgr{border-left:3px solid var(--danger)} .room.s-info{border-left:3px solid var(--info)}

/* ============ alerts / list ============ */
.alist{display:flex;flex-direction:column}
.ali{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.ali:last-child{border-bottom:0}
.ali:hover{background:var(--surface-2)}
.ali .ic{font-size:16px;line-height:1.3}
.ali .tt{font-weight:600;font-size:13px}
.ali .dd{font-size:12px;color:var(--muted);margin-top:1px}
.ali.l-danger .tt{color:var(--danger)} .ali.l-warn .tt{color:var(--warn)}

/* ============ media / thumbs ============ */
.thumbs{display:flex;gap:5px;flex-wrap:wrap}
.thumb{
  width:44px;height:44px;border-radius:6px;border:1px solid var(--line);object-fit:cover;
  background:var(--surface-2);cursor:pointer;display:block;
}
.thumb.big{width:92px;height:92px}
.file-drop{
  border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;
  color:var(--muted);font-size:12.5px;cursor:pointer;background:var(--surface-2);
}
.file-drop:hover{border-color:var(--brand);color:var(--brand)}

/* ============ modal ============ */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:660px;margin:auto 0;animation:pop .16s ease-out}
.modal.wide{max-width:960px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:15.5px;font-weight:600;font-family:var(--font-display)}
.modal-b{padding:18px;max-height:min(70vh,700px);overflow-y:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{margin-left:auto;background:0;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--line-2);color:var(--ink)}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:600}
.f .hint{font-size:11.5px;color:var(--faint)}

/* ============ misc ============ */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.6}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;
  background:var(--nav);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  box-shadow:var(--sh-lg);animation:up .2s ease-out;max-width:90vw;
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.fs12{font-size:12px} .fs13{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mb8{margin-bottom:8px} .mb12{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.clip{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.bar-row .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600;white-space:nowrap}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px}
.tl-i:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:99px;background:var(--brand);border:2px solid var(--surface)}
.tl-i .d{font-size:11.5px;color:var(--muted)}
.tl-i .t{font-weight:600;font-size:13px}

/* ============ responsive ============ */
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .nav{
    position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--sh-lg);
  }
  .nav.open{transform:none}
  .burger{display:inline-flex}
  .content{padding:14px 14px 80px}
  .top{padding:10px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .floor{flex-direction:column}
  .floor-tag{flex:none;width:100%;display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left}
  .floor-tag b{font-size:14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .modal-b{max-height:none}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none}
}
/* ============ หน้าล็อกอิน / PIN ============ */
body.locked{overflow:hidden}
body.locked .app{filter:blur(3px);pointer-events:none;user-select:none}
.auth-wrap{
  position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  padding:24px;background:var(--bg);overflow-y:auto;
}
.auth-card{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh-lg);padding:26px 24px 22px;
}
.auth-brand{font-size:15px;color:var(--muted);margin-bottom:18px;text-align:center}
.auth-brand b{color:var(--ink);font-family:var(--font-display)}
.auth-h{margin:0 0 4px;font-size:20px;font-weight:600;font-family:var(--font-display);text-align:center}
.auth-sub{margin:0 0 18px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.auth-f{margin-bottom:13px}
.auth-f label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.auth-f .inp{width:100%;padding:10px 12px;font-size:15px}
.auth-go{width:100%;justify-content:center;padding:11px;font-size:14.5px;margin-top:6px}
.auth-alt{width:100%;justify-content:center;margin-top:9px;font-size:13px}
.auth-err{
  background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);
  padding:9px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.55;
}
.auth-foot{font-size:11.5px;color:var(--faint);text-align:center;margin:16px 0 0;line-height:1.6}

/* จุด 6 จุดแทน PIN ที่กดไปแล้ว */
.pin-dots{display:flex;gap:13px;justify-content:center;margin:6px 0 22px}
.pin-dots i{
  width:13px;height:13px;border-radius:99px;background:var(--line);
  border:1px solid var(--line);transition:transform .12s,background .12s;
}
.pin-dots i.on{background:var(--brand);border-color:var(--brand);transform:scale(1.16)}
.pin-dots.busy{opacity:.5}
.pin-dots.shake{animation:shake .42s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pin-k{
  aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:14px;font-size:21px;font-weight:500;cursor:pointer;
  font-family:var(--font-display);font-variant-numeric:tabular-nums;
  transition:background .1s,transform .06s;
}
.pin-k:hover{background:var(--brand-soft);border-color:var(--brand)}
.pin-k:active{transform:scale(.94)}
.pin-k.ghost{background:transparent;border-color:transparent;font-size:17px;color:var(--muted)}
.pin-k.ghost:hover{background:var(--surface-2);border-color:var(--line)}

/* ============ ตัวเลือกธีม ============ */
.theme-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-opt{
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
  padding:15px 10px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);cursor:pointer;color:var(--ink);font:inherit;
  transition:border-color .12s,background .12s;
}
.theme-opt:hover{border-color:var(--brand)}
.theme-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.theme-opt .ic{font-size:24px;line-height:1.2}
.theme-opt b{font-size:13.5px}
.theme-opt .hint{font-size:11px;color:var(--muted);line-height:1.45}
.warn-text{color:var(--warn)}

/* ============ ผลการอ่านข้อความจากรูป ============ */
/* ไฮไลต์สั้น ๆ ให้เห็นว่าช่องไหนเพิ่งถูกเติมจากรูป */
.ocr-filled{
  border-color:var(--brand)!important;
  box-shadow:0 0 0 3px var(--brand-soft)!important;
  animation:ocrPop .4s;
}
@keyframes ocrPop{ 0%{background:var(--brand-soft)} 100%{background:var(--surface)} }

.ocr-box{
  border:1px dashed var(--brand);background:var(--brand-soft);
  border-radius:var(--r-sm);padding:12px;margin-top:10px;
}
.ocr-box .hd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--brand);margin-bottom:9px}
.ocr-box .hd .sp{margin-left:auto;display:flex;gap:6px}
.ocr-hits{display:flex;flex-direction:column;gap:6px}
.ocr-hit{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;
}
.ocr-hit .k{color:var(--muted);font-size:11.5px;min-width:78px}
.ocr-hit .v{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocr-raw{
  max-height:150px;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 11px;font-size:12px;line-height:1.65;
  white-space:pre-wrap;color:var(--ink-2);margin-top:9px;
}

@media (max-width:520px){
  .auth-card{max-width:100%;padding:22px 18px 18px}
  .theme-pick{grid-template-columns:1fr}
  .theme-opt{flex-direction:row;text-align:left;gap:11px}
  .theme-opt .hint{display:none}
}

/* ============ รายการย่อยในบิล (ซื้อทีเดียวหลายอย่าง) ============ */
.lines{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface-2)}
.line-head,.line-row{
  display:grid;grid-template-columns:minmax(0,1fr) 84px 92px 108px 96px 34px;
  gap:7px;align-items:center;
}
.line-head{font-size:11.5px;color:var(--muted);padding:0 2px 6px;font-weight:600}
.line-head .num,.line-row .num{text-align:right}
.line-row{margin-bottom:6px}
.line-row .inp{padding:6px 9px;font-size:13px}
.line-row .inp.num{text-align:right;font-variant-numeric:tabular-nums}
.line-sum{
  text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink);white-space:nowrap;overflow:hidden;
}
.line-total{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.line-total b{color:var(--ink)}

/* รายการย่อยที่กางดูในตาราง */
.bill-lines{margin-top:6px;border-left:2px solid var(--line);padding-left:9px}
.bill-line{
  display:flex;gap:8px;font-size:12px;color:var(--ink-2);padding:1px 0;
  font-variant-numeric:tabular-nums;
}
.bill-line .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-line .qt{color:var(--faint);white-space:nowrap}
.bill-line .tt{white-space:nowrap;font-weight:600}
.bill-extra{font-size:11.5px;color:var(--muted);margin-top:3px}
.bill-toggle{
  background:0;border:0;padding:0;margin-top:3px;cursor:pointer;font:inherit;
  font-size:11.5px;color:var(--brand);text-align:left;
}
.bill-toggle:hover{text-decoration:underline}

@media (max-width:640px){
  /* จอแคบ: ชื่อสินค้าอยู่บรรทัดบน ส่วนจำนวน/หน่วย/ราคา/รวม อยู่บรรทัดเดียวกันข้างล่าง
     จะได้ไม่กินพื้นที่แนวตั้งจนต้องเลื่อนจอยาวเวลาซื้อของหลายอย่าง */
  .lines{padding:8px}
  .line-head{display:none}
  .line-row{
    grid-template-columns:56px minmax(0,1fr) 72px minmax(0,86px);
    grid-template-areas:'name name name del' 'qty unit price sum';
    gap:5px;padding:8px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  }
  .line-row .inp:nth-of-type(1){grid-area:name}
  .line-row .inp:nth-of-type(2){grid-area:qty;text-align:center}
  .line-row .inp:nth-of-type(3){grid-area:unit}
  .line-row .inp:nth-of-type(4){grid-area:price}
  .line-row .line-sum{grid-area:sum;align-self:center;font-size:12.5px}
  .line-row .btn{grid-area:del;align-self:start;justify-self:end;width:34px;padding:6px 0}
  .line-row .inp{padding:6px 7px;font-size:12.5px}
  .line-total{width:100%;margin:6px 0 0;text-align:right}
}

@media print{
  .nav,.top-right,.burger,.t-actions,.btn{display:none!important}
  .app{display:block} body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<div class="app">
  <!-- ================= sidebar ================= -->
  <aside class="nav" id="nav">
    <div class="brand">
      <b>🏢 <?= appName ?></b>
      <span><?= subtitle ?> · v<?= version ?></span>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="nav-foot" id="navFoot">กำลังโหลด…</div>
  </aside>

  <!-- ================= main ================= -->
  <div class="main">
    <header class="top">
      <button class="burger" onclick="toggleNav()">☰</button>
      <div>
        <h1 id="pageTitle">ภาพรวม</h1>
        <div class="sub" id="pageSub">แดชบอร์ดรวมทุกส่วนของหอพัก</div>
      </div>
      <div class="top-right">
        <span id="liveDot"></span>
        <button class="btn icon" id="themeBtn" title="สลับธีม" onclick="cycleTheme()">🌗</button>
        <input class="inp w-auto" id="searchBox" placeholder="🔎 ค้นหาทั้งระบบ…" style="width:180px"
               oninput="onSearch(this.value)" autocomplete="off">
        <select class="sel w-auto" id="yearSel" onchange="setYear(this.value)"></select>
        <button class="btn icon" title="รีเฟรช" onclick="refresh()">↻</button>
      </div>
    </header>
    <main class="content" id="view">
      <div class="empty"><div class="big"><span class="spin"></span></div>กำลังเชื่อมต่อระบบ…</div>
    </main>
  </div>
</div>

<div id="authRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
  /* ค่าทั้งสามถูกกรองมาจากฝั่งเซิร์ฟเวอร์แล้ว จึงหลุดออกจากเครื่องหมายคำพูดไม่ได้
       accessKey  ผ่าน safeKey_    เหลือแค่ A-Z a-z 0-9 _ -
       role       มาจากรายการคงที่ ROLE
       theme      ผ่าน safeTheme_  เหลือแค่ 3 ค่าที่กำหนดไว้

     ทั้งสามต้องพิมพ์แบบดิบ (force-printing) เท่านั้น ห้ามใช้แบบ standard-printing
     เพราะแบบหลังจะ escape เครื่องหมายคำพูดเป็น &quot; ซึ่งในแท็ก script
     เบราว์เซอร์ไม่ถอดกลับ ทำให้ทั้งบล็อกนี้พังทั้งก้อนและค่าไม่ถึงหน้าเว็บ */
  var ACCESS_KEY = "<?!= accessKey ?>";
  var USER_ROLE  = "<?!= role ?>";
  var INIT_THEME = "<?!= theme ?>";
</script>
<script>
/* =========================================================
   App.html — core: state, api, router, format, modal, upload
   ========================================================= */

var S = {
  boot: null,          // ข้อมูลตั้งต้นจาก app.bootstrap
  page: 'dashboard',
  year: String(new Date().getFullYear()),
  cache: {},           // เก็บผลลัพธ์ล่าสุดของแต่ละหน้า
  params: {},          // ตัวกรองย่อยของแต่ละหน้า เช่น {room:'311', status:'all'}
  busy: false,
  version: 0,          // รุ่นข้อมูลที่หน้านี้ถืออยู่
  selfChangeUntil: 0,  // เพิ่งกดบันทึกเอง — อย่าเด้งว่า "มีคนแก้ข้อมูล"
  syncTimer: null
};

var ALL_DEBTS = [];

var PAGES = [
  { id:'dashboard', ic:'📊', label:'ภาพรวม',              sub:'แดชบอร์ดรวมทุกส่วนของหอพัก',        sec:'ภาพรวม' },
  { id:'debtMain',  ic:'💰', label:'รายการสรุปรวม',       sub:'บัญชีโอนใช้หนี้หลักของหอพัก',        sec:'การเงิน' },
  { id:'debtSub',   ic:'🧾', label:'หนี้สิน',              sub:'บัญชีโอนใช้หนี้รองของหอพัก' },
  { id:'purchases', ic:'🛒', label:'รายการซื้อของ',        sub:'ของเข้าหอพัก ราคา ประกัน และสลิป' },
  { id:'finance',   ic:'📒', label:'รายรับ-รายจ่ายหอ',      sub:'ค่าเช่าที่เก็บได้ · ค่าไฟ · ค่าน้ำ · ค่าเน็ต · ภาษี' },
  { id:'ac',        ic:'❄️', label:'ล้างแอร์',            sub:'ตารางล้างแอร์รายห้อง 24 ห้อง',      sec:'ซ่อมบำรุง' },
  { id:'repairs',   ic:'🔧', label:'ซ่อมแซมตามห้อง',      sub:'งานแจ้งซ่อมแยกตามห้อง' },
  { id:'building',  ic:'🏢', label:'ซ่อมแซมตึกโดยรวม',    sub:'งานส่วนกลางของอาคาร' },
  { id:'rooms',     ic:'🚪', label:'ห้องพัก',             sub:'ทะเบียนห้องและประวัติรายห้อง',       sec:'ข้อมูล' },
  { id:'reports',   ic:'📈', label:'รายงาน & สำรองข้อมูล', sub:'ค่าใช้จ่ายรายห้อง · ปฏิทินงาน · ส่งออกข้อมูล' },
  { id:'settings',  ic:'⚙️', label:'ตั้งค่า',              sub:'บัญชี · ธีม · ผู้ใช้ · ลิงก์เข้าใช้งาน',   sec:'ระบบ' }
];

/* ---------------- API ---------------- */

/** กุญแจที่จะแนบไปกับทุกคำสั่ง — มี 2 ทางสำรองเผื่อทางแรกไม่มา */
var RESOLVED_KEY = null;

function accessKey(){
  if (RESOLVED_KEY !== null) return RESOLVED_KEY;
  RESOLVED_KEY = (typeof ACCESS_KEY === 'string' && ACCESS_KEY) ? ACCESS_KEY : '';
  return RESOLVED_KEY;
}

/** true ถ้าเปิดด้วยลิงก์ผู้ดูแล — ใช้แทนตัวแปร CAN_EDIT ตรง ๆ ที่อาจไม่ถูกประกาศ */
function canEdit(){
  if (typeof CAN_EDIT !== 'undefined') return !!CAN_EDIT;
  return !!(S.boot && S.boot.canEdit);
}

function callApi(action, payload){
  var body = {};
  Object.keys(payload || {}).forEach(function(k){ body[k] = payload[k]; });
  body._key = accessKey();
  // ผู้เรียกส่ง _session มาเองได้ (ตอนออกจากระบบต้องใช้ตัวเก่า)
  if (body._session === undefined) body._session = (typeof AUTH !== 'undefined' ? AUTH.session : '') || '';
  payload = body;
  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(function(res){
        if (!res) return reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์'));
        if (res.ok) {
          if (CLIENT_MUTATING.test(action)) markSelfChange();
          return resolve(res.data);
        }
        // หมดอายุระหว่างใช้งาน — พากลับไปหน้าล็อกอินแทนที่จะขึ้นข้อความค้างไว้เฉย ๆ
        if (res.needLogin && typeof onSessionLost === 'function') onSessionLost();
        reject(new Error(res.error));
      })
      .withFailureHandler(function(err){ reject(err); })
      .api(action, payload || {});
  });
}

/** เรียกเมื่อเซิร์ฟเวอร์บอกว่ายังไม่ได้ล็อกอิน (หมดอายุ / ถูกให้ออกจากระบบ) */
var sessionLostAt = 0;
function onSessionLost(){
  if (Date.now() - sessionLostAt < 3000) return;   // หลายคำสั่งพร้อมกันก็เด้งครั้งเดียวพอ
  sessionLostAt = Date.now();
  saveSession('');
  closeModal();
  if (AUTH.device) showPin(); else showLogin('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง');
}

/* ---------------- boot & routing ---------------- */

function boot(){
  // ทาธีมก่อนอย่างอื่น จะได้ไม่เห็นหน้าจอกระพริบขาวตอนเปิด
  applyTheme(lsGet(LS_THEME) || (typeof INIT_THEME === 'string' ? INIT_THEME : 'ตามเครื่อง'));
  // authGate จะอ่านกุญแจจาก URL ของหน้าแม่ให้ด้วย ถ้าตัวแปรไม่มาถึงหน้าเว็บ
  authGate();
}

function bootNow(){
  callApi('app.bootstrap').then(function(b){
    S.boot = b;
    renderNav();
    document.getElementById('navFoot').innerHTML = navFootHtml(b);
    S.version = b.version || 0;
    if (!b.canEdit) document.body.classList.add('readonly');
    // ธีมของเครื่องนี้ชนะเสมอ ถ้ายังไม่เคยตั้งค่อยใช้ของระบบ
    applyTheme(currentTheme());
    go(startPage(b));
    startPolling(b.settings && b.settings.refreshSeconds);
  }).catch(function(e){
    document.getElementById('view').innerHTML =
      '<div class="card"><div class="card-b"><h3>เชื่อมต่อระบบไม่สำเร็จ</h3>' +
      '<p class="muted">' + esc(e.message||e) + '</p>' +
      '<p class="fs13">ตรวจสอบว่า: เปิดชีตแล้วรัน <b>เมนู 🏢 The M Corner AP → 🚀 ติดตั้งทั้งหมดในคลิกเดียว</b> ' +
      'เรียบร้อยแล้ว</p></div></div>';
  });
}

/** หน้าแรกที่จะเปิด — ตามที่ตั้งไว้ แต่ถ้ามี #hash ในลิงก์ให้ hash ชนะ */
function startPage(b){
  var hash = (location.hash || '').replace('#','');
  if (PAGES.some(function(p){ return p.id === hash; })) return hash;
  var map = {
    'แดชบอร์ด':'dashboard', 'รายการสรุปรวม':'debtMain', 'หนี้สิน':'debtSub',
    'รายการซื้อของ':'purchases', 'ซ่อมแซมตามห้อง':'repairs'
  };
  return map[b.settings && b.settings.startPage] || 'dashboard';
}

/** ข้อความมุมล่างซ้าย — เวอร์ชันเว็บแอปจะเขียนทับฟังก์ชันนี้ */
function navFootHtml(b){
  var u = b.user || {};
  return '<b style="color:#c7d0e0">' + esc(u.name || u.label || '') + '</b>' +
    (u.username ? ' <span style="opacity:.7">@' + esc(u.username) + '</span>' : '') +
    '<br><span style="opacity:.8">' + esc(u.role && u.role !== 'none' ? u.role : u.via || '') + '</span>' +
    (b.sheetUrl ? '<br><a href="' + b.sheetUrl + '" target="_blank">เปิด Google Sheet ↗</a>' : '') +
    (u.signedIn && u.username
      ? '<br><a href="javascript:void(0)" onclick="confirmLogout()">ออกจากระบบ</a>'
      : '');
}

function renderNav(){
  var html = '';
  PAGES.forEach(function(p){
    if (p.sec) html += '<div class="nav-sec">' + p.sec + '</div>';
    html += '<button class="nav-item" id="nav-' + p.id + '" onclick="go(\'' + p.id + '\')">' +
              '<span class="ic">' + p.ic + '</span><span>' + p.label + '</span>' +
              '<span class="badge" id="badge-' + p.id + '" style="display:none"></span>' +
            '</button>';
  });
  document.getElementById('navList').innerHTML = html;
}

function go(page){
  S.page = page;
  S.params = {};
  location.hash = page;
  var meta = PAGES.filter(function(p){return p.id===page;})[0] || PAGES[0];
  document.getElementById('pageTitle').textContent = meta.label;
  document.getElementById('pageSub').textContent = meta.sub;
  PAGES.forEach(function(p){
    var el = document.getElementById('nav-' + p.id);
    if (el) el.classList.toggle('on', p.id === page);
  });
  document.getElementById('nav').classList.remove('open');
  removeScrim();
  load();
}

function refresh(){ load(true); }

function setYear(y){
  S.year = y;
  load();
}

function load(force){
  var view = document.getElementById('view');
  view.innerHTML = '<div class="empty"><div class="big"><span class="spin"></span></div>กำลังโหลดข้อมูล…</div>';
  var r = ROUTES[S.page];
  if (!r) { view.innerHTML = '<div class="empty">ไม่พบหน้านี้</div>'; return; }
  r.load().then(function(data){
    S.cache[S.page] = data;
    syncYearOptions(data.years || data.available || []);
    view.innerHTML = r.render(data);
    applyReadOnly(view);
    if (r.after) r.after(data);
  }).catch(function(e){
    view.innerHTML = '<div class="card"><div class="card-b"><h3>โหลดข้อมูลไม่สำเร็จ</h3>' +
                     '<p class="muted">' + esc(e.message||e) + '</p>' +
                     '<button class="btn" onclick="load()">ลองใหม่</button></div></div>';
  });
}

/** เติมตัวเลือกปีในแถบบนให้ตรงกับข้อมูลจริงของหน้านั้น */
function syncYearOptions(years){
  var sel = document.getElementById('yearSel');
  var list = (years || []).slice().sort(function(a,b){return b-a;});
  var cur = new Date().getFullYear();
  if (list.indexOf(cur) < 0) list.unshift(cur);
  var html = '<option value="all">ทุกปี</option>';
  list.forEach(function(y){
    html += '<option value="' + y + '">ปี ' + y + ' (พ.ศ. ' + (Number(y)+543) + ')</option>';
  });
  sel.innerHTML = html;
  if (list.indexOf(Number(S.year)) < 0 && S.year !== 'all') S.year = String(cur);
  sel.value = S.year;
}

/* ---------------- โหมดดูอย่างเดียว ----------------
   ฝั่งเซิร์ฟเวอร์กันไว้แล้วในฟังก์ชัน api() ตรงนี้แค่ซ่อนปุ่มที่กดไปก็ทำไม่ได้
   เพื่อไม่ให้ผู้ที่เปิดด้วยลิงก์แชร์สับสน */
var EDIT_ENTRYPOINTS = /\b(formDebt|formDebtPayment|formPurchase|formAc|formBulkAc|formRepair|formBuilding|formRoom|formFinance|formUser|delDebt|delDebtPayment|delPurchase|delAc|delRepair|delBuilding|delFinance|delUser|doImportJson|doRotateShare|doBackupNow|saveSettingsForm)\s*\(/;

function applyReadOnly(root){
  if (canEdit()) return;
  var nodes = root.querySelectorAll('[onclick]');
  for (var i = 0; i < nodes.length; i++) {
    if (EDIT_ENTRYPOINTS.test(nodes[i].getAttribute('onclick') || '')) nodes[i].remove();
  }
}

/* ---------------- รีเฟรชอัตโนมัติเมื่อข้อมูลในชีตเปลี่ยน ----------------

   กฎเหล็กของส่วนนี้: ห้ามโหลดทับสิ่งที่ผู้ใช้กำลังพิมพ์อยู่เด็ดขาด
   ถ้ามีข้อมูลใหม่ตอนที่ผู้ใช้กำลังกรอกอยู่ ให้ขึ้นปุ่มเล็ก ๆ ให้กดเองเมื่อพร้อม

   หมายเหตุ: รุ่นข้อมูลดูจาก "เวลาที่ชีตถูกแก้ล่าสุด" ของ Google Drive
   ซึ่งขยับทุกครั้งที่มีการเขียน รวมถึงตอนที่เราเองกดบันทึกด้วย
   จึงต้องจดรุ่นใหม่ไว้หลังบันทึกทุกครั้ง ไม่งั้นจะโหลดซ้ำและขึ้นข้อความ
   ว่า "มีคนแก้ข้อมูล" ทั้งที่คนแก้คือผู้ใช้เอง
------------------------------------------------------------------ */

/** คำสั่งที่ทำให้ข้อมูลในชีตเปลี่ยน (ให้ตรงกับ MUTATING_ACTIONS ฝั่งเซิร์ฟเวอร์) */
var CLIENT_MUTATING = /\.(save|delete|savePayment|deletePayment|bulkBook|import|rotateToken|backupNow|upload|trash)$/;

/**
 * เพิ่งกดบันทึกเอง — หน้าโหลดข้อมูลใหม่ไปแล้วตอนกดบันทึก
 * จดรุ่นข้อมูลล่าสุดไว้ และกันไม่ให้รอบตรวจถัดไปโหลดซ้ำ
 * (เผื่อไว้ 2 นาที เพราะ Google Drive อัปเดตเวลาแก้ไขช้ากว่าการเขียนจริงเล็กน้อย)
 */
function markSelfChange(){
  S.selfChangeUntil = Date.now() + 120000;
  clearTimeout(S.syncTimer);
  S.syncTimer = setTimeout(syncVersion, 1500);
}

function syncVersion(){
  callApi('app.version')
    .then(function(v){ if (v && v.version) S.version = v.version; })
    .catch(function(){ /* ไว้รอบหน้า */ });
}

/** ผู้ใช้กำลังกรอกข้อมูลอยู่หรือเปล่า — ถ้าใช่ ห้ามโหลดทับ */
function userIsBusy(){
  var modal = document.getElementById('modalRoot');
  if (modal && modal.innerHTML) return true;              // ฟอร์มเปิดค้างอยู่
  var el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) &&
      el.type !== 'button' && el.type !== 'submit') return true;   // เคอร์เซอร์อยู่ในช่องกรอก
  return false;
}

function refreshLabel(sec){
  if (sec % 3600 === 0) return 'ทุก ' + (sec / 3600) + ' ชั่วโมง';
  if (sec % 60 === 0) return 'ทุก ' + (sec / 60) + ' นาที';
  return 'ทุก ' + sec + ' วินาที';
}

function liveDotIdle(sec){
  var dot = document.getElementById('liveDot');
  if (!dot) return;
  dot.dataset.pending = '';
  dot.innerHTML = '<span class="b ok" title="ตรวจข้อมูลใหม่' + refreshLabel(sec) +
                  ' · จะไม่โหลดทับตอนที่กำลังกรอกข้อมูลอยู่">● สด</span>';
}

/** มีข้อมูลใหม่แต่ผู้ใช้กำลังยุ่ง — บอกไว้เฉย ๆ ให้กดเองเมื่อพร้อม */
function liveDotPending(){
  var dot = document.getElementById('liveDot');
  if (!dot || dot.dataset.pending === '1') return;
  dot.dataset.pending = '1';
  dot.innerHTML = '<button class="b warn" style="border:0;cursor:pointer;font:inherit" ' +
                  'title="มีการแก้ข้อมูลจากที่อื่น กดเพื่อโหลดใหม่เมื่อคุณพร้อม" ' +
                  'onclick="loadPending()">↻ มีข้อมูลใหม่</button>';
}

function loadPending(){
  liveDotIdle(POLL_SECONDS);
  load();
}

var POLL_SECONDS = 0;
var POLL_TIMER = null;

function startPolling(seconds){
  var sec = Number(seconds || 0);
  POLL_SECONDS = sec;
  clearInterval(POLL_TIMER);

  var dot = document.getElementById('liveDot');
  if (!sec) { if (dot) dot.innerHTML = ''; return; }
  liveDotIdle(sec);

  POLL_TIMER = setInterval(function(){
    if (document.hidden) return;
    callApi('app.version').then(function(v){
      if (!v || !v.version || v.version === S.version) return;
      S.version = v.version;

      // เราเป็นคนแก้เอง และหน้าก็โหลดใหม่ไปแล้วตอนกดบันทึก
      if (Date.now() < S.selfChangeUntil) return;

      // กำลังกรอกข้อมูลอยู่ — ห้ามโหลดทับ รอให้ผู้ใช้กดเอง
      if (userIsBusy()) { liveDotPending(); return; }

      load();
      toast('มีการแก้ข้อมูลจากที่อื่น — โหลดใหม่ให้แล้ว');
    }).catch(function(){ /* เน็ตสะดุด ไว้รอบหน้า */ });
  }, sec * 1000);
}

/* ---------------- format helpers ---------------- */

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n, dec){
  var v = Number(n||0);
  return v.toLocaleString('th-TH',{minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function baht(n){ return money(n) + ' ฿'; }
function pct(n){ return (Number(n)||0).toFixed(1) + '%'; }
function num(n){ return n==null||n==='' ? '–' : money(n); }

/** 2026-04-26 -> 26 เม.ย. 2569 */
var TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + ' ' + TH_MON[Number(m[2])-1] + ' ' + (Number(m[1])+543);
}
function thDateShort(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + '/' + Number(m[2]) + '/' + String(Number(m[1])+543).slice(2);
}
function daysAgo(iso){
  if (!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime())/86400000);
}

function statusBadge(st){
  var map = {
    'เสร็จสิ้น':'ok','ดำเนินการแล้ว':'ok','ใช้งานปกติ':'ok','ปิดหนี้แล้ว':'ok','อยู่ในประกัน':'ok','มีผู้เช่า':'ok','ปกติ':'ok',
    'กำลังซ่อม':'info','กำลังดำเนินการ':'info','นัดหมายแล้ว':'info','กำลังผ่อน':'info','ว่าง':'info',
    'รอดำเนินการ':'warn','เลื่อนนัด':'warn','ใกล้หมดประกัน':'warn','ต้องซ่อม':'warn','พักชำระ':'warn','ปิดปรับปรุง':'warn','เกินกำหนด':'warn','ยังไม่เคยล้าง':'warn',
    'ยกเลิก':'mute','ปลดระวาง':'mute','ไม่ระบุ':'mute',
    'หมดอายุแล้ว':'dgr','ด่วนมาก':'dgr','ด่วน':'warn'
  };
  if (!st) return '';

}

function progress(percent, cls){
  var p = Math.max(0, Math.min(100, Number(percent)||0));
  return '<div class="pbar ' + (cls||'') + '"><i style="width:' + p + '%"></i></div>';
}

function thumbsHtml(refs, big){
  if (!refs || !refs.length) return '<span class="faint fs12">–</span>';
  return '<div class="thumbs">' + refs.map(function(r){
    if (r.thumb) {
      return '<img class="thumb' + (big?' big':'') + '" loading="lazy" src="' + esc(r.thumb) + '" ' +
             'onclick="window.open(\'' + esc(r.url) + '\',\'_blank\')" ' +
             'onerror="this.onerror=null;this.replaceWith(fileChip(' + JSON.stringify(JSON.stringify(r)).replace(/"/g,'&quot;') + '))">';
    }
    return '<a class="b info" href="' + esc(r.url) + '" target="_blank">ไฟล์</a>';
  }).join('') + '</div>';
}
function fileChip(json){
  var r = typeof json === 'string' ? JSON.parse(json) : json;
  var a = document.createElement('a');
  a.className = 'b info'; a.href = r.url; a.target = '_blank'; a.textContent = '📎 ไฟล์';

function emptyBox(text, action){
  return '<div class="empty"><div class="big">🗂️</div>' + esc(text) +
         (action ? '<div class="mt12">' + action + '</div>' : '') + '</div>';
}

function barChart(items, labelKey, valueKey, formatter){
  if (!items || !items.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  var max = Math.max.apply(null, items.map(function(i){ return Number(i[valueKey])||0; })) || 1;
  return '<div class="bars">' + items.map(function(i){
    var v = Number(i[valueKey])||0;
    return '<div class="bar-row">' +
      '<div class="clip" title="' + esc(i[labelKey]) + '">' + esc(i[labelKey]) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (v/max*100) + '%"></div></div>' +
      '<div class="v">' + (formatter ? formatter(i) : money(v)) + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ---------------- modal ---------------- */

function openModal(title, bodyHtml, footHtml, wide){

  root.innerHTML =
    '<div class="ov" onclick="if(event.target===this)closeModal()">' +

/* ---------------- toast ---------------- */

function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(function(){ el.remove(); }, kind==='err' ? 5200 : 2800);

function toggleNav(){

  searchTimer = setTimeout(function(){

            '</div></div>';
        }).join('') + '</div>'
        : '<div class="empty">ไม่พบรายการที่ตรงกับคำค้น</div>', '', true);
    }).catch(function(e){ toast(e.message||e, 'err'); });

function jumpPage(module){
  return ({purchases:'purchases', repairs:'repairs', building:'building', ac:'ac', debt:'debtMain', rooms:'rooms'})[module] || 'dashboard';
}
function moduleIcon(module){
  return ({purchases:'🛒', repairs:'🔧', building:'🏢', ac:'❄️', debt:'💰', rooms:'🚪'})[module] || '📄';
}

/* ---------------- file upload ---------------- */

/**
 * อ่านไฟล์จาก <input type=file> เป็น dataURL แล้วส่งขึ้น Drive
 * คืน array ของ {id,name,url,thumb}
 */
function uploadFiles(inputEl, bucket){
  var files = Array.prototype.slice.call(inputEl.files || []);
  if (!files.length) return Promise.resolve([]);
  var MAX = 12 * 1024 * 1024;
  var tooBig = files.filter(function(f){ return f.size > MAX; });
  if (tooBig.length) {
    return Promise.reject(new Error('ไฟล์ใหญ่เกิน 12 MB: ' + tooBig.map(function(f){return f.name;}).join(', ')));
  }
  return Promise.all(files.map(readAsDataUrl))
    .then(function(payloads){ return callApi('file.upload', { bucket: bucket, files: payloads }); });
}

function readAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve({ name: file.name, mimeType: file.type, dataUrl: r.result }); };
    r.onerror = function(){ reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name)); };
    r.readAsDataURL(file);
  });
}

<script>
/* =========================================================
   Auth.html — หน้าล็อกอิน · PIN 6 หลัก · เปลี่ยนรหัสผ่าน

   ที่เก็บของฝั่งเบราว์เซอร์ 2 ชั้น เพราะเว็บแอปของ Apps Script
   ทำงานใน iframe ที่ชื่อโดเมนเปลี่ยนทุกครั้งที่เปิด
   localStorage จึงหายได้ ต้องมีทางสำรอง
     · รหัสอ้างอิงการเข้าใช้งาน (อายุสั้น) — เก็บใน localStorage อย่างเดียว
       หายก็แค่ใส่ PIN ใหม่
     · รหัสอุปกรณ์ (คู่กับ PIN) — เก็บทั้ง localStorage และใน URL ของหน้าแม่
       ผ่าน google.script.history เพื่อให้ยังอยู่หลังปิดเปิดเครื่อง
   ========================================================= */

var AUTH = {
  session: '',
  device: '',
  me: null,
  pin: '',
  screen: ''
};

var LS_SESSION = 'mcorner.session';
var LS_DEVICE  = 'mcorner.device';

/* ---------------- ที่เก็บฝั่งเบราว์เซอร์ ---------------- */

function lsGet(k){
  try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; }
}
function lsSet(k, v){
  try { v ? window.localStorage.setItem(k, v) : window.localStorage.removeItem(k); }
  catch (e) { /* โหมดส่วนตัวหรือปิดคุกกี้ไว้ — ใช้ทางสำรอง */ }
}

/** เขียนรหัสอุปกรณ์ลง URL ของหน้าแม่ ให้รอดข้ามการเปิดใหม่ */
function deviceToUrl(token){
  try {
    if (!window.google || !google.script || !google.script.history) return;
    var params = {};
    if (accessKey()) params.key = accessKey();
    if (token) params.d = token;
    google.script.history.replaceState({}, params, location.hash);
  } catch (e) { /* ไม่ใช่เว็บแอป (เช่นเปิดใน dialog) — ข้ามไป */ }
}

function saveDevice(token){
  AUTH.device = token || '';
  lsSet(LS_DEVICE, AUTH.device);
  deviceToUrl(AUTH.device);
}

function saveSession(token){
  AUTH.session = token || '';
  lsSet(LS_SESSION, AUTH.session);
}

/** อ่านค่าที่เก็บไว้ทั้งหมด (ต้องรอ URL ของหน้าแม่ จึงเป็นแบบ callback) */
function loadStored(done){
  AUTH.session = lsGet(LS_SESSION);
  AUTH.device  = lsGet(LS_DEVICE);

  if (window.google && google.script && google.script.url) {
    try {
      google.script.url.getLocation(function(loc){
        var p = (loc && loc.parameter) || {};
        if (p.d && !AUTH.device) { AUTH.device = String(p.d); lsSet(LS_DEVICE, AUTH.device); }
        if (p.key && !accessKey()) RESOLVED_KEY = String(p.key);
        done();
      });
      return;
    } catch (e) { /* ใช้ทางปกติ */ }
  }
  done();
}

/* ---------------- ตัวคุมลำดับหน้าจอ ---------------- */

/** เรียกตอนเปิดหน้าเว็บ — ตัดสินว่าจะให้เห็นอะไรก่อน */
function authGate(){
  loadStored(function(){
    callApi('auth.me').then(function(me){
      AUTH.me = me;
      if (me.signedIn) return enterApp(me);
      if (AUTH.device) return showPin();
      showLogin();
    }).catch(function(e){
      showLogin(e.message || e);
    });
  });
}

function enterApp(me){
  AUTH.me = me;
  hideAuth();
  bootNow();
  // เพิ่งล็อกอินด้วยรหัสผ่านและยังไม่เคยตั้ง PIN บนเครื่องนี้ — ชวนตั้งสักครั้ง
  if (!AUTH.device && me.username && !lsGet('mcorner.pinAsked')) {
    setTimeout(offerPin, 900);
  }
}

function hideAuth(){
  var r = document.getElementById('authRoot');
  if (r) r.innerHTML = '';
  document.body.classList.remove('locked');
}

function showAuth(html){
  document.body.classList.add('locked');
  document.getElementById('authRoot').innerHTML =
    '<div class="auth-wrap"><div class="auth-card">' +
      '<div class="auth-brand">🏢 <b>' + esc((S.boot && S.boot.app && S.boot.app.name) || 'The M Corner AP') + '</b></div>' +
      html +
    '</div></div>';
}

/* ---------------- หน้าล็อกอินด้วยรหัสผ่าน ---------------- */

function showLogin(err){
  AUTH.screen = 'login';
  showAuth(
    '<h2 class="auth-h">เข้าสู่ระบบ</h2>' +
    '<p class="auth-sub">ใส่ชื่อผู้ใช้และรหัสผ่านที่ได้รับ</p>' +
    (err ? '<div class="auth-err">' + esc(err) + '</div>' : '<div class="auth-err" id="authErr" hidden></div>') +
    '<div class="auth-f"><label for="lgUser">ชื่อผู้ใช้</label>' +
      '<input class="inp" id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
    '<div class="auth-f"><label for="lgPass">รหัสผ่าน</label>' +
      '<input class="inp" id="lgPass" type="password" autocomplete="current-password"></div>' +
    '<button class="btn pri auth-go" id="lgGo">เข้าสู่ระบบ</button>' +
    (AUTH.device ? '<button class="btn auth-alt" onclick="showPin()">← กลับไปใช้ PIN</button>' : '') +
    '<p class="auth-foot">ลืมรหัสผ่าน? ให้ผู้ดูแลตั้งรหัสใหม่ให้จากเมนูในชีต</p>'
  );

  var go = document.getElementById('lgGo');
  var user = document.getElementById('lgUser');
  var pass = document.getElementById('lgPass');

  function submit(){
    var u = user.value.trim(), p = pass.value;
    if (!u || !p) return authError('กรุณากรอกทั้งชื่อผู้ใช้และรหัสผ่าน');
    go.disabled = true;
    go.innerHTML = '<span class="spin"></span> กำลังตรวจสอบ…';
    callApi('auth.login', { username: u, password: p }).then(function(r){
      saveSession(r.session);
      if (r.mustChange) return showChangePassword(true);
      return callApi('auth.me').then(enterApp);
    }).catch(function(e){
      go.disabled = false;
      go.textContent = 'เข้าสู่ระบบ';
      pass.value = '';
      authError(e.message || e);
    });
  }

  go.onclick = submit;
  [user, pass].forEach(function(el){
    el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') submit(); });
  });
  user.focus();
}

function authError(msg){
  var el = document.getElementById('authErr');
  if (el) { el.textContent = msg; el.hidden = false; }
  else showLogin(msg);
}

/* ---------------- หน้า PIN 6 หลัก ---------------- */

function showPin(){
  AUTH.screen = 'pin';
  AUTH.pin = '';
  showAuth(
    '<h2 class="auth-h">ใส่ PIN</h2>' +
    '<p class="auth-sub">ปลดล็อกด้วยรหัส 6 หลักของเครื่องนี้</p>' +
    '<div class="auth-err" id="authErr" hidden></div>' +
    '<div class="pin-dots" id="pinDots">' + pinDotsHtml('') + '</div>' +
    '<div class="pin-pad">' +
      [1,2,3,4,5,6,7,8,9].map(function(n){
        return '<button class="pin-k" onclick="pinPush(\'' + n + '\')">' + n + '</button>';
      }).join('') +
      '<button class="pin-k ghost" onclick="showLogin()" title="ใช้รหัสผ่านแทน">🔑</button>' +
      '<button class="pin-k" onclick="pinPush(\'0\')">0</button>' +
      '<button class="pin-k ghost" onclick="pinBack()" title="ลบ">⌫</button>' +
    '</div>' +
    '<button class="btn auth-alt" onclick="forgetThisDevice()">ลืม PIN — เข้าด้วยรหัสผ่าน</button>'
  );

  // คีย์บอร์ดจริงก็ใช้ได้ ไม่ต้องจิ้มปุ่มบนจอ
  document.onkeydown = function(ev){
    if (AUTH.screen !== 'pin') return;
    if (/^\d$/.test(ev.key)) pinPush(ev.key);
    else if (ev.key === 'Backspace') pinBack();
  };
}

function pinDotsHtml(pin){
  var html = '';
  for (var i = 0; i < 6; i++) html += '<i class="' + (i < pin.length ? 'on' : '') + '"></i>';
  return html;
}

function pinPush(d){
  if (AUTH.pin.length >= 6) return;
  AUTH.pin += d;
  document.getElementById('pinDots').innerHTML = pinDotsHtml(AUTH.pin);
  if (AUTH.pin.length === 6) setTimeout(pinSubmit, 120);
}

function pinBack(){
  AUTH.pin = AUTH.pin.slice(0, -1);
  var d = document.getElementById('pinDots');
  if (d) d.innerHTML = pinDotsHtml(AUTH.pin);
}

function pinSubmit(){
  var pin = AUTH.pin;
  AUTH.pin = '';
  var dots = document.getElementById('pinDots');
  if (dots) dots.classList.add('busy');

  callApi('auth.unlock', { device: AUTH.device, pin: pin }).then(function(r){
    saveSession(r.session);
    document.onkeydown = null;
    return callApi('auth.me').then(enterApp);
  }).catch(function(e){
    var msg = String(e.message || e);
    if (dots) { dots.classList.remove('busy'); dots.classList.add('shake'); dots.innerHTML = pinDotsHtml(''); }
    setTimeout(function(){ if (dots) dots.classList.remove('shake'); }, 500);
    authError(msg);
    // PIN ถูกยกเลิกไปแล้ว (ผิดครบโควตา / หมดอายุ) — ต้องกลับไปใช้รหัสผ่าน
    if (/ล็อกอินด้วยรหัสผ่าน/.test(msg)) {
      saveDevice('');
      setTimeout(function(){ showLogin(msg); }, 1400);
    }
  });
}

function forgetThisDevice(){
  var token = AUTH.device;
  saveDevice('');
  lsSet('mcorner.pinAsked', '');
  document.onkeydown = null;
  if (token) callApi('auth.forgetDevice', { device: token }).catch(function(){ /* หมดอายุไปแล้วก็ช่างมัน */ });
  showLogin();
}

/* ---------------- ตั้ง PIN ---------------- */

/** ชวนตั้ง PIN หลังล็อกอินครั้งแรกบนเครื่องนี้ */
function offerPin(){
  lsSet('mcorner.pinAsked', '1');
  openModal('ตั้ง PIN สำหรับเครื่องนี้',
    '<p>ตั้งรหัส 6 หลักไว้ จะได้ไม่ต้องพิมพ์รหัสผ่านทุกครั้งที่เปิด</p>' +
    '<p class="muted fs13">PIN ผูกกับเครื่องนี้เครื่องเดียว เครื่องอื่นใช้ไม่ได้ · ยกเลิกเมื่อไหร่ก็ได้ในหน้าตั้งค่า</p>',
    '<button class="btn" onclick="closeModal()">ไว้ก่อน</button>' +
    '<button class="btn pri" onclick="closeModal();formSetPin()">ตั้ง PIN เลย</button>');
}

function formSetPin(){
  openModal('ตั้ง PIN 6 หลัก',
    '<div class="fgrid">' +
      '<div class="f full"><label for="pin1">PIN ใหม่</label>' +
        '<input class="inp" id="pin1" type="password" inputmode="numeric" maxlength="6" ' +
        'autocomplete="new-password" placeholder="••••••"></div>' +
      '<div class="f full"><label for="pin2">ใส่ PIN อีกครั้ง</label>' +
        '<input class="inp" id="pin2" type="password" inputmode="numeric" maxlength="6" ' +
        'autocomplete="new-password" placeholder="••••••"></div>' +
      '<div class="f full"><label for="pinDev">ชื่อเครื่อง (ไว้ดูย้อนหลัง)</label>' +
        '<input class="inp" id="pinDev" value="' + esc(guessDeviceName()) + '"></div>' +
    '</div>' +
    '<p class="muted fs13 mt8">หลีกเลี่ยงเลขที่เดาง่าย เช่น 111111 หรือ 123456</p>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="pinGo">บันทึก PIN</button>');

  document.getElementById('pinGo').onclick = function(){
    var a = document.getElementById('pin1').value;
    var b = document.getElementById('pin2').value;
    if (!/^\d{6}$/.test(a)) return toast('PIN ต้องเป็นตัวเลข 6 หลัก', 'err');
    if (a !== b) return toast('PIN สองช่องไม่ตรงกัน', 'err');
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    callApi('auth.setPin', { pin: a, device: document.getElementById('pinDev').value }).then(function(r){
      saveDevice(r.device);
      closeModal();
      toast('ตั้ง PIN เรียบร้อย — ครั้งหน้าใส่แค่ 6 หลัก', 'ok');
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = 'บันทึก PIN';
      toast(e.message || e, 'err');
    });
  };
}

function guessDeviceName(){
  var ua = navigator.userAgent || '';
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows';
  return 'อุปกรณ์ของฉัน';
}

/* ---------------- เปลี่ยนรหัสผ่าน ---------------- */

/** @param {boolean} forced true = ระบบบังคับเปลี่ยนตอนล็อกอินครั้งแรก */
function showChangePassword(forced){
  if (!forced) return formChangePassword();
  AUTH.screen = 'change';
  showAuth(
    '<h2 class="auth-h">ตั้งรหัสผ่านของคุณเอง</h2>' +
    '<p class="auth-sub">รหัสที่ได้มาเป็นรหัสชั่วคราว เปลี่ยนก่อนใช้งานหนึ่งครั้ง</p>' +
    '<div class="auth-err" id="authErr" hidden></div>' +
    '<div class="auth-f"><label for="cpOld">รหัสผ่านเดิม</label>' +
      '<input class="inp" id="cpOld" type="password" autocomplete="current-password"></div>' +
    '<div class="auth-f"><label for="cpNew">รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label>' +
      '<input class="inp" id="cpNew" type="password" autocomplete="new-password"></div>' +
    '<div class="auth-f"><label for="cpNew2">ใส่รหัสผ่านใหม่อีกครั้ง</label>' +
      '<input class="inp" id="cpNew2" type="password" autocomplete="new-password"></div>' +
    '<button class="btn pri auth-go" id="cpGo">บันทึกรหัสผ่านใหม่</button>'
  );

  document.getElementById('cpGo').onclick = function(){
    var o = document.getElementById('cpOld').value;
    var n = document.getElementById('cpNew').value;
    var n2 = document.getElementById('cpNew2').value;
    if (n.length < 8) return authError('รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร');
    if (n !== n2) return authError('รหัสผ่านใหม่สองช่องไม่ตรงกัน');
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    callApi('auth.changePassword', { oldPassword: o, newPassword: n }).then(function(){
      return callApi('auth.me').then(enterApp);
    }).then(function(){
      toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok');
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = 'บันทึกรหัสผ่านใหม่';
      authError(e.message || e);
    });
  };
  document.getElementById('cpOld').focus();
}

function formChangePassword(){
  openModal('เปลี่ยนรหัสผ่าน',
    '<div class="fgrid">' +
      '<div class="f full"><label for="mcOld">รหัสผ่านเดิม</label><input class="inp" id="mcOld" type="password"></div>' +
      '<div class="f full"><label for="mcNew">รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label><input class="inp" id="mcNew" type="password"></div>' +
      '<div class="f full"><label for="mcNew2">ใส่รหัสผ่านใหม่อีกครั้ง</label><input class="inp" id="mcNew2" type="password"></div>' +
    '</div>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="mcGo">บันทึก</button>');

  document.getElementById('mcGo').onclick = function(){
    var n = document.getElementById('mcNew').value;
    if (n.length < 8) return toast('รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร', 'err');
    if (n !== document.getElementById('mcNew2').value) return toast('รหัสผ่านใหม่สองช่องไม่ตรงกัน', 'err');
    var btn = this;
    btn.disabled = true;
    callApi('auth.changePassword', {
      oldPassword: document.getElementById('mcOld').value, newPassword: n
    }).then(function(){
      closeModal();
      toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok');
    }).catch(function(e){
      btn.disabled = false;
      toast(e.message || e, 'err');
    });
  };
}

/* ---------------- ออกจากระบบ ---------------- */

function doLogout(keepPin){
  var s = AUTH.session;
  saveSession('');
  if (!keepPin) { var d = AUTH.device; saveDevice(''); if (d) callApi('auth.forgetDevice', { device: d }).catch(function(){}); }
  if (s) callApi('auth.logout', { _session: s }).catch(function(){ /* หมดอายุแล้วก็ถือว่าออกแล้ว */ });
  closeModal();
  AUTH.me = null;
  if (AUTH.device) showPin(); else showLogin();
}

function confirmLogout(){
  openModal('ออกจากระบบ',
    '<p>ต้องการออกจากระบบใช่ไหม</p>' +
    (AUTH.device ? '<p class="muted fs13">PIN บนเครื่องนี้จะยังอยู่ ครั้งหน้าเข้าด้วย PIN ได้เลย</p>' : ''),
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    (AUTH.device ? '<button class="btn dgr" onclick="doLogout(false)">ออกและลบ PIN</button>' : '') +
    '<button class="btn pri" onclick="doLogout(true)">ออกจากระบบ</button>');
}
</script>
<script>
/* =========================================================
   Views.html — ตัวโหลด + ตัววาดของแต่ละหน้า
   ========================================================= */

var ROUTES = {};

/* ============================================================
   1) ภาพรวม
   ============================================================ */
ROUTES.dashboard = {
  load: function(){ return callApi('app.dashboard', { year: S.year }); },
  render: function(d){
    var b = d.building;
    var kpis =
      kpi('ยอดหนี้คงเหลือทั้งหมด', baht(d.debtAll.remaining),
          'จากยอดหนี้ ' + baht(d.debtAll.totalDebt) + ' · ชำระแล้ว ' + pct(d.debtAll.percent), 'accent') +
      kpi('ชำระแล้ว (หนี้หลัก)', pct(d.debtMain.percent), baht(d.debtMain.paid) + ' จาก ' + baht(d.debtMain.total), 'good') +
      kpi('ค่าใช้จ่ายปี ' + d.year, baht(d.spendThisYear), 'ซื้อของ + ซ่อมแซม + ล้างแอร์') +
      kpi('งานซ่อมค้าง', d.repairs.openJobs + ' งาน', d.repairs.overdue + ' งานเกินกำหนด', d.repairs.overdue ? 'bad' : '');

    var alerts = d.alerts.length
      ? '<div class="alist">' + d.alerts.slice(0,12).map(function(a){
          return '<div class="ali l-' + a.level + '" onclick="go(\'' + jumpPage(a.module) + '\')">' +
                 '<div class="ic">' + a.icon + '</div><div><div class="tt">' + esc(a.title) + '</div>' +
                 '<div class="dd">' + esc(a.detail) + '</div></div></div>';
        }).join('') + '</div>'
      : '<div class="empty"><div class="big">✅</div>ไม่มีงานค้าง — ทุกอย่างเรียบร้อย</div>';

    return '' +
      '<div class="grid g4 mb12">' + kpis + '</div>' +

      '<div class="grid g2 mb12">' +
        card('💰 รายการสรุปรวม (หนี้หลัก)',
          debtMini(d.debtMain, 'debtMain'),
          '<button class="btn sm" onclick="go(\'debtMain\')">ดูทั้งหมด →</button>') +
        card('🧾 หนี้สิน (หนี้รอง)',
          debtMini(d.debtSub, 'debtSub') +
          (d.debtSub.interestThisYear ? '<div class="fs12 muted mt8">ดอกเบี้ยที่ชำระปี ' + d.year + ': <b>' + baht(d.debtSub.interestThisYear) + '</b></div>' : ''),
          '<button class="btn sm" onclick="go(\'debtSub\')">ดูทั้งหมด →</button>') +
      '</div>' +

      '<div class="grid g4 mb12">' +
        kpi('ห้องทั้งหมด', b.totalRooms + ' ห้อง', 'มีผู้เช่า ' + b.occupied + ' · ว่าง ' + b.vacant) +
        kpi('ล้างแอร์ปี ' + d.year, d.ac.roomsDone + '/' + b.totalRooms + ' ห้อง', d.ac.doneInYear + ' รอบ · ค้าง ' + d.ac.roomsPending + ' ห้อง', d.ac.roomsPending ? 'warn' : 'good') +
        kpi('ซื้อของปี ' + d.year, baht(d.purchases.yearTotal), d.purchases.yearCount + ' รายการ') +
        kpi('ประกันใกล้หมด', d.purchases.warranty.expiring + ' รายการ', 'หมดอายุแล้ว ' + d.purchases.warranty.expired, d.purchases.warranty.expiring ? 'warn' : '') +
      '</div>' +

      '<div class="grid g2 mb12">' +
        card('📒 รายรับ-รายจ่ายหอ ปี ' + d.year,
          '<div class="grid g3 mb12">' +
            kpi('รายรับ', baht(d.finance.income), 'เฉลี่ย ' + baht(d.finance.avgIncome) + '/เดือน', 'good') +
            kpi('รายจ่าย', baht(d.finance.expense), 'เฉลี่ย ' + baht(d.finance.avgExpense) + '/เดือน', 'bad') +
            kpi('คงเหลือสุทธิ', baht(d.finance.net), 'อัตรากำไร ' + pct(d.finance.margin)) +
          '</div>' + miniMonthChart(d.finance.byMonth),
          '<button class="btn sm" onclick="go(\'finance\')">ดูทั้งหมด →</button>') +
        card('🗓️ งานที่กำลังจะถึง (' + d.upcoming.length + ')',
          d.upcoming.length ? '<div class="alist">' + d.upcoming.slice(0,7).map(function(u){
            var lvl = u.daysLeft < 0 ? 'danger' : (u.daysLeft <= 7 ? 'warn' : 'info');
            return '<div class="ali l-' + lvl + '" onclick="go(\'' + jumpPage(u.module) + '\')">' +
              '<div class="ic">' + u.icon + '</div><div><div class="tt">' + esc(u.title) + '</div>' +
              '<div class="dd">' + thDate(u.date) + ' · ' +
                (u.daysLeft < 0 ? 'เลยกำหนด ' + (-u.daysLeft) + ' วัน' : (u.daysLeft === 0 ? 'วันนี้' : 'อีก ' + u.daysLeft + ' วัน')) +
              '</div></div></div>';
          }).join('') + '</div>' : '<div class="empty"><div class="big">🌤️</div>ไม่มีงานนัดหมายเร็ว ๆ นี้</div>',
          '<button class="btn sm" onclick="go(\'reports\')">ปฏิทินเต็ม →</button>', true) +
      '</div>' +

      '<div class="grid g2">' +
        card('🔔 สิ่งที่ต้องทำ (' + d.alerts.length + ')', alerts, '', true) +
        card('🏢 งานซ่อมแซมตึกโดยรวม',
          '<div class="grid g2">' +
            kpi('งานปี ' + d.year, d.buildingRepairs.yearCount + ' งาน', 'ค้าง ' + d.buildingRepairs.openCount) +
            kpi('ค่าใช้จ่าย', baht(d.buildingRepairs.yearCost), 'ครบกำหนดเร็ว ๆ นี้ ' + d.buildingRepairs.upcoming) +
          '</div>' +
          (d.debtMain.forecast && d.debtMain.forecast.monthsLeft
            ? '<div class="hr"></div><div class="fs13"><b>ประมาณการปิดหนี้หลัก</b><div class="muted mt8">' +
              'จากอัตราชำระเฉลี่ย ' + baht(d.debtMain.forecast.avgPerMonth) + '/เดือน (12 เดือนล่าสุด) ' +
              'คาดว่าอีก <b>' + d.debtMain.forecast.monthsLeft + ' เดือน</b> ' +
              '(ราว ' + thDate(d.debtMain.forecast.payoffDate) + ')</div></div>'
            : ''),
          '<button class="btn sm" onclick="go(\'building\')">ดูทั้งหมด →</button>') +
      '</div>';
  },
  after: function(d){
    setBadge('repairs', d.repairs.openJobs);
    setBadge('ac', d.ac.roomsPending);
  }
};

function miniMonthChart(byMonth){
  var max = Math.max.apply(null, byMonth.map(function(m){ return Math.max(m.income, m.expense); })) || 1;
  return '<div style="display:flex;gap:3px;align-items:flex-end;height:74px">' + byMonth.map(function(m){
    var hi = Math.round(m.income / max * 66), he = Math.round(m.expense / max * 66);
    return '<div style="flex:1;text-align:center" title="' + m.label + ' · รับ ' + money(m.income) + ' · จ่าย ' + money(m.expense) + '">' +
      '<div style="display:flex;gap:1px;align-items:flex-end;justify-content:center;height:66px">' +
        '<div style="width:6px;height:' + hi + 'px;background:var(--ok);border-radius:2px 2px 0 0"></div>' +
        '<div style="width:6px;height:' + he + 'px;background:var(--danger);border-radius:2px 2px 0 0"></div>' +
      '</div><div class="faint" style="font-size:9.5px">' + m.label.replace('.','') + '</div></div>';
  }).join('') + '</div>' +
  '<div class="row fs12 muted mt8"><span class="b ok">รายรับ</span><span class="b dgr">รายจ่าย</span></div>';
}

function debtMini(x, page){
  return '<div class="pmeta" style="margin:0 0 6px"><span>ชำระแล้ว <b>' + baht(x.paid) + '</b></span>' +
         '<span><b>' + pct(x.percent) + '</b></span></div>' +
         progress(x.percent, 'lg') +
         '<div class="pmeta"><span>คงเหลือ <b>' + baht(x.remaining) + '</b></span>' +
         '<span>ยอดหนี้ทั้งหมด <b>' + baht(x.total) + '</b></span></div>' +

function debtRoute(ledger, title){
  return {
    load: function(){
      return Promise.all([
        callApi('debt.summary', { ledger: ledger, year: S.year }),
        callApi('debt.payments', { ledger: ledger, year: S.year })
      ]).then(function(r){
        var d = r[0]; d.payments = r[1]; d.ledger = ledger; d.pageTitle = title;
        return d;
      });
    },
    render: renderDebt,

  };
}

          '<td class="num"><b>' + money(p.amount) + '</b></td>' +
          '<td class="fs12">' + esc(p.channel || '–') + '</td>' +
          '<td>' + thumbsHtml(p.slipRefs) + '</td>' +
          '<td class="fs12 muted clip">' + esc(p.note || '') + '</td>' +
          '<td><div class="t-actions">' +
            '<button class="btn sm icon" onclick=\'formDebtPayment(' + attr(p) + ',"' + d.ledger + '")\'>✏️</button>' +
            '<button class="btn sm icon dgr" onclick="delDebtPayment(\'' + p.id + '\')">🗑</button>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table></div>'
    : emptyBox('ยังไม่มีรายการชำระใน' + yearLabel,
        '<button class="btn pri" onclick="formDebtPayment(null,\'' + d.ledger + '\')">+ บันทึกการชำระ</button>'),
    '', true);

  return head + perDebt + byYear + '<div class="mt12">' + list + '</div>';
}

/**
 * บิลที่มีของหลายอย่าง — แสดงเป็นปุ่มกางดู ไม่ให้ตารางยาวเกินไป
 * บิลที่มีรายการเดียวหรือไม่มีรายการย่อยเลย ไม่ต้องแสดงอะไรเพิ่ม
 */
function billHtml(p){
  var b = p.bill;
  if (!b || b.count < 2) return '';
  var id = 'bill_' + p.id;
  return '<button type="button" class="bill-toggle" onclick="toggleBill(\'' + id + '\')">' +
      '🧾 ' + b.count + ' รายการในบิล ▾</button>' +
    '<div class="bill-lines" id="' + id + '" hidden>' +
      b.lines.map(function(l){
        return '<div class="bill-line">' +
          '<span class="nm" title="' + esc(l.name) + '">' + esc(l.name) + '</span>' +
          '<span class="qt">' + num(l.qty) + (l.unit ? ' ' + esc(l.unit) : '') + ' × ' + money(l.unitPrice, 2) + '</span>' +
          '<span class="tt">' + money(l.total, 2) + '</span></div>';
      }).join('') +
      ((b.shipping || b.discount)
        ? '<div class="bill-extra">' +
            (b.shipping ? 'ค่าส่ง ' + money(b.shipping, 2) : '') +
            (b.shipping && b.discount ? ' · ' : '') +
            (b.discount ? 'ส่วนลด −' + money(b.discount, 2) : '') + '</div>'
        : '') +
    '</div>';
}

function toggleBill(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.hidden = !el.hidden;
  var btn = el.previousElementSibling;
  if (btn) btn.textContent = btn.textContent.replace(el.hidden ? '▴' : '▾', el.hidden ? '▾' : '▴');
}

function setParam(key, val){
  S.params[key] = val;
  load();
}

      : emptyBox('ยังไม่มีบันทึกการล้างแอร์ใน' + yearLabel), '', true);

    return head + actions + grid + '<div class="mt12">' + list + '</div>';

function openAcRoom(room){

  var body =
    '<div class="grid g3 mb12">' +
      kpi('รอบที่ล้างในปีนี้', (r.roundsInYear||0) + ' รอบ', '') +

      kpi('ครบกำหนดรอบถัดไป', r.nextDue ? thDate(r.nextDue) : '–', r.state, r.state === 'เกินกำหนด' ? 'bad' : '') +
    '</div>' +
    (r.records.length
      ? '<div class="tw"><table class="t" style="min-width:auto"><thead><tr><th>รอบ</th><th>นัด</th><th>ดำเนินการ</th><th>สถานะ</th><th>ภาพ</th><th></th></tr></thead><tbody>' +
        r.records.map(function(x){
          return '<tr><td>' + (x.round||1) + '</td><td class="fs12">' + thDate(x.bookDate) + '</td>' +

            '<td>' + thumbsHtml(x.photoRefs) + '</td>' +
            '<td><button class="btn sm" onclick=\'closeModal();formAc(' + attr(x) + ')\'>แก้ไข</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="empty">ยังไม่มีบันทึกในปีที่เลือก</div>');

  openModal('❄️ ล้างแอร์ · ห้อง ' + room, body,
