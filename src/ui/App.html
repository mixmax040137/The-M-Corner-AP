<script>
/* =========================================================
   App.html — core: state, api, router, format, modal, upload
   ========================================================= */

var S = {
  boot: null,          // ข้อมูลตั้งต้นจาก app.bootstrap
  page: 'dashboard',
  year: String(new Date().getFullYear()),
  cache: {},           // เก็บผลลัพธ์ล่าสุดของแต่ละหน้า
  params: {},          // ตัวกรองย่อยของแต่ละหน้า เช่น {room:'311', status:'all'}
  busy: false,
  version: 0,          // รุ่นข้อมูลที่หน้านี้ถืออยู่
  selfChangeUntil: 0,  // เพิ่งกดบันทึกเอง — อย่าเด้งว่า "มีคนแก้ข้อมูล"
  syncTimer: null
};

var ALL_DEBTS = [];

var PAGES = [
  { id:'dashboard', ic:'📊', label:'ภาพรวม',              sub:'แดชบอร์ดรวมทุกส่วนของหอพัก',        sec:'ภาพรวม' },
  { id:'debtMain',  ic:'💰', label:'รายการสรุปรวม',       sub:'บัญชีโอนใช้หนี้หลักของหอพัก',        sec:'การเงิน' },
  { id:'debtSub',   ic:'🧾', label:'หนี้สิน',              sub:'บัญชีโอนใช้หนี้รองของหอพัก' },
  { id:'purchases', ic:'🛒', label:'รายการซื้อของ',        sub:'ของเข้าหอพัก ราคา ประกัน และสลิป' },
  { id:'finance',   ic:'📒', label:'รายรับ-รายจ่ายหอ',      sub:'ค่าเช่าที่เก็บได้ · ค่าไฟ · ค่าน้ำ · ค่าเน็ต · ภาษี' },
  { id:'ac',        ic:'❄️', label:'ล้างแอร์',            sub:'ตารางล้างแอร์รายห้อง 24 ห้อง',      sec:'ซ่อมบำรุง' },
  { id:'repairs',   ic:'🔧', label:'ซ่อมแซมตามห้อง',      sub:'งานแจ้งซ่อมแยกตามห้อง' },
  { id:'building',  ic:'🏢', label:'ซ่อมแซมตึกโดยรวม',    sub:'งานส่วนกลางของอาคาร' },
  { id:'rooms',     ic:'🚪', label:'ห้องพัก',             sub:'ทะเบียนห้องและประวัติรายห้อง',       sec:'ข้อมูล' },
  { id:'reports',   ic:'📈', label:'รายงาน & สำรองข้อมูล', sub:'ค่าใช้จ่ายรายห้อง · ปฏิทินงาน · ส่งออกข้อมูล' },
  { id:'settings',  ic:'⚙️', label:'ตั้งค่า',              sub:'บัญชี · ธีม · ผู้ใช้ · ลิงก์เข้าใช้งาน',   sec:'ระบบ' }
];

/* ---------------- API ---------------- */

/** กุญแจที่จะแนบไปกับทุกคำสั่ง — มี 2 ทางสำรองเผื่อทางแรกไม่มา */
var RESOLVED_KEY = null;

function accessKey(){
  if (RESOLVED_KEY !== null) return RESOLVED_KEY;
  RESOLVED_KEY = (typeof ACCESS_KEY === 'string' && ACCESS_KEY) ? ACCESS_KEY : '';
  return RESOLVED_KEY;
}

/** true ถ้าเปิดด้วยลิงก์ผู้ดูแล — ใช้แทนตัวแปร CAN_EDIT ตรง ๆ ที่อาจไม่ถูกประกาศ */
function canEdit(){
  if (typeof CAN_EDIT !== 'undefined') return !!CAN_EDIT;
  return !!(S.boot && S.boot.canEdit);
}

function callApi(action, payload){
  var body = {};
  Object.keys(payload || {}).forEach(function(k){ body[k] = payload[k]; });
  body._key = accessKey();
  // ผู้เรียกส่ง _session มาเองได้ (ตอนออกจากระบบต้องใช้ตัวเก่า)
  if (body._session === undefined) body._session = (typeof AUTH !== 'undefined' ? AUTH.session : '') || '';
  payload = body;
  var mutating = CLIENT_MUTATING.test(action);
  if (mutating) syncSet('saving');

  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(function(res){
        if (!res) { if (mutating) syncSet('offline'); return reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); }
        if (res.ok) {
          if (mutating) { markSelfChange(); syncSet('saved'); }
          return resolve(res.data);
        }
        // หมดอายุระหว่างใช้งาน — พากลับไปหน้าล็อกอินแทนที่จะขึ้นข้อความค้างไว้เฉย ๆ
        if (res.needLogin && typeof onSessionLost === 'function') onSessionLost();
        if (mutating) syncSet('error', res.error);
        reject(new Error(res.error));
      })
      .withFailureHandler(function(err){
        // เน็ตสะดุด — ของที่กรอกไว้ยังอยู่ในฟอร์ม ไม่หายไปไหน
        if (mutating) syncSet(isOfflineError(err) ? 'offline' : 'error', (err && err.message) || String(err));
        reject(err);
      })
      .api(action, payload || {});
  });
}

/** เรียกเมื่อเซิร์ฟเวอร์บอกว่ายังไม่ได้ล็อกอิน (หมดอายุ / ถูกให้ออกจากระบบ) */
var sessionLostAt = 0;
function onSessionLost(){
  if (Date.now() - sessionLostAt < 3000) return;   // หลายคำสั่งพร้อมกันก็เด้งครั้งเดียวพอ
  sessionLostAt = Date.now();
  saveSession('');
  closeModal();
  if (AUTH.device) showPin(); else showLogin('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง');
}

/* ---------------- boot & routing ---------------- */

function boot(){
  // ทาธีมก่อนอย่างอื่น จะได้ไม่เห็นหน้าจอกระพริบขาวตอนเปิด
  applyTheme(lsGet(LS_THEME) || (typeof INIT_THEME === 'string' ? INIT_THEME : 'ตามเครื่อง'));
  // authGate จะอ่านกุญแจจาก URL ของหน้าแม่ให้ด้วย ถ้าตัวแปรไม่มาถึงหน้าเว็บ
  authGate();
}

function bootNow(){
  callApi('app.bootstrap').then(function(b){
    S.boot = b;
    renderNav();
    document.getElementById('navFoot').innerHTML = navFootHtml(b);
    S.version = b.version || 0;
    if (!b.canEdit) document.body.classList.add('readonly');
    // ธีมของเครื่องนี้ชนะเสมอ ถ้ายังไม่เคยตั้งค่อยใช้ของระบบ
    applyTheme(currentTheme());
    go(startPage(b));
    refreshAlerts();
    startPolling(b.settings && b.settings.refreshSeconds);
  }).catch(function(e){
    document.getElementById('view').innerHTML =
      '<div class="card"><div class="card-b"><h3>เชื่อมต่อระบบไม่สำเร็จ</h3>' +
      '<p class="muted">' + esc(e.message||e) + '</p>' +
      '<p class="fs13">ตรวจสอบว่า: เปิดชีตแล้วรัน <b>เมนู 🏢 The M Corner AP → 🚀 ติดตั้งทั้งหมดในคลิกเดียว</b> ' +
      'เรียบร้อยแล้ว</p></div></div>';
  });
}

/** หน้าแรกที่จะเปิด — ตามที่ตั้งไว้ แต่ถ้ามี #hash ในลิงก์ให้ hash ชนะ */
function startPage(b){
  var hash = (location.hash || '').replace('#','');
  if (PAGES.some(function(p){ return p.id === hash; })) return hash;
  var map = {
    'แดชบอร์ด':'dashboard', 'รายการสรุปรวม':'debtMain', 'หนี้สิน':'debtSub',
    'รายการซื้อของ':'purchases', 'ซ่อมแซมตามห้อง':'repairs'
  };
  return map[b.settings && b.settings.startPage] || 'dashboard';
}

/** ข้อความมุมล่างซ้าย — เวอร์ชันเว็บแอปจะเขียนทับฟังก์ชันนี้ */
function navFootHtml(b){
  var u = b.user || {};
  return '<b style="color:#c7d0e0">' + esc(u.name || u.label || '') + '</b>' +
    (u.username ? ' <span style="opacity:.7">@' + esc(u.username) + '</span>' : '') +
    '<br><span style="opacity:.8">' + esc(u.role && u.role !== 'none' ? u.role : u.via || '') + '</span>' +
    (b.sheetUrl ? '<br><a href="' + b.sheetUrl + '" target="_blank">เปิด Google Sheet ↗</a>' : '') +
    (u.signedIn && u.username
      ? '<br><a href="javascript:void(0)" onclick="confirmLogout()">ออกจากระบบ</a>'
      : '');
}

function renderNav(){
  var html = '';
  PAGES.forEach(function(p){
    if (p.sec) html += '<div class="nav-sec">' + p.sec + '</div>';
    html += '<button class="nav-item" id="nav-' + p.id + '" onclick="go(\'' + p.id + '\')">' +
              '<span class="ic">' + p.ic + '</span><span>' + p.label + '</span>' +
              '<span class="badge" id="badge-' + p.id + '" style="display:none"></span>' +
            '</button>';
  });
  document.getElementById('navList').innerHTML = html;
}

function go(page){
  S.page = page;
  S.params = {};
  location.hash = page;
  var meta = PAGES.filter(function(p){return p.id===page;})[0] || PAGES[0];
  document.getElementById('pageTitle').textContent = meta.label;
  document.getElementById('pageSub').textContent = meta.sub;
  PAGES.forEach(function(p){
    var el = document.getElementById('nav-' + p.id);
    if (el) el.classList.toggle('on', p.id === page);
  });
  document.getElementById('nav').classList.remove('open');
  removeScrim();
  load();
}

function refresh(){ load({ quiet: true }); }

function setYear(y){
  S.year = y;
  load();
}

/**
 * โหลดข้อมูลของหน้าปัจจุบัน
 *
 * @param {{quiet:boolean}=} opts
 *   quiet = ซิงก์เงียบ ๆ เบื้องหลัง ไม่ล้างหน้าเป็นวงกลมหมุน และคืนตำแหน่งที่เลื่อนค้างไว้
 *           ใช้หลังกดบันทึก และตอนพบว่ามีคนแก้ข้อมูลจากที่อื่น
 *           เพื่อให้หน้าจอนิ่งที่สุด ไม่กระพริบและไม่เด้งกลับไปบนสุด
 */
function load(opts){
  opts = (opts === true) ? {} : (opts || {});     // เผื่อโค้ดเก่าที่เรียก load(true)
  var quiet = !!opts.quiet;
  var view = document.getElementById('view');
  var r = ROUTES[S.page];
  if (!r) { view.innerHTML = '<div class="empty">ไม่พบหน้านี้</div>'; return Promise.resolve(); }

  if (!quiet) {
    view.innerHTML = '<div class="empty"><div class="big"><span class="spin"></span></div>กำลังโหลดข้อมูล…</div>';
  } else {
    syncSet('syncing');
  }

  var keep = quiet ? snapshotView() : null;

  return r.load().then(function(data){
    S.cache[S.page] = data;
    syncYearOptions(data.years || data.available || []);
    view.innerHTML = r.render(data);
    applyReadOnly(view);
    if (r.after) r.after(data);
    if (keep) restoreView(keep);
    if (quiet) syncSet('synced');
  }).catch(function(e){
    if (quiet) {                       // ซิงก์เบื้องหลังพลาด — อย่าทิ้งของที่เห็นอยู่
      syncSet(isOfflineError(e) ? 'offline' : 'error', e.message || e);
      return;
    }
    view.innerHTML = '<div class="card"><div class="card-b"><h3>โหลดข้อมูลไม่สำเร็จ</h3>' +
                     '<p class="muted">' + esc(e.message||e) + '</p>' +
                     '<button class="btn" onclick="load()">ลองใหม่</button></div></div>';
  });
}

/** จำสภาพหน้าจอไว้ก่อนวาดใหม่ เพื่อให้ผู้ใช้รู้สึกว่าหน้าไม่ได้ถูกโหลดใหม่ */
function snapshotView(){
  var open = [];
  document.querySelectorAll('.bill-lines').forEach(function(el){
    if (!el.hidden) open.push(el.id);
  });
  return { y: window.scrollY || 0, open: open };
}

function restoreView(keep){
  keep.open.forEach(function(id){
    var el = document.getElementById(id);
    if (el) { el.hidden = false; var b = el.previousElementSibling;
              if (b) b.textContent = b.textContent.replace('▾', '▴'); }
  });
  if (keep.y) window.scrollTo(0, keep.y);
}

/** เติมตัวเลือกปีในแถบบนให้ตรงกับข้อมูลจริงของหน้านั้น */
function syncYearOptions(years){
  var sel = document.getElementById('yearSel');
  var list = (years || []).slice().sort(function(a,b){return b-a;});
  var cur = new Date().getFullYear();
  if (list.indexOf(cur) < 0) list.unshift(cur);
  var html = '<option value="all">ทุกปี</option>';
  list.forEach(function(y){
    html += '<option value="' + y + '">ปี ' + y + ' (พ.ศ. ' + (Number(y)+543) + ')</option>';
  });
  sel.innerHTML = html;
  if (list.indexOf(Number(S.year)) < 0 && S.year !== 'all') S.year = String(cur);
  sel.value = S.year;
}

/* ---------------- โหมดดูอย่างเดียว ----------------
   ฝั่งเซิร์ฟเวอร์กันไว้แล้วในฟังก์ชัน api() ตรงนี้แค่ซ่อนปุ่มที่กดไปก็ทำไม่ได้
   เพื่อไม่ให้ผู้ที่เปิดด้วยลิงก์แชร์สับสน */
var EDIT_ENTRYPOINTS = /\b(formDebt|formDebtPayment|formPurchase|formAc|formBulkAc|formRepair|formBuilding|formRoom|formFinance|formUser|delDebt|delDebtPayment|delPurchase|delAc|delRepair|delBuilding|delFinance|delUser|doImportJson|doRotateShare|doBackupNow|saveSettingsForm)\s*\(/;

function applyReadOnly(root){
  if (canEdit()) return;
  var nodes = root.querySelectorAll('[onclick]');
  for (var i = 0; i < nodes.length; i++) {
    if (EDIT_ENTRYPOINTS.test(nodes[i].getAttribute('onclick') || '')) nodes[i].remove();
  }
}

/* ---------------- รีเฟรชอัตโนมัติเมื่อข้อมูลในชีตเปลี่ยน ----------------

   กฎเหล็กของส่วนนี้: ห้ามโหลดทับสิ่งที่ผู้ใช้กำลังพิมพ์อยู่เด็ดขาด
   ถ้ามีข้อมูลใหม่ตอนที่ผู้ใช้กำลังกรอกอยู่ ให้ขึ้นปุ่มเล็ก ๆ ให้กดเองเมื่อพร้อม

   หมายเหตุ: รุ่นข้อมูลดูจาก "เวลาที่ชีตถูกแก้ล่าสุด" ของ Google Drive
   ซึ่งขยับทุกครั้งที่มีการเขียน รวมถึงตอนที่เราเองกดบันทึกด้วย
   จึงต้องจดรุ่นใหม่ไว้หลังบันทึกทุกครั้ง ไม่งั้นจะโหลดซ้ำและขึ้นข้อความ
   ว่า "มีคนแก้ข้อมูล" ทั้งที่คนแก้คือผู้ใช้เอง
------------------------------------------------------------------ */

/** คำสั่งที่ทำให้ข้อมูลในชีตเปลี่ยน (ให้ตรงกับ MUTATING_ACTIONS ฝั่งเซิร์ฟเวอร์) */
var CLIENT_MUTATING = /\.(save|delete|savePayment|deletePayment|bulkBook|import|rotateToken|backupNow|upload|trash)$/;

/**
 * เพิ่งกดบันทึกเอง — หน้าโหลดข้อมูลใหม่ไปแล้วตอนกดบันทึก
 * จดรุ่นข้อมูลล่าสุดไว้ และกันไม่ให้รอบตรวจถัดไปโหลดซ้ำ
 * (เผื่อไว้ 2 นาที เพราะ Google Drive อัปเดตเวลาแก้ไขช้ากว่าการเขียนจริงเล็กน้อย)
 */
function markSelfChange(){
  S.selfChangeUntil = Date.now() + 120000;
  clearTimeout(S.syncTimer);
  S.syncTimer = setTimeout(function(){
    syncVersion();
    refreshAlerts();     // งานค้างอาจเพิ่มหรือลดจากสิ่งที่เพิ่งบันทึกไป
  }, 1500);
}

function syncVersion(){
  callApi('app.version')
    .then(function(v){ if (v && v.version) S.version = v.version; })
    .catch(function(){ /* ไว้รอบหน้า */ });
}

/** ผู้ใช้กำลังกรอกข้อมูลอยู่หรือเปล่า — ถ้าใช่ ห้ามโหลดทับ */
function userIsBusy(){
  var modal = document.getElementById('modalRoot');
  if (modal && modal.innerHTML) return true;              // ฟอร์มเปิดค้างอยู่
  var el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) &&
      el.type !== 'button' && el.type !== 'submit') return true;   // เคอร์เซอร์อยู่ในช่องกรอก
  return false;
}

function refreshLabel(sec){
  if (!sec) return 'ปิดการตรวจอัตโนมัติ';
  if (sec % 3600 === 0) return 'ตรวจข้อมูลใหม่ทุก ' + (sec / 3600) + ' ชั่วโมง';
  if (sec % 60 === 0) return 'ตรวจข้อมูลใหม่ทุก ' + (sec / 60) + ' นาที';
  return 'ตรวจข้อมูลใหม่ทุก ' + sec + ' วินาที';
}

/* ---------------- ตัวบอกสถานะการซิงก์ (มุมขวาบน) ----------------

   หน้าที่: บอกให้รู้ตลอดว่าตอนนี้ข้อมูลตรงกับหลังบ้านหรือยัง
   กำลังบันทึกอยู่ไหม หรือมีอะไรค้างที่ต้องจัดการ

   ตั้งใจให้ "เงียบเมื่อทุกอย่างปกติ และชัดเจนเมื่อมีอะไรผิดปกติ"
   สถานะที่ต้องให้ผู้ใช้ทำอะไรต่อ (มีข้อมูลใหม่ / เชื่อมต่อไม่ได้) กดได้
------------------------------------------------------------------ */

var SYNC = { state: 'synced', detail: '', at: 0, timer: null };

var SYNC_LOOK = {
  synced:  { cls: 'ok',   icon: '●',  text: 'ซิงก์แล้ว' },
  syncing: { cls: 'info', icon: '',   text: 'กำลังซิงก์…',   spin: true },
  saving:  { cls: 'info', icon: '',   text: 'กำลังบันทึก…',  spin: true },
  saved:   { cls: 'ok',   icon: '✓',  text: 'บันทึกแล้ว' },
  pending: { cls: 'warn', icon: '↻',  text: 'มีข้อมูลใหม่',  click: 'loadPending()' },
  offline: { cls: 'dgr',  icon: '⚠',  text: 'เชื่อมต่อไม่ได้', click: 'retrySync()' },
  error:   { cls: 'dgr',  icon: '⚠',  text: 'บันทึกไม่สำเร็จ', click: 'retrySync()' },
  paused:  { cls: 'mute', icon: '○',  text: 'ไม่ตรวจอัตโนมัติ', click: 'loadPending()' }
};

/**
 * @param {string} state ชื่อสถานะใน SYNC_LOOK
 * @param {string=} detail ข้อความอธิบายเพิ่ม (โผล่ตอนเอาเมาส์ชี้)
 */
function syncSet(state, detail){
  // สถานะที่ต้องให้ผู้ใช้จัดการ ห้ามถูกสถานะทั่วไปมากลบทิ้ง
  if ((SYNC.state === 'pending' || SYNC.state === 'offline') &&
      (state === 'synced' || state === 'syncing')) return;

  SYNC.state = state;
  SYNC.detail = detail || '';
  if (state === 'synced' || state === 'saved') SYNC.at = Date.now();
  syncPaint();

  clearTimeout(SYNC.timer);
  if (state === 'saved') {                       // โชว์ "บันทึกแล้ว" แป๊บเดียวแล้วกลับไปปกติ
    SYNC.timer = setTimeout(function(){
      if (SYNC.state === 'saved') syncSet('synced');
    }, 2600);
  }
}

function syncPaint(){
  var dot = document.getElementById('liveDot');
  if (!dot) return;
  var look = SYNC_LOOK[SYNC.state] || SYNC_LOOK.synced;

  var tip = SYNC.detail || syncTooltip();
  // ห่อข้อความไว้ เพื่อให้จอแคบซ่อนเฉพาะข้อความและยังเห็นไอคอนอยู่
  var body = (look.spin ? '<span class="spin"></span> ' : (look.icon ? look.icon + ' ' : '')) +
             '<span class="sync-label">' + look.text + '</span>';
  var cls = 'b ' + look.cls + ' sync-pill';

  dot.innerHTML = look.click
    ? '<button class="' + cls + '" style="border:0;cursor:pointer;font:inherit" ' +
      'title="' + esc(tip) + '" onclick="' + look.click + '">' + body + '</button>'
    : '<span class="' + cls + '" title="' + esc(tip) + '">' + body + '</span>';
}

function syncTooltip(){
  var base = refreshLabel(POLL_SECONDS) + ' · ไม่โหลดทับตอนกำลังกรอกข้อมูล';
  if (!SYNC.at) return base;
  var d = new Date(SYNC.at);
  var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
  return 'ตรงกับข้อมูลหลังบ้านเมื่อ ' + hh + ':' + mm + ' น.\n' + base;
}

/** เน็ตสะดุด/หลุด ต่างจาก "เซิร์ฟเวอร์ตอบว่าทำไม่ได้" ซึ่งเป็นความผิดของคำสั่ง */
function isOfflineError(e){
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  var m = String((e && e.message) || e || '');
  return /network|failed|timeout|เครือข่าย|เชื่อมต่อ|ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์/i.test(m);
}

/** ผู้ใช้กดที่ตัวบอกสถานะตอนมีปัญหา — ลองใหม่ทันที */
function retrySync(){
  SYNC.state = 'syncing';
  syncPaint();
  load({ quiet: true });
}

/** โหลดข้อมูลใหม่ตอนที่ผู้ใช้พร้อม (กดจากป้าย "มีข้อมูลใหม่") */
function loadPending(){
  SYNC.state = 'syncing';
  syncPaint();
  load({ quiet: true });
}

var POLL_SECONDS = 0;
var POLL_TIMER = null;

function startPolling(seconds){
  var sec = Number(seconds || 0);
  POLL_SECONDS = sec;
  clearInterval(POLL_TIMER);

  if (!sec) { syncSet('paused'); return; }   // ปิดการตรวจอัตโนมัติ — กดที่ป้ายเพื่อซิงก์เองได้
  syncSet('synced');

  POLL_TIMER = setInterval(function(){
    if (document.hidden) return;
    callApi('app.version').then(function(v){
      if (SYNC.state === 'offline') syncSet('synced');   // กลับมาต่อได้แล้ว
      if (!v || !v.version || v.version === S.version) return;
      S.version = v.version;

      // เราเป็นคนแก้เอง และหน้าก็ซิงก์ไปแล้วตอนกดบันทึก
      if (Date.now() < S.selfChangeUntil) return;

      // กำลังกรอกข้อมูลอยู่ — ห้ามโหลดทับ รอให้ผู้ใช้กดเอง
      if (userIsBusy()) { syncSet('pending'); return; }

      // ซิงก์เงียบ ๆ ไม่ล้างหน้า ไม่เด้งกลับไปบนสุด
      load({ quiet: true });
      refreshAlerts();
    }).catch(function(e){
      syncSet(isOfflineError(e) ? 'offline' : 'error', (e && e.message) || String(e));
    });
  }, sec * 1000);
}

/* ---------------- ศูนย์แจ้งเตือน ----------------

   ตัวเลขบนเมนู (เช่น 6 หลัง "ล้างแอร์") กับกล่องแจ้งเตือนบนแถบหัว
   ใช้ข้อมูลชุดเดียวกันจากคำสั่ง app.alerts ซึ่งเบากว่าแดชบอร์ดมาก

   อัปเดตเมื่อ: เปิดระบบ · หลังกดบันทึก/ลบทุกครั้ง · ทุกรอบตรวจข้อมูล
   เดิมตัวเลขนี้อัปเดตตอนเปิดหน้าแดชบอร์ดอย่างเดียว
   ไปอยู่หน้าอื่นแล้วตัวเลขจึงค้างอยู่ที่ค่าเก่า
------------------------------------------------------------------ */

var ALERTS = { counts: {}, items: [], total: 0, urgent: 0, at: '' };

function refreshAlerts(){
  return callApi('app.alerts').then(function(a){
    ALERTS = a || ALERTS;
    paintBadges();
    paintBell();
    if (document.getElementById('notifPanel')) renderNotifPanel();   // เปิดค้างอยู่ ให้อัปเดตตาม
    return a;
  }).catch(function(){ /* เน็ตสะดุด ไว้รอบหน้า */ });
}

/** ตัวเลขบนเมนูซ้าย — บอกจำนวนงานที่ยังค้างอยู่ของแต่ละโมดูล */
function paintBadges(){
  var c = ALERTS.counts || {};
  PAGES.forEach(function(p){ setBadge(p.id, c[p.id] || 0); });
}

function setBadge(page, n){
  var el = document.getElementById('badge-' + page);
  if (!el) return;
  if (n > 0) {
    el.textContent = n > 99 ? '99+' : n;
    el.style.display = '';
    el.title = 'ยังค้างอยู่ ' + n + ' รายการ';
  } else {
    el.style.display = 'none';
  }
}

/* ---- กระดิ่งบนแถบหัว ---- */

function paintBell(){
  var wrap = document.getElementById('bellWrap');
  if (!wrap) return;

  // วาดเฉพาะตัวปุ่ม ห้ามเขียนทับทั้ง bellWrap
  // เพราะกล่องแจ้งเตือนที่เปิดค้างอยู่ก็เป็นลูกของ bellWrap เหมือนกัน
  var slot = document.getElementById('bellSlot');
  if (!slot) {
    slot = document.createElement('span');
    slot.id = 'bellSlot';
    wrap.insertBefore(slot, wrap.firstChild);
  }

  var n = ALERTS.total || 0;
  var urgent = ALERTS.urgent || 0;
  slot.innerHTML =
    '<button class="btn icon bell" id="bellBtn" onclick="toggleNotif()" ' +
      'title="' + (n ? 'มี ' + n + ' เรื่องที่ต้องดู' : 'ไม่มีงานค้าง') + '" ' +
      'aria-label="การแจ้งเตือน">🔔' +
      (n ? '<span class="bell-dot' + (urgent ? ' urgent' : '') + '">' + (n > 99 ? '99+' : n) + '</span>' : '') +
    '</button>';
}

function toggleNotif(){
  if (document.getElementById('notifPanel')) return closeNotif();
  var wrap = document.getElementById('bellWrap');
  if (!wrap) return;
  var panel = document.createElement('div');
  panel.id = 'notifPanel';
  panel.className = 'notif';
  wrap.appendChild(panel);
  renderNotifPanel();
  setTimeout(function(){ document.addEventListener('click', notifOutside, true); }, 0);
  refreshAlerts();                      // เปิดทีไรก็ดึงของล่าสุดมาให้ด้วย
}

function closeNotif(){
  var p = document.getElementById('notifPanel');
  if (p) p.remove();
  document.removeEventListener('click', notifOutside, true);
}

function notifOutside(e){
  var wrap = document.getElementById('bellWrap');
  if (wrap && !wrap.contains(e.target)) closeNotif();
}

var NOTIF_GROUPS = [
  { module:'repairs',   ic:'🔧', label:'งานซ่อมค้าง' },
  { module:'ac',        ic:'❄️', label:'ล้างแอร์ถึงกำหนด' },
  { module:'building',  ic:'🏢', label:'งานตึกส่วนกลาง' },
  { module:'purchases', ic:'🛡️', label:'ประกันใกล้หมด' },
  { module:'finance',   ic:'🧾', label:'บิลรายเดือน' }
];

function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var items = ALERTS.items || [];

  var head = '<div class="notif-h"><b>การแจ้งเตือน</b>' +
    '<span class="sp">' +
      (items.length ? '<span class="b ' + (ALERTS.urgent ? 'dgr' : 'warn') + '">' + items.length + ' เรื่อง</span>' : '') +
      '<button class="btn sm icon" title="ดึงข้อมูลล่าสุด" onclick="refreshAlerts()">↻</button>' +
    '</span></div>';

  if (!items.length) {
    panel.innerHTML = head +
      '<div class="notif-empty"><div class="big">✅</div>ไม่มีงานค้าง<br>' +
      '<span class="fs12 faint">ทุกอย่างเรียบร้อยดี</span></div>';
    return;
  }

  // จัดกลุ่มตามโมดูล เรียงตามลำดับที่ผู้ใช้สนใจก่อน
  var body = '';
  NOTIF_GROUPS.forEach(function(g){
    var list = items.filter(function(a){ return a.module === g.module; });
    if (!list.length) return;
    body += '<div class="notif-sec">' + g.ic + ' ' + esc(g.label) + ' (' + list.length + ')</div>';
    list.slice(0, 8).forEach(function(a){
      body += '<button class="notif-item l-' + esc(a.level) + '" onclick="gotoAlert(\'' + esc(a.module) + '\')">' +
        '<div class="tt">' + esc(a.title) + '</div>' +
        (a.detail ? '<div class="dd">' + esc(a.detail) + '</div>' : '') +
      '</button>';
    });
    if (list.length > 8) {
      body += '<button class="notif-more" onclick="gotoAlert(\'' + esc(g.module) + '\')">' +
        'ดูอีก ' + (list.length - 8) + ' รายการ →</button>';
    }
  });

  panel.innerHTML = head + '<div class="notif-list">' + body + '</div>' +
    '<div class="notif-f">อัปเดตเมื่อ ' + esc(String(ALERTS.at || '').slice(11, 16) || '–') + ' น. · ' +
    '<a href="javascript:void(0)" onclick="closeNotif();go(\'dashboard\')">ดูทั้งหมดในแดชบอร์ด →</a></div>';
}

function gotoAlert(module){
  closeNotif();
  go(module === 'debt' ? 'debtMain' : module);
}

/* ---------------- format helpers ---------------- */

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n, dec){
  var v = Number(n||0);
  return v.toLocaleString('th-TH',{minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function baht(n){ return money(n) + ' ฿'; }
function pct(n){ return (Number(n)||0).toFixed(1) + '%'; }
function num(n){ return n==null||n==='' ? '–' : money(n); }

/** 2026-04-26 -> 26 เม.ย. 2569 */
var TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + ' ' + TH_MON[Number(m[2])-1] + ' ' + (Number(m[1])+543);
}
function thDateShort(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + '/' + Number(m[2]) + '/' + String(Number(m[1])+543).slice(2);
}
function daysAgo(iso){
  if (!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime())/86400000);
}

function statusBadge(st){
  var map = {
    'เสร็จสิ้น':'ok','ดำเนินการแล้ว':'ok','ใช้งานปกติ':'ok','ปิดหนี้แล้ว':'ok','อยู่ในประกัน':'ok','มีผู้เช่า':'ok','ปกติ':'ok',
    'กำลังซ่อม':'info','กำลังดำเนินการ':'info','นัดหมายแล้ว':'info','กำลังผ่อน':'info','ว่าง':'info',
    'รอดำเนินการ':'warn','เลื่อนนัด':'warn','ใกล้หมดประกัน':'warn','ต้องซ่อม':'warn','พักชำระ':'warn','ปิดปรับปรุง':'warn','เกินกำหนด':'warn','ยังไม่เคยล้าง':'warn',
    'ยกเลิก':'mute','ปลดระวาง':'mute','ไม่ระบุ':'mute',
    'หมดอายุแล้ว':'dgr','ด่วนมาก':'dgr','ด่วน':'warn'
  };
  if (!st) return '';
  return '<span class="b ' + (map[st]||'mute') + '">' + esc(st) + '</span>';
}

function progress(percent, cls){
  var p = Math.max(0, Math.min(100, Number(percent)||0));
  return '<div class="pbar ' + (cls||'') + '"><i style="width:' + p + '%"></i></div>';
}

function thumbsHtml(refs, big){
  if (!refs || !refs.length) return '<span class="faint fs12">–</span>';
  return '<div class="thumbs">' + refs.map(function(r){
    if (r.thumb) {
      return '<img class="thumb' + (big?' big':'') + '" loading="lazy" src="' + esc(r.thumb) + '" ' +
             'onclick="window.open(\'' + esc(r.url) + '\',\'_blank\')" ' +
             'onerror="this.onerror=null;this.replaceWith(fileChip(' + JSON.stringify(JSON.stringify(r)).replace(/"/g,'&quot;') + '))">';
    }
    return '<a class="b info" href="' + esc(r.url) + '" target="_blank">ไฟล์</a>';
  }).join('') + '</div>';
}
function fileChip(json){
  var r = typeof json === 'string' ? JSON.parse(json) : json;
  var a = document.createElement('a');
  a.className = 'b info'; a.href = r.url; a.target = '_blank'; a.textContent = '📎 ไฟล์';
  return a;
}

function emptyBox(text, action){
  return '<div class="empty"><div class="big">🗂️</div>' + esc(text) +
         (action ? '<div class="mt12">' + action + '</div>' : '') + '</div>';
}

function barChart(items, labelKey, valueKey, formatter){
  if (!items || !items.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  var max = Math.max.apply(null, items.map(function(i){ return Number(i[valueKey])||0; })) || 1;
  return '<div class="bars">' + items.map(function(i){
    var v = Number(i[valueKey])||0;
    return '<div class="bar-row">' +
      '<div class="clip" title="' + esc(i[labelKey]) + '">' + esc(i[labelKey]) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (v/max*100) + '%"></div></div>' +
      '<div class="v">' + (formatter ? formatter(i) : money(v)) + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ---------------- modal ---------------- */

function openModal(title, bodyHtml, footHtml, wide){
  var root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="ov" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal' + (wide?' wide':'') + '">' +
        '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
        '<div class="modal-b">' + bodyHtml + '</div>' +
        (footHtml ? '<div class="modal-f">' + footHtml + '</div>' : '') +
      '</div>' +
    '</div>';
  applyReadOnly(root);
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

function confirmAction(text, onYes){
  openModal('ยืนยัน',
    '<p>' + esc(text) + '</p>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn dgr" id="cfmBtn">ยืนยัน</button>');
  document.getElementById('cfmBtn').onclick = function(){ closeModal(); onYes(); };
}

/* ---------------- toast ---------------- */

function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(function(){ el.remove(); }, kind==='err' ? 5200 : 2800);
}

/* ---------------- nav (mobile) ---------------- */

function toggleNav(){
  var nav = document.getElementById('nav');
  nav.classList.toggle('open');
  if (nav.classList.contains('open')) {
    var s = document.createElement('div');
    s.className = 'scrim'; s.id = 'scrim';
    s.onclick = function(){ nav.classList.remove('open'); removeScrim(); };
    document.body.appendChild(s);

}
function removeScrim(){
  var s = document.getElementById('scrim');
  if (s) s.remove();
}

/* ---------------- search ---------------- */

var searchTimer = null;
function onSearch(q){
  clearTimeout(searchTimer);
  if (!q || q.trim().length < 2) return;
  searchTimer = setTimeout(function(){
    callApi('app.search', { q: q }).then(function(rows){
      openModal('ผลการค้นหา "' + q + '" (' + rows.length + ')',

            '<div class="ic">' + moduleIcon(r.module) + '</div><div>' +
            '<div class="tt">' + esc(r.title) + '</div>' +
            '<div class="dd">' + esc(r.label) + (r.detail ? ' · ' + esc(r.detail) : '') + '</div>' +
            '</div></div>';
        }).join('') + '</div>'
        : '<div class="empty">ไม่พบรายการที่ตรงกับคำค้น</div>', '', true);
    }).catch(function(e){ toast(e.message||e, 'err'); });
  }, 420);
}
function jumpPage(module){
  return ({purchases:'purchases', repairs:'repairs', building:'building', ac:'ac', debt:'debtMain', rooms:'rooms'})[module] || 'dashboard';
}
function moduleIcon(module){
  return ({purchases:'🛒', repairs:'🔧', building:'🏢', ac:'❄️', debt:'💰', rooms:'🚪'})[module] || '📄';
}

/* ---------------- file upload ---------------- */

/**
 * อ่านไฟล์จาก <input type=file> เป็น dataURL แล้วส่งขึ้น Drive
 * คืน array ของ {id,name,url,thumb}
 */
function uploadFiles(inputEl, bucket){
  var files = Array.prototype.slice.call(inputEl.files || []);
  if (!files.length) return Promise.resolve([]);
  var MAX = 12 * 1024 * 1024;
  var tooBig = files.filter(function(f){ return f.size > MAX; });
  if (tooBig.length) {
    return Promise.reject(new Error('ไฟล์ใหญ่เกิน 12 MB: ' + tooBig.map(function(f){return f.name;}).join(', ')));
  }
  return Promise.all(files.map(readAsDataUrl))
    .then(function(payloads){ return callApi('file.upload', { bucket: bucket, files: payloads }); });
}

function readAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve({ name: file.name, mimeType: file.type, dataUrl: r.result }); };
    r.onerror = function(){ reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name)); };
    r.readAsDataURL(file);
  });
}
