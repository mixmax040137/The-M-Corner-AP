<script>
/* =========================================================
   Forms.html — ฟอร์มเพิ่ม/แก้ไข และการลบ
   ========================================================= */

var FORM = {
  specs: [],       // ผังช่องกรอกของฟอร์มที่เปิดอยู่
  keep: {},        // ไฟล์แนบเดิมที่ยังไม่ได้เอาออก
  bucket: 'misc',  // โฟลเดอร์ที่จะเก็บไฟล์แนบใหม่
  ocr: null,       // ผังการเติมค่าจากรูป
  rec: null,       // รายการที่กำลังแก้อยู่ (null = กำลังเพิ่มรายการใหม่)
  lines: [],       // รายการย่อยในบิล (ใช้กับช่องชนิด lines)
  todo: [],        // เช็คลิสต์งานซ่อม (ใช้กับช่องชนิด todo)
  todoOptions: []  // ตัวเลือกประเภทงานของแต่ละข้อ
};

/* ---------------- form engine ---------------- */

function fieldsHtml(specs, rec){
  rec = rec || {};
  FORM.specs = specs;
  FORM.keep = {};
  return '<div class="fgrid">' + specs.map(function(f){
    var v = rec[f.key];
    var id = 'f_' + f.key;
    var inner;

    if (f.type === 'select') {
      var opts = (f.options || []).map(function(o){
        var val = typeof o === 'object' ? o.value : o;
        var lab = typeof o === 'object' ? o.label : o;
        return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('');
      inner = '<select class="sel" id="' + id + '">' + (f.blank !== false ? '<option value="">— เลือก —</option>' : '') + opts + '</select>';

    } else if (f.type === 'textarea') {
      inner = '<textarea class="ta" id="' + id + '" placeholder="' + esc(f.ph||'') + '">' + esc(v||'') + '</textarea>';

    } else if (f.type === 'files') {
      FORM.keep[f.key] = (rec[f.key] && rec[f.key].length) ? [].concat(rec[f.key]) : [];
      inner =
        '<div id="' + id + '_existing">' + existingFilesHtml(f.key) + '</div>' +
        '<label class="file-drop" for="' + id + '">📎 แตะเพื่อเลือกไฟล์ (เลือกได้หลายไฟล์ · ไม่เกิน 12 MB ต่อไฟล์)' +
        '<input type="file" id="' + id + '" multiple accept="image/*,application/pdf" style="display:none" ' +
        'onchange="previewPicked(this,\'' + id + '\')"></label>' +
        '<div id="' + id + '_preview" class="thumbs mt8"></div>' +
        '<div id="' + id + '_ocr"></div>';

    } else if (f.type === 'todo') {
      FORM.todo = parseTodoText(v);
      FORM.todoOptions = f.options || [];
      inner = '<div id="' + id + '" class="todo">' + todoTableHtml() + '</div>';

    } else if (f.type === 'lines') {
      FORM.lines = parseLinesText(v);
      inner = '<div id="' + id + '" class="lines">' + linesTableHtml() + '</div>';

    } else if (f.type === 'computed') {
      inner = '<div class="inp" id="' + id + '" style="background:var(--surface-2);font-weight:600;' +
              'font-variant-numeric:tabular-nums;cursor:default">0</div>';

    } else if (f.type === 'date') {
      inner = '<input type="date" class="inp" id="' + id + '" value="' + esc(v || '') + '">';

    } else if (f.type === 'number' || f.type === 'money') {
      inner = '<input type="number" step="' + (f.type === 'money' ? '0.01' : '1') + '" class="inp" id="' + id + '" ' +
              'value="' + (v == null || v === '' ? '' : esc(v)) + '" placeholder="' + esc(f.ph||'') + '" inputmode="decimal"' +
              (f.sums ? ' oninput="recalcSums()"' : (f.oninput ? ' oninput="' + esc(f.oninput) + '"' : '')) + '>';

    } else {
      inner = '<input type="text" class="inp" id="' + id + '" value="' + esc(v || '') + '" placeholder="' + esc(f.ph||'') + '">';
    }

    return '<div class="f' + (f.full ? ' full' : '') + '">' +
      '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>' +
      inner + (f.hint ? '<div class="hint">' +
        (f.hint.charAt(0) === '<' ? f.hint : esc(f.hint)) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* ============================================================
   เช็คลิสต์งานซ่อม — เข้าซ่อมครั้งเดียวมักซ่อมหลายจุด

   เก็บลงชีตบรรทัดละงาน  [x] ชื่องาน | ประเภทงาน
   (รูปแบบเดียวกับ parseTodo_ ฝั่งเซิร์ฟเวอร์ — แก้ที่ไหนต้องแก้ให้ตรงกัน)
   ============================================================ */

function parseTodoText(text){
  var raw = String(text == null ? '' : text);
  if (!raw.trim()) return [];
  var lines = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);

  // ของเดิมเขียนรวมบรรทัดเดียวว่า "1.ยาแนว 2.เก็บสีห้อง"
  if (lines.length === 1 && /\d\s*[.)]/.test(lines[0]) && lines[0].charAt(0) !== '[') {
    lines = lines[0].split(/\s*\d+\s*[.)]\s*/).map(function(x){ return x.trim(); }).filter(Boolean);
  }

  return lines.map(function(line){
    var done = false;
    var m = line.match(/^\[\s*([xX✓])?\s*\]\s*(.*)$/);
    if (m) { done = !!m[1]; line = m[2]; }
    line = line.replace(/^\d+\s*[.)]\s*/, '').trim();
    var a = line.split('|');
    return { done: done, name: (a[0] || '').trim(), category: (a[1] || '').trim() };
  }).filter(function(t){ return t.name; });
}

function formatTodoText(list){
  return (list || [])
    .filter(function(t){ return String(t.name || '').trim(); })
    .map(function(t){
      var nm = String(t.name).replace(/\|/g, '/').trim();
      var ct = String(t.category || '').replace(/\|/g, '/').trim();
      return '[' + (t.done ? 'x' : ' ') + '] ' + nm + (ct ? ' | ' + ct : '');
    }).join('\n');
}

function todoDone(){ return (FORM.todo || []).filter(function(t){ return t.done; }).length; }

function todoTableHtml(){
  var opts = FORM.todoOptions || [];
  var rows = (FORM.todo || []).map(function(t, i){
    return '<div class="todo-row' + (t.done ? ' done' : '') + '">' +
      '<label class="todo-check" title="' + (t.done ? 'ทำเสร็จแล้ว' : 'ยังไม่ได้ทำ') + '">' +
        '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="setTodo(' + i + ',\'done\',this.checked)">' +
      '</label>' +
      '<input class="inp" placeholder="งานที่ต้องซ่อม" value="' + esc(t.name || '') + '" ' +
        'oninput="setTodo(' + i + ',\'name\',this.value)">' +
      '<select class="sel" onchange="setTodo(' + i + ',\'category\',this.value)">' +
        '<option value="">— ประเภทงาน —</option>' +
        opts.map(function(o){
          return '<option value="' + esc(o) + '"' + (o === t.category ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') +
      '</select>' +
      '<button type="button" class="btn sm dgr" title="เอางานนี้ออก" onclick="delTodo(' + i + ')">×</button>' +
    '</div>';
  }).join('');

  var n = (FORM.todo || []).length, d = todoDone();
  return (rows || '<div class="hint" style="padding:8px 2px">ยังไม่มีงาน — กด “เพิ่มงาน” เพื่อใส่ทีละจุดที่ต้องซ่อม</div>') +
    '<div class="row mt8">' +
      '<button type="button" class="btn sm" onclick="addTodo()">+ เพิ่มงาน</button>' +
      '<button type="button" class="btn sm" onclick="pasteTodo()">📋 วางทีเดียวหลายงาน</button>' +
      (n ? '<div class="todo-count">เสร็จแล้ว <b>' + d + '/' + n + '</b> งาน</div>' : '') +
    '</div>';
}

function redrawTodo(){
  var box = document.getElementById('f_items');
  if (!box) return;
  box.innerHTML = todoTableHtml();
}

function setTodo(i, key, val){
  if (!FORM.todo[i]) return;
  FORM.todo[i][key] = (key === 'done') ? !!val : val;
  if (key === 'done') { redrawTodo(); return; }   // ติ๊กแล้ววาดใหม่ให้ขีดฆ่าเห็นชัด
  var c = document.querySelector('#f_items .todo-count b');
  if (c) c.textContent = todoDone() + '/' + FORM.todo.length;
}

function addTodo(){
  FORM.todo.push({ done: false, name: '', category: '' });
  redrawTodo();
  var inputs = document.querySelectorAll('#f_items .todo-row .inp');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function delTodo(i){
  FORM.todo.splice(i, 1);
  redrawTodo();
}

/** วางรายการที่ต้องซ่อมทีเดียวหลายบรรทัด แล้วให้ระบบแยกให้ */
function pasteTodo(){
  var box = document.getElementById('todoPasteWrap');
  if (box) { box.hidden = !box.hidden; if (!box.hidden) document.getElementById('todoPasteBox').focus(); return; }

  var host = document.getElementById('f_items');
  if (!host) return;
  var wrap = document.createElement('div');
  wrap.id = 'todoPasteWrap';
  wrap.className = 'mt8';
  wrap.innerHTML =
    '<textarea class="ta" id="todoPasteBox" style="min-height:110px" ' +
      'placeholder="ยาแนวห้องน้ำ&#10;เก็บสีห้อง&#10;เปลี่ยนก๊อกน้ำล้างจาน"></textarea>' +
    '<div class="hint mt8">บรรทัดละหนึ่งงาน · หรือพิมพ์รวมบรรทัดเดียวแบบ “1.ยาแนว 2.เก็บสีห้อง” ก็ได้<br>' +
      'ใส่ประเภทงานทีหลังจากช่องข้าง ๆ แต่ละงาน</div>' +
    '<div class="row mt8">' +
      '<button type="button" class="btn sm pri" onclick="applyPastedTodo()">เพิ่มเข้ารายการ</button>' +
      '<button type="button" class="btn sm" onclick="document.getElementById(\'todoPasteWrap\').hidden=true">ปิด</button>' +
    '</div>';
  host.appendChild(wrap);
  document.getElementById('todoPasteBox').focus();
}

function applyPastedTodo(){
  var text = (document.getElementById('todoPasteBox') || {}).value || '';
  var added = parseTodoText(text);
  if (!added.length) return toast('ไม่พบงานที่อ่านได้', 'err');
  FORM.todo = (FORM.todo || []).filter(function(t){ return String(t.name || '').trim(); }).concat(added);
  redrawTodo();
  toast('เพิ่มให้ ' + added.length + ' งาน', 'ok');
}

/* ============================================================
   บิลเดียวหลายรายการ — ซื้อออนไลน์ทีเดียวได้ของหลายอย่าง

   เก็บลงชีตเป็นข้อความ บรรทัดละรายการ  ชื่อ | จำนวน | หน่วย | ราคาต่อหน่วย
   (รูปแบบเดียวกับ parseLines_ ฝั่งเซิร์ฟเวอร์ — แก้ที่ไหนต้องแก้ให้ตรงกัน)
   ============================================================ */

function parseLinesText(text){
  return String(text == null ? '' : text).split(/\r?\n/)
    .map(function(s){ return s.trim(); }).filter(Boolean)
    .map(function(raw){
      var a = raw.split('|').map(function(x){ return x.trim(); });
      var name = a[0] || '', qty = 1, unit = '', price = 0;
      if (a.length >= 4)      { qty = numOr(a[1], 1); unit = a[2] || ''; price = numOr(a[3], 0); }
      else if (a.length === 3){ qty = numOr(a[1], 1); price = numOr(a[2], 0); }
      else if (a.length === 2){ price = numOr(a[1], 0); }
      return { name: name, qty: qty, unit: unit, price: price };
    });
}

function numOr(v, dflt){
  var n = Number(String(v).replace(/,/g, ''));
  return isFinite(n) ? n : dflt;
}

function formatLinesText(list){
  return (list || [])
    .filter(function(l){ return String(l.name || '').trim() || Number(l.price); })
    .map(function(l){
      return [String(l.name || '').replace(/\|/g, '/'),
              l.qty || 1,
              String(l.unit || '').replace(/\|/g, '/'),
              l.price || 0].join(' | ');
    }).join('\n');
}

function lineTotal(l){ return (Number(l.qty) || 0) * (Number(l.price) || 0); }
function linesSum(){ return (FORM.lines || []).reduce(function(a, l){ return a + lineTotal(l); }, 0); }

function linesTableHtml(){
  var rows = (FORM.lines || []).map(function(l, i){
    return '<div class="line-row">' +
      '<input class="inp" placeholder="ชื่อสินค้า" value="' + esc(l.name || '') + '" ' +
        'oninput="setLine(' + i + ',\'name\',this.value)">' +
      '<input class="inp num" type="number" step="any" inputmode="decimal" placeholder="จำนวน" ' +
        'value="' + (l.qty == null ? '' : esc(l.qty)) + '" oninput="setLine(' + i + ',\'qty\',this.value)">' +
      '<input class="inp" placeholder="หน่วย" value="' + esc(l.unit || '') + '" ' +
        'oninput="setLine(' + i + ',\'unit\',this.value)">' +
      '<input class="inp num" type="number" step="any" inputmode="decimal" placeholder="ราคา/หน่วย" ' +
        'value="' + (l.price == null ? '' : esc(l.price)) + '" oninput="setLine(' + i + ',\'price\',this.value)">' +
      '<div class="line-sum">' + money(lineTotal(l), 2) + '</div>' +
      '<button type="button" class="btn sm dgr" title="เอารายการนี้ออก" onclick="delLine(' + i + ')">×</button>' +
    '</div>';
  }).join('');

  return '<div class="line-head">' +
      '<span>ชื่อสินค้า</span><span class="num">จำนวน</span><span>หน่วย</span>' +
      '<span class="num">ราคา/หน่วย</span><span class="num">รวม</span><span></span>' +
    '</div>' +
    (rows || '<div class="hint" style="padding:8px 2px">ยังไม่มีรายการ — กด “เพิ่มรายการ” เพื่อใส่สินค้าทีละอย่าง</div>') +
    '<div class="row mt8">' +
      '<button type="button" class="btn sm" onclick="addLine()">+ เพิ่มรายการ</button>' +
      '<button type="button" class="btn sm" onclick="pasteLines()">📋 วางทีเดียวหลายรายการ</button>' +
      '<div class="line-total">รวมค่าสินค้า <b>' + money(linesSum(), 2) + ' ฿</b></div>' +
    '</div>';
}

function redrawLines(){
  var box = document.getElementById('f_lines');
  if (!box) return;
  box.innerHTML = linesTableHtml();
  recalcBill();
}

function setLine(i, key, val){
  if (!FORM.lines[i]) return;
  FORM.lines[i][key] = (key === 'qty' || key === 'price') ? numOr(val, 0) : val;
  // ไม่วาดใหม่ทั้งตาราง เดี๋ยวเคอร์เซอร์เด้งออกจากช่องที่กำลังพิมพ์
  var row = document.querySelectorAll('#f_lines .line-row')[i];
  if (row) row.querySelector('.line-sum').textContent = money(lineTotal(FORM.lines[i]), 2);
  var tot = document.querySelector('#f_lines .line-total b');
  if (tot) tot.textContent = money(linesSum(), 2) + ' ฿';
  recalcBill();
}

function addLine(){
  FORM.lines.push({ name: '', qty: 1, unit: '', price: 0 });
  redrawLines();
  var inputs = document.querySelectorAll('#f_lines .line-row .inp');
  if (inputs.length) inputs[(FORM.lines.length - 1) * 4].focus();
}

function delLine(i){
  FORM.lines.splice(i, 1);
  redrawLines();
}

/**
 * วางรายการจากหน้าคำสั่งซื้อทีเดียวทั้งก้อน แล้วให้ระบบแยกบรรทัดให้
 *
 * ทำเป็นช่องพับเก็บอยู่ในฟอร์มเดิม ไม่เปิดหน้าต่างซ้อน
 * เพราะ openModal() เขียนทับหน้าต่างเดิม ถ้าเปิดซ้อนฟอร์มที่กรอกค้างไว้จะหายทั้งใบ
 */
function pasteLines(){
  var box = document.getElementById('pasteWrap');
  if (box) { box.hidden = !box.hidden; if (!box.hidden) document.getElementById('pasteBox').focus(); return; }

  var host = document.getElementById('f_lines');
  if (!host) return;
  var wrap = document.createElement('div');
  wrap.id = 'pasteWrap';
  wrap.className = 'mt8';
  wrap.innerHTML =
    '<textarea class="ta" id="pasteBox" style="min-height:120px" ' +
      'placeholder="ปั๊มน้ำ 750W | 1 | เครื่อง | 4250&#10;สายไฟ VAF 2x1.5 | 20 | เมตร | 17.5&#10;เทปพันสายไฟ 45"></textarea>' +
    '<div class="hint mt8">คั่นด้วย <b>|</b> ตามลำดับ ชื่อ · จำนวน · หน่วย · ราคาต่อหน่วย<br>' +
      'ถ้าวางมาเป็นข้อความธรรมดา ระบบจะพยายามแยกชื่อกับราคาให้เอง</div>' +
    '<div class="row mt8">' +
      '<button type="button" class="btn sm pri" onclick="applyPastedLines()">เพิ่มเข้ารายการ</button>' +
      '<button type="button" class="btn sm" onclick="document.getElementById(\'pasteWrap\').hidden=true">ปิด</button>' +
    '</div>';
  host.appendChild(wrap);
  document.getElementById('pasteBox').focus();
}

function applyPastedLines(){
  var text = (document.getElementById('pasteBox') || {}).value || '';
  var added = text.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean).map(function(raw){
    if (raw.indexOf('|') >= 0) return parseLinesText(raw)[0];
    // ไม่มี | — เดาจากตัวเลขท้ายบรรทัดว่าเป็นราคา
    var m = raw.match(/^(.*?)[\s:x×]*([\d,]+(?:\.\d+)?)\s*(?:บาท|฿)?$/);
    if (m && m[1].trim()) return { name: m[1].trim(), qty: 1, unit: '', price: numOr(m[2], 0) };
    return { name: raw, qty: 1, unit: '', price: 0 };
  }).filter(Boolean);

  if (!added.length) return toast('ไม่พบรายการที่อ่านได้', 'err');
  FORM.lines = (FORM.lines || []).filter(function(l){ return String(l.name || '').trim(); }).concat(added);
  redrawLines();   // วาดใหม่แล้วช่องวางจะหายไปเอง เพราะอยู่ข้างใน f_lines
  toast('เพิ่มให้ ' + added.length + ' รายการ — ตรวจตัวเลขอีกครั้งก่อนบันทึก', 'ok');
}

/**
 * คิดยอดรวมของบิล = ค่าสินค้า + ค่าส่ง − ส่วนลด แล้วเติมลงช่อง "ราคารวม"
 * ให้ตรงกับที่ฝั่งเซิร์ฟเวอร์คิดตอนบันทึก จะได้ไม่มีทางที่ตัวเลขสองฝั่งไม่ตรงกัน
 */
function recalcBill(){
  if (!document.getElementById('f_lines')) return;
  var price = document.getElementById('f_price');
  if (!price) return;
  var n = (FORM.lines || []).filter(function(l){ return String(l.name || '').trim() || Number(l.price); }).length;
  if (!n) { price.readOnly = false; price.style.background = ''; return; }

  var ship = Number((document.getElementById('f_shipping') || {}).value) || 0;
  var disc = Number((document.getElementById('f_discount') || {}).value) || 0;
  price.value = Math.round((linesSum() + ship - disc) * 100) / 100;
  price.readOnly = true;                       // มีรายการย่อยแล้ว ห้ามพิมพ์ทับให้ไม่ตรงกัน
  price.style.background = 'var(--surface-2)';
  price.title = 'คิดจากรายการในบิลให้อัตโนมัติ — แก้ที่รายการย่อย ค่าส่ง หรือส่วนลด';

  var hint = document.getElementById('billHint');
  if (hint) {
    hint.innerHTML = n + ' รายการ · ค่าสินค้า ' + money(linesSum(), 2) +
      (ship ? ' + ค่าส่ง ' + money(ship, 2) : '') +
      (disc ? ' − ส่วนลด ' + money(disc, 2) : '');
  }
}

/** อัปเดตช่องผลรวมทุกช่องในฟอร์มปัจจุบัน */
function recalcSums(){
  (FORM.specs || []).forEach(function(f){
    if (f.type !== 'computed' || !f.from) return;
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    var total = 0;
    f.from.forEach(function(k){
      var i = document.getElementById('f_' + k);
      if (i) total += Number(i.value) || 0;
    });
    el.textContent = total.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ฿';
    el.style.color = total > 0 ? 'var(--ok)' : 'var(--muted)';
  });
}

function existingFilesHtml(key){
  var list = FORM.keep[key] || [];
  if (!list.length) return '';
  return '<div class="thumbs mb8">' + list.map(function(url, i){
    var id = String(url).match(/[-\w]{20,}/);

/** อ่านค่าจากฟอร์ม + อัปโหลดไฟล์ใหม่ แล้วคืน object พร้อมบันทึก */
function readForm(specs, bucket){
  var out = {};
  var uploads = [];

  specs.forEach(function(f){
    if (f.type === 'computed') return;          // ช่องคำนวณ ไม่ต้องบันทึก
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    if (f.type === 'files') {
      uploads.push(
        uploadFiles(el, bucket).then(function(refs){
          out[f.key] = (FORM.keep[f.key] || []).concat(refs.map(function(r){ return r.url; }));
        })
      );
    } else if (f.type === 'todo') {
      out[f.key] = formatTodoText(FORM.todo);
    } else if (f.type === 'lines') {
      out[f.key] = formatLinesText(FORM.lines);
    } else if (f.type === 'number' || f.type === 'money') {
      out[f.key] = el.value === '' ? null : Number(el.value);
    } else {
      out[f.key] = el.value;
    }
  });

  return Promise.all(uploads).then(function(){ return out; });
}

/** โครงฟอร์มมาตรฐาน: เปิด modal, จัดการปุ่มบันทึก, รีโหลดหน้า */
function openForm(opts){
  var rec = opts.record || {};
  FORM.ocr = opts.ocr || null;
  FORM.rec = rec.id ? rec : null;   // จำไว้ว่ากำลังแก้ของเดิม หรือกำลังเพิ่มใหม่
  openModal(opts.title,
    fieldsHtml(opts.fields, rec),
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    (rec.id && opts.onDelete ? '<button class="btn dgr" id="fDel">ลบรายการนี้</button>' : '') +
    '<button class="btn pri" id="fSave">' + (rec.id ? 'บันทึกการแก้ไข' : 'บันทึก') + '</button>',
    opts.wide);

  if (rec.id && opts.onDelete) {
    document.getElementById('fDel').onclick = function(){ closeModal(); opts.onDelete(rec.id); };
  }

  recalcSums();
  recalcBill();

  document.getElementById('fSave').onclick = function(){
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';

    readForm(opts.fields, opts.bucket || 'misc').then(function(data){
      var missing = opts.fields.filter(function(f){
        return f.required && (data[f.key] == null || data[f.key] === '');
      });
      if (missing.length) throw new Error('กรุณากรอก: ' + missing.map(function(f){ return f.label; }).join(', '));

      var record = Object.assign({}, opts.base || {}, data);
      if (rec.id) record.id = rec.id;
      return callApi(opts.action, Object.assign({ record: record }, opts.extra || {}));
    }).then(function(){
      closeModal();
      // ตัวบอกสถานะมุมขวาบนขึ้น "บันทึกแล้ว" ให้อยู่แล้ว จึงไม่ต้องเด้ง toast ซ้ำ
      // แล้วซิงก์เงียบ ๆ ไม่ล้างหน้าและไม่เด้งกลับไปบนสุด
      load({ quiet: true });
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = rec.id ? 'บันทึกการแก้ไข' : 'บันทึก';
      toast(e.message || e, 'err');
    });
  };
}

/* ============================================================
   อ่านข้อความจากรูป (OCR) แล้วช่วยกรอกฟอร์ม

   ทุกค่าที่ได้เป็นแค่ข้อเสนอ ผู้ใช้กดเติมเองทีละช่องหรือเติมทั้งหมดก็ได้
   และแก้ไขต่อได้เสมอ เพราะตัวอ่านพลาดได้ โดยเฉพาะลายมือกับรูปเอียง
   ============================================================ */

var OCR_MAX = 8 * 1024 * 1024;   // รูปใหญ่กว่านี้ส่งไปอ่านแล้วมักหมดเวลา

function ocrUsable(){
  return !!(FORM.ocr && S.boot && S.boot.settings && S.boot.settings.ocrEnabled);
}

/** รูปแรกที่พออ่านได้ (ข้ามไฟล์ใหญ่เกินและไฟล์ที่ไม่ใช่รูป/PDF) */
function firstReadable(files){
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (f.size <= OCR_MAX && /^image\/|pdf$/.test(f.type || '')) return f;
  }
  return null;
}

/**
 * @param {string} id  id ของช่องแนบไฟล์ เช่น f_slips
 * @param {boolean} auto true = เติมช่องที่ยังว่างให้เลยโดยไม่ต้องกด
 */
function runOcr(id, auto){
  var input = document.getElementById(id);
  var slot = document.getElementById(id + '_ocr');
  if (!input || !slot) return;

  var file = firstReadable(Array.prototype.slice.call(input.files || []));
  if (!file) { slot.innerHTML = '<div class="hint mt8">ไม่มีรูปที่อ่านได้ (รองรับรูปภาพและ PDF ไม่เกิน 8 MB)</div>'; return; }

  slot.innerHTML = '<div class="ocr-box"><div class="hd"><span class="spin"></span> กำลังอ่านข้อความจาก ' +
                   esc(file.name.slice(0, 28)) + '…</div></div>';

  readAsDataUrl(file).then(function(p){
    return callApi('ocr.read', { dataUrl: p.dataUrl, mimeType: p.mimeType });
  }).then(function(r){
    slot.innerHTML = ocrBoxHtml(id, r);
    OCR_LAST[id] = r;
    if (auto) {
      var n = ocrApplyAll(id, true);
      toast(n ? 'อ่านรูปแล้ว เติมให้ ' + n + ' ช่อง — ตรวจดูก่อนบันทึกนะ' : 'อ่านรูปแล้ว แต่ยังจับค่าที่ใช้ได้ไม่ได้', n ? 'ok' : '');
    }
  }).catch(function(e){
    slot.innerHTML = '<div class="ocr-box"><div class="hd">⚠️ อ่านรูปไม่สำเร็จ</div>' +
      '<div class="hint">' + esc(e.message || e) + '</div>' +
      '<button type="button" class="btn sm mt8" onclick="runOcr(\'' + id + '\')">ลองอีกครั้ง</button></div>';
  });
}

var OCR_LAST = {};

/** ค่าที่อ่านได้ คู่กับช่องในฟอร์มที่จะเอาไปใส่ */
function ocrPairs(r){
  var m = FORM.ocr || {};
  var g = r.guess || {};
  var out = [];
  if (m.date   && g.date)   out.push({ field: m.date,   label: 'วันที่',     value: g.date,   show: thDate(g.date) });
  if (m.amount && g.amount) out.push({ field: m.amount, label: 'จำนวนเงิน',  value: g.amount, show: baht(g.amount) });
  if (m.vendor && g.vendor) out.push({ field: m.vendor, label: 'ร้าน/ผู้ขาย', value: g.vendor, show: g.vendor });
  if (m.title  && g.title)  out.push({ field: m.title,  label: 'ชื่อรายการ',  value: g.title,  show: g.title });
  if (m.note   && g.ref)    out.push({ field: m.note,   label: 'เลขอ้างอิง',  value: 'อ้างอิง ' + g.ref, show: g.ref });
  // ใบเสร็จหลายรายการ
  if (g.items && g.items.length > 1) {
    if (document.getElementById('f_lines')) {
      // ฟอร์มนี้มีตารางรายการย่อย — เติมลงตารางเลย ได้ทั้งชื่อ จำนวน และราคาแยกกัน
      out.push({ field: '_lines', label: 'รายการในบิล', value: g.items,
                 show: 'เติม ' + g.items.length + ' รายการลงตาราง', lines: true });
    } else if (m.title) {
      var lines = g.items.map(function(it, i){ return (i+1) + '.' + it.name + ' ' + money(it.price, 2) + ' ฿'; }).join('\n');
      out.push({ field: m.title, label: 'ทุกรายการ (' + g.items.length + ')', value: lines,
                 show: g.items.length + ' รายการในใบเสร็จ', multi: true });
    }
  }
  return out;
}

function ocrBoxHtml(id, r){
  var pairs = ocrPairs(r);
  if (!pairs.length) {
    return '<div class="ocr-box"><div class="hd">🔎 อ่านข้อความได้ แต่ยังจับค่าที่ใช้ได้ไม่ได้' +
      '<span class="sp"><button type="button" class="btn sm" onclick="ocrToggleRaw(\'' + id + '\')">ดูข้อความที่อ่านได้</button></span></div>' +
      '<div class="ocr-raw" id="' + id + '_raw" hidden>' + esc(r.text || '(ว่าง)') + '</div></div>';
  }
  return '<div class="ocr-box">' +
    '<div class="hd">🔎 อ่านจากรูปได้แบบนี้ — กดเติมช่องที่ต้องการ' +
      '<span class="sp">' +
        '<button type="button" class="btn sm pri" onclick="ocrApplyAll(\'' + id + '\')">เติมทั้งหมด</button>' +
        '<button type="button" class="btn sm" onclick="ocrToggleRaw(\'' + id + '\')">ข้อความเต็ม</button>' +
      '</span></div>' +
    '<div class="ocr-hits">' + pairs.map(function(p, i){
      return '<div class="ocr-hit">' +
        '<span class="k">' + esc(p.label) + '</span>' +
        '<span class="v" title="' + esc(p.lines ? p.show : String(p.value)) + '">' + esc(p.show) + '</span>' +
        '<button type="button" class="btn sm" onclick="ocrApplyOne(\'' + id + '\',' + i + ')">เติม</button>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="ocr-raw" id="' + id + '_raw" hidden>' + esc(r.text || '(ว่าง)') + '</div>' +
    '<div class="hint mt8">ตรวจความถูกต้องก่อนบันทึกเสมอ — แก้ในช่องได้ตามปกติ</div>' +
  '</div>';
}

function ocrToggleRaw(id){
  var el = document.getElementById(id + '_raw');
  if (el) el.hidden = !el.hidden;
}

/** ใส่ค่าลงช่อง แล้วไฮไลต์ให้เห็นว่าช่องไหนถูกเติม */
function ocrFill(fieldKey, value){
  // เติมลงตารางรายการย่อย (ใบเสร็จที่มีของหลายอย่าง)
  if (fieldKey === '_lines') {
    var add = (value || []).map(function(it){
      return { name: it.name, qty: 1, unit: '', price: Number(it.price) || 0 };
    });
    if (!add.length) return false;
    FORM.lines = (FORM.lines || []).filter(function(l){ return String(l.name || '').trim(); }).concat(add);
    redrawLines();
    var box = document.getElementById('f_lines');
    if (box) {
      box.classList.add('ocr-filled');
      setTimeout(function(){ box.classList.remove('ocr-filled'); }, 1600);
    }
    return true;
  }

  var el = document.getElementById('f_' + fieldKey);
  if (!el) return false;
  el.value = value;
  el.classList.add('ocr-filled');
  setTimeout(function(){ el.classList.remove('ocr-filled'); }, 1600);
  recalcSums();
  return true;
}

function ocrApplyOne(id, idx){
  var r = OCR_LAST[id];
  if (!r) return;
  var p = ocrPairs(r)[idx];
  if (p && ocrFill(p.field, p.value)) {
    toast(p.lines ? 'เติม ' + p.value.length + ' รายการลงบิลแล้ว — ตรวจจำนวนกับราคาอีกครั้ง' : 'เติม' + p.label + 'แล้ว', 'ok');
  }
}

/**
 * @param {boolean} onlyEmpty true = เติมเฉพาะช่องที่ยังว่าง (ใช้ตอนเติมอัตโนมัติ
 *                            จะได้ไม่ทับสิ่งที่ผู้ใช้พิมพ์ไปแล้ว)
 * @return {number} จำนวนช่องที่เติมจริง
 */
function ocrApplyAll(id, onlyEmpty){
  var r = OCR_LAST[id];
  if (!r) return 0;
  var done = {};
  var n = 0;
  ocrPairs(r).forEach(function(p){
    if (done[p.field]) return;                       // ช่องเดียวกันเติมครั้งเดียว เอาตัวแรก
    if (p.field === '_lines') {
      // ตารางรายการย่อย: "ว่าง" หมายถึงยังไม่มีรายการที่ตั้งชื่อไว้
      if (onlyEmpty && (FORM.lines || []).some(function(l){ return String(l.name || '').trim(); })) return;
    } else {
      var el = document.getElementById('f_' + p.field);
      if (!el) return;
      if (onlyEmpty && String(el.value || '').trim() !== '') return;
    }
    if (ocrFill(p.field, p.value)) { done[p.field] = true; n++; }
  });
  if (!onlyEmpty) toast(n ? 'เติมให้ ' + n + ' ช่องแล้ว — ตรวจดูก่อนบันทึก' : 'ช่องที่จะเติมไม่อยู่ในฟอร์มนี้', n ? 'ok' : 'err');
  return n;
}

  var rooms = roomOptions();
  var body =
    '<div class="fgrid">' +
      '<div class="f"><label>วันที่นัด <span style="color:var(--danger)">*</span></label>' +

      '<button class="btn sm" onclick="bulkPick(\'all\')">ทั้งหมด</button>' +
      '<button class="btn sm" onclick="bulkPick(\'none\')">ล้าง</button>' +
      [1,2,3,4,5].map(function(f){ return '<button class="btn sm" onclick="bulkPick(' + f + ')">ชั้น ' + f + '</button>'; }).join('') +
    '</div>' +
    '<div class="rooms" id="bkRooms">' + rooms.map(function(r){
      return '<label class="room" style="cursor:pointer"><input type="checkbox" class="bk" value="' + r + '"> <b>' + r + '</b></label>';
    }).join('') + '</div>';

  openModal('📅 นัดล้างแอร์หลายห้องพร้อมกัน', body,
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="bkSave">สร้างนัดหมาย</button>', true);

  document.getElementById('bkSave').onclick = function(){
    var picked = Array.prototype.slice.call(document.querySelectorAll('.bk:checked')).map(function(c){ return c.value; });
    var date = document.getElementById('bk_date').value;
    if (!picked.length) return toast('เลือกอย่างน้อย 1 ห้อง', 'err');
    if (!date) return toast('กรุณาระบุวันที่นัด', 'err');
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    callApi('ac.bulkBook', {
      rooms: picked, bookDate: date,
      technician: document.getElementById('bk_tech').value,
      cost: document.getElementById('bk_cost').value,
      note: document.getElementById('bk_note').value
    }).then(function(n){
      closeModal(); toast('สร้างนัดหมาย ' + n + ' ห้องแล้ว', 'ok'); load({ quiet: true });
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'สร้างนัดหมาย'; toast(e.message||e, 'err');
    });
  };
}

function bulkPick(what){
  document.querySelectorAll('.bk').forEach(function(c){
    if (what === 'all') c.checked = true;
    else if (what === 'none') c.checked = false;
    else c.checked = String(c.value).charAt(0) === String(what);
  });
}

/** ดาวน์โหลดไฟล์ — ใช้ downloads capability ถ้ามี ไม่งั้นใช้ลิงก์ปกติ */
function saveTextFile(filename, content, mime){
  if (typeof window.saveViaHost === 'function') return window.saveViaHost(filename, content, mime);
  var blob = new Blob([content], { type: mime + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ดาวน์โหลด ' + filename + ' แล้ว', 'ok');
}

function doImportJson(){
  openModal('⬆️ กู้คืนจากไฟล์สำรอง',
    '<p class="fs13">เลือกไฟล์ <b>.json</b> ที่เคยดาวน์โหลดไว้</p>' +
    '<label class="file-drop" for="impFile">📄 เลือกไฟล์สำรอง' +
      '<input type="file" id="impFile" accept="application/json,.json" style="display:none" ' +
      'onchange="document.getElementById(\'impName\').textContent=this.files[0]?this.files[0].name:\'\'"></label>' +
    '<div class="fs12 muted mt8" id="impName"></div>' +
    '<div class="hr"></div>' +
    '<div class="f"><label>วิธีกู้คืน</label>' +
    '<select class="sel" id="impMode">' +
      '<option value="merge">เพิ่มเฉพาะรายการที่ยังไม่มี (แนะนำ)</option>' +
      '<option value="replace">ล้างข้อมูลเดิมแล้วแทนที่ทั้งหมด</option>' +
    '</select></div>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="impGo">กู้คืนข้อมูล</button>');

  document.getElementById('impGo').onclick = function(){
    var f = document.getElementById('impFile').files[0];
    if (!f) return toast('กรุณาเลือกไฟล์ก่อน', 'err');
    var mode = document.getElementById('impMode').value;
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังกู้คืน…';
    var r = new FileReader();
    r.onload = function(){
      var parsed;
      try { parsed = JSON.parse(r.result); }
      catch (e) { btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; return toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'err'); }
      callApi('backup.import', { data: parsed, mode: mode }).then(function(stat){
        closeModal();
        var n = Object.keys(stat).reduce(function(a,k){ return a + (stat[k]||0); }, 0);
        toast('กู้คืนสำเร็จ ' + n + ' รายการ', 'ok');
        load({ quiet: true });
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; toast(e.message||e, 'err');
      });
    };
    r.readAsText(f);
  };
}

function copyShare(){
  var el = document.getElementById('shareUrl');
  if (!el) return;
  el.select();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(el.value)
      .then(function(){ toast('คัดลอกลิงก์แชร์แล้ว','ok'); })
      .catch(function(){ toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); });
  } else {
    try { document.execCommand('copy'); toast('คัดลอกลิงก์แชร์แล้ว','ok'); }
    catch (e) { toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); }
  }
}
