<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title><?= appName ?></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ tokens ============ ---------------------------------
   ธีมสว่าง/มืด ครอบคลุม 3 สถานะ:
   :root                              = ธีมสว่าง (ค่าตั้งต้น)
   prefers-color-scheme + :not(light) = ผู้ใช้ตั้ง OS เป็นมืด และไม่ได้เลือกสว่างไว้
   [data-theme="dark"]                = ผู้ใช้เลือกมืดเอง
   สีทุกสีนิยามเป็นตัวแปรที่นี่ที่เดียว — ห้ามใส่สีตรง ๆ ในคอมโพเนนต์
   โทนกลางเอียงไปทางน้ำเงินโคบอลต์ให้เข้ากับสีหลัก แทนที่จะใช้เทากลาง ๆ
------------------------------------------------------------------- */
:root{
  --bg:#f2f5fa; --surface:#fff; --surface-2:#f7f9fc;
  --ink:#0f1729; --ink-2:#33405a; --muted:#5f6d87; --faint:#8d9ab2;
  --line:#e0e6f0; --line-2:#eef1f7;
  --nav:#101a30; --nav-2:#1b2846; --nav-ink:#b8c4dc; --nav-sec:#61708f;
  --brand:#2c5cc5; --brand-ink:#fff; --brand-soft:#e8eeff; --brand-2:#5b87e8;
  --ok:#0e8a5f; --ok-soft:#e3f5ed; --ok-2:#3fb383;
  --warn:#b26a00; --warn-soft:#fdf1df; --warn-2:#d9963a;
  --danger:#c62828; --danger-soft:#fdeaea;
  --info:#0b6fa4; --info-soft:#e5f1f9;
  --r:12px; --r-sm:8px;
  --sh:0 1px 2px rgba(15,23,41,.05), 0 1px 3px rgba(15,23,41,.06);
  --sh-lg:0 12px 32px rgba(15,23,41,.16);
  --nav-w:236px;
  --font-ui:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Thai',var(--font-ui);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111b; --surface:#141b28; --surface-2:#1a2231;
    --ink:#e6ecf7; --ink-2:#bfc9db; --muted:#8794ab; --faint:#67738c;
    --line:#232d3f; --line-2:#1c2534;
    --nav:#080c14; --nav-2:#141c2b; --nav-ink:#94a2bd; --nav-sec:#59657e;
    --brand:#6f9bff; --brand-ink:#0b1020; --brand-soft:#17244a; --brand-2:#9dbaff; --brand-2:#9dbaff;
    --ok:#35c98a; --ok-soft:#0f2a20; --ok-2:#6fdcac; --ok-2:#6fdcac;
    --warn:#e0a340; --warn-soft:#2c2113; --warn-2:#f0c477; --warn-2:#f0c477;
    --danger:#f0716b; --danger-soft:#2e1818;
    --info:#4cb6ea; --info-soft:#10242f;
    --sh:0 1px 2px rgba(0,0,0,.45);
    --sh-lg:0 16px 40px rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#141b28; --surface-2:#1a2231;
  --ink:#e6ecf7; --ink-2:#bfc9db; --muted:#8794ab; --faint:#67738c;
  --line:#232d3f; --line-2:#1c2534;
  --nav:#080c14; --nav-2:#141c2b; --nav-ink:#94a2bd; --nav-sec:#59657e;
  --brand:#6f9bff; --brand-ink:#0b1020; --brand-soft:#17244a; --brand-2:#9dbaff;
  --ok:#35c98a; --ok-soft:#0f2a20; --ok-2:#6fdcac;
  --warn:#e0a340; --warn-soft:#2c2113; --warn-2:#f0c477;
  --danger:#f0716b; --danger-soft:#2e1818;
  --info:#4cb6ea; --info-soft:#10242f;
  --sh:0 1px 2px rgba(0,0,0,.45);
  --sh-lg:0 16px 40px rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}

/* ============ layout ============ */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--nav);color:var(--nav-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:.1px;font-family:var(--font-display);font-weight:600}
.brand span{font-size:11.5px;color:var(--nav-sec)}
.nav-list{padding:10px 10px 20px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sec{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--nav-sec);padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--nav-ink);font-size:13.5px;border:0;background:0;width:100%;text-align:left;
}
.nav-item:hover{background:var(--nav-2);color:#fff}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 7px;font-size:11px}
.nav-item.on .badge{background:rgba(255,255,255,.25)}
.nav-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--nav-sec)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.top h1{font-size:17.5px;margin:0;font-weight:600;letter-spacing:-.1px;font-family:var(--font-display);text-wrap:balance}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:20px 22px 64px;max-width:1320px;width:100%}

.burger{display:none;background:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer}

/* ============ controls ============ */
.sel,.inp,.ta{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 11px;font-size:13.5px;width:100%;outline:0;transition:border-color .15s,box-shadow .15s;
}
.sel:focus,.inp:focus,.ta:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ta{min-height:74px;resize:vertical}
.sel{cursor:pointer;padding-right:26px}
.w-auto{width:auto}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-sm);padding:7px 13px;font-size:13.5px;cursor:pointer;font-weight:500;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dgr{color:var(--danger);border-color:var(--danger)}
.btn.dgr:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:5px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}

/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;font-family:var(--font-display);text-wrap:balance}
.card-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.flush{padding:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:23px;font-weight:600;letter-spacing:-.4px;margin-top:5px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.kpi .cap{font-size:11.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.accent{background:var(--brand-soft);border-color:transparent}
.kpi.accent .lbl{color:var(--brand)}
.kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--danger)} .kpi.warn .val{color:var(--warn)}

/* progress */
.pbar{height:10px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.pbar.lg{height:16px}
.pbar.ok>i{background:linear-gradient(90deg,var(--ok),var(--ok-2))}
.pbar.warn>i{background:linear-gradient(90deg,var(--warn),var(--warn-2))}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.pmeta b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ============ table ============ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{
  text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;
}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.t-actions{display:flex;gap:4px;justify-content:flex-end}

/* ============ badges ============ */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.dgr{background:var(--danger-soft);color:var(--danger)}
.b.info{background:var(--info-soft);color:var(--info)}
.b.mute{background:var(--line-2);color:var(--muted)}

/* ============ room grid ============ */
.floors{display:flex;flex-direction:column;gap:12px}
.floor{display:flex;gap:12px;align-items:flex-start}
.floor-tag{
  flex:0 0 62px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:center;font-size:11.5px;color:var(--muted);
}
.floor-tag b{display:block;font-size:17px;color:var(--ink)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;flex:1}
.room{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;
  cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden;
}
.room:hover{transform:translateY(-1px);box-shadow:var(--sh-lg);border-color:var(--brand)}
.room .no{font-weight:600;font-size:15.5px;letter-spacing:0;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.room .st{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.room .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:99px;background:var(--line)}
.room.s-ok .dot{background:var(--ok)} .room.s-warn .dot{background:var(--warn)}
.room.s-dgr .dot{background:var(--danger)} .room.s-info .dot{background:var(--info)}
.room.s-ok{border-left:3px solid var(--ok)} .room.s-warn{border-left:3px solid var(--warn)}
.room.s-dgr{border-left:3px solid var(--danger)} .room.s-info{border-left:3px solid var(--info)}

/* ============ alerts / list ============ */
.alist{display:flex;flex-direction:column}
.ali{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.ali:last-child{border-bottom:0}
.ali:hover{background:var(--surface-2)}
.ali .ic{font-size:16px;line-height:1.3}
.ali .tt{font-weight:600;font-size:13px}
.ali .dd{font-size:12px;color:var(--muted);margin-top:1px}
.ali.l-danger .tt{color:var(--danger)} .ali.l-warn .tt{color:var(--warn)}

/* ============ media / thumbs ============ */
.thumbs{display:flex;gap:5px;flex-wrap:wrap}
.thumb{
  width:44px;height:44px;border-radius:6px;border:1px solid var(--line);object-fit:cover;
  background:var(--surface-2);cursor:pointer;display:block;
}
.thumb.big{width:92px;height:92px}
.file-drop{
  border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;
  color:var(--muted);font-size:12.5px;cursor:pointer;background:var(--surface-2);
}
.file-drop:hover{border-color:var(--brand);color:var(--brand)}

/* ============ modal ============ */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:660px;margin:auto 0;animation:pop .16s ease-out}
.modal.wide{max-width:960px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:15.5px;font-weight:600;font-family:var(--font-display)}
.modal-b{padding:18px;max-height:min(70vh,700px);overflow-y:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{margin-left:auto;background:0;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--line-2);color:var(--ink)}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:600}
.f .hint{font-size:11.5px;color:var(--faint)}

/* ============ misc ============ */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.6}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;
  background:var(--nav);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  box-shadow:var(--sh-lg);animation:up .2s ease-out;max-width:90vw;
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.fs12{font-size:12px} .fs13{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mb8{margin-bottom:8px} .mb12{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.clip{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.bar-row .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600;white-space:nowrap}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px}
.tl-i:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:99px;background:var(--brand);border:2px solid var(--surface)}
.tl-i .d{font-size:11.5px;color:var(--muted)}
.tl-i .t{font-weight:600;font-size:13px}

/* ============ responsive ============ */
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .nav{
    position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--sh-lg);
  }
  .nav.open{transform:none}
  .burger{display:inline-flex}
  .content{padding:14px 14px 80px}
  .top{padding:10px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .floor{flex-direction:column}
  .floor-tag{flex:none;width:100%;display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left}
  .floor-tag b{font-size:14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .modal-b{max-height:none}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none}
}
@media print{
  .nav,.top-right,.burger,.t-actions,.btn{display:none!important}
  .app{display:block} body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<div class="app">
  <!-- ================= sidebar ================= -->
  <aside class="nav" id="nav">
    <div class="brand">
      <b>🏢 <?= appName ?></b>
      <span><?= subtitle ?> · v<?= version ?></span>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="nav-foot" id="navFoot">กำลังโหลด…</div>
  </aside>

  <!-- ================= main ================= -->
  <div class="main">
    <header class="top">
      <button class="burger" onclick="toggleNav()">☰</button>
      <div>
        <h1 id="pageTitle">ภาพรวม</h1>
        <div class="sub" id="pageSub">แดชบอร์ดรวมทุกส่วนของหอพัก</div>
      </div>
      <div class="top-right">
        <span id="liveDot"></span>
        <input class="inp w-auto" id="searchBox" placeholder="🔎 ค้นหาทั้งระบบ…" style="width:180px"
               oninput="onSearch(this.value)" autocomplete="off">

<script>
  /* ค่าทั้งสองถูกกรองให้เหลือแค่ A-Z a-z 0-9 _ - มาแล้วจากฝั่งเซิร์ฟเวอร์ (safeKey_)
     จึงหลุดออกจากเครื่องหมายคำพูดไม่ได้

     ต้องพิมพ์แบบดิบ (force-printing) เท่านั้น ห้ามใช้แบบ standard-printing
     เพราะแบบหลังจะ escape เครื่องหมายคำพูดเป็น &quot; ซึ่งในแท็ก script
     เบราว์เซอร์ไม่ถอดกลับ ทำให้ทั้งบล็อกนี้พังทั้งก้อนและกุญแจไม่ถึงหน้าเว็บ */
  var ACCESS_KEY = "<?!= accessKey ?>";

  var CAN_EDIT   = USER_ROLE === 'admin';
</script>
<script>
/* =========================================================
   App.html — core: state, api, router, format, modal, upload
   ========================================================= */

var S = {

};

var ALL_DEBTS = [];

var PAGES = [
  { id:'dashboard', ic:'📊', label:'ภาพรวม',              sub:'แดชบอร์ดรวมทุกส่วนของหอพัก',        sec:'ภาพรวม' },
  { id:'debtMain',  ic:'💰', label:'รายการสรุปรวม',       sub:'บัญชีโอนใช้หนี้หลักของหอพัก',        sec:'การเงิน' },

  { id:'building',  ic:'🏢', label:'ซ่อมแซมตึกโดยรวม',    sub:'งานส่วนกลางของอาคาร' },

/* ---------------- API ---------------- */

/** กุญแจที่จะแนบไปกับทุกคำสั่ง — มี 2 ทางสำรองเผื่อทางแรกไม่มา */
var RESOLVED_KEY = null;

function accessKey(){
  if (RESOLVED_KEY !== null) return RESOLVED_KEY;
  RESOLVED_KEY = (typeof ACCESS_KEY === 'string' && ACCESS_KEY) ? ACCESS_KEY : '';
  return RESOLVED_KEY;
}

/** true ถ้าเปิดด้วยลิงก์ผู้ดูแล — ใช้แทนตัวแปร CAN_EDIT ตรง ๆ ที่อาจไม่ถูกประกาศ */
function canEdit(){
  if (typeof CAN_EDIT !== 'undefined') return !!CAN_EDIT;
  return !!(S.boot && S.boot.canEdit);
}

function callApi(action, payload){
  var body = {};
  Object.keys(payload || {}).forEach(function(k){ body[k] = payload[k]; });
  body._key = accessKey();
  payload = body;
  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(function(res){
        if (!res) return reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์'));
        if (res.ok) resolve(res.data); else reject(new Error(res.error));
      })
      .withFailureHandler(function(err){ reject(err); })
      .api(action, payload || {});
  });
}

/* ---------------- boot & routing ---------------- */

function boot(){
  // ถ้าตัวแปรกุญแจไม่มาถึงหน้าเว็บ (เช่น template เรนเดอร์ผิด) ลองอ่านจาก URL ของหน้าแม่ก่อน
  if (!accessKey() && window.google && google.script && google.script.url) {
    try {
      google.script.url.getLocation(function(loc){
        var k = loc && loc.parameter && loc.parameter.key;
        RESOLVED_KEY = k ? String(k) : '';
        bootNow();
      });
      return;
    } catch (e) { /* ใช้ทางปกติ */ }
  }
  bootNow();
}

function bootNow(){
  callApi('app.bootstrap').then(function(b){
    S.boot = b;
    renderNav();
    document.getElementById('navFoot').innerHTML = navFootHtml(b);
    S.version = b.version || 0;
    if (!b.canEdit) document.body.classList.add('readonly');
    var hash = (location.hash || '').replace('#','');
    go(PAGES.some(function(p){return p.id===hash;}) ? hash : 'dashboard');
    startPolling(b.settings && b.settings.refreshSeconds);
  }).catch(function(e){
    document.getElementById('view').innerHTML =
      '<div class="card"><div class="card-b"><h3>เชื่อมต่อระบบไม่สำเร็จ</h3>' +
      '<p class="muted">' + esc(e.message||e) + '</p>' +
      '<p class="fs13">ตรวจสอบว่า: เปิดชีตแล้วรัน <b>เมนู 🏢 The M Corner AP → ติดตั้งระบบ</b> เรียบร้อยแล้ว ' +
      'และอีเมลที่ใช้อยู่มีสิทธิ์เข้าใช้งาน</p></div></div>';
  });
}

/** ข้อความมุมล่างซ้าย — เวอร์ชันเว็บแอปจะเขียนทับฟังก์ชันนี้ */
function navFootHtml(b){
  var role = (b.user && b.user.label) ? b.user.label : '';
  return '<b style="color:#c7d0e0">' + esc(role) + '</b>' +
    (b.user && b.user.email && b.user.email !== 'ผู้ใช้ผ่านลิงก์' ? '<br>' + esc(b.user.email) : '') +
    (b.sheetUrl ? '<br><a href="' + b.sheetUrl + '" target="_blank">เปิด Google Sheet ↗</a>' : '');
}

function renderNav(){
  var html = '';
  PAGES.forEach(function(p){
    if (p.sec) html += '<div class="nav-sec">' + p.sec + '</div>';
    html += '<button class="nav-item" id="nav-' + p.id + '" onclick="go(\'' + p.id + '\')">' +
              '<span class="ic">' + p.ic + '</span><span>' + p.label + '</span>' +
              '<span class="badge" id="badge-' + p.id + '" style="display:none"></span>' +
            '</button>';
  });
  document.getElementById('navList').innerHTML = html;
}

function go(page){
  S.page = page;
  S.params = {};
  location.hash = page;
  var meta = PAGES.filter(function(p){return p.id===page;})[0] || PAGES[0];
  document.getElementById('pageTitle').textContent = meta.label;
  document.getElementById('pageSub').textContent = meta.sub;
  PAGES.forEach(function(p){
    var el = document.getElementById('nav-' + p.id);
    if (el) el.classList.toggle('on', p.id === page);
  });

  removeScrim();
  load();

function refresh(){ load(true); }

function setYear(y){
  S.year = y;

function load(force){
  var view = document.getElementById('view');

    S.cache[S.page] = data;
    syncYearOptions(data.years || data.available || []);
    view.innerHTML = r.render(data);
    applyReadOnly(view);

    view.innerHTML = '<div class="card"><div class="card-b"><h3>โหลดข้อมูลไม่สำเร็จ</h3>' +

                     '<button class="btn" onclick="load()">ลองใหม่</button></div></div>';

/** เติมตัวเลือกปีในแถบบนให้ตรงกับข้อมูลจริงของหน้านั้น */
function syncYearOptions(years){
  var sel = document.getElementById('yearSel');
  var list = (years || []).slice().sort(function(a,b){return b-a;});
  var cur = new Date().getFullYear();
  if (list.indexOf(cur) < 0) list.unshift(cur);
  var html = '<option value="all">ทุกปี</option>';
  list.forEach(function(y){
    html += '<option value="' + y + '">ปี ' + y + ' (พ.ศ. ' + (Number(y)+543) + ')</option>';
  });
  sel.innerHTML = html;
  if (list.indexOf(Number(S.year)) < 0 && S.year !== 'all') S.year = String(cur);
  sel.value = S.year;

/* ---------------- โหมดดูอย่างเดียว ----------------
   ฝั่งเซิร์ฟเวอร์กันไว้แล้วในฟังก์ชัน api() ตรงนี้แค่ซ่อนปุ่มที่กดไปก็ทำไม่ได้
   เพื่อไม่ให้ผู้ที่เปิดด้วยลิงก์แชร์สับสน */
var EDIT_ENTRYPOINTS = /\b(formDebt|formDebtPayment|formPurchase|formAc|formBulkAc|formRepair|formBuilding|formRoom|formFinance|delDebt|delDebtPayment|delPurchase|delAc|delRepair|delBuilding|delFinance|doImportJson|doRotateShare|doBackupNow)\s*\(/;

function applyReadOnly(root){
  if (canEdit()) return;
  var nodes = root.querySelectorAll('[onclick]');
  for (var i = 0; i < nodes.length; i++) {
    if (EDIT_ENTRYPOINTS.test(nodes[i].getAttribute('onclick') || '')) nodes[i].remove();

/* ---------------- รีเฟรชอัตโนมัติเมื่อข้อมูลในชีตเปลี่ยน ---------------- */

function startPolling(seconds){
  var sec = Number(seconds || 0);

  if (dot) dot.innerHTML = '<span class="b ok" title="ข้อมูลอัปเดตอัตโนมัติทุก ' + sec + ' วินาที">● สด</span>';

  setInterval(function(){
    if (document.hidden) return;
    if (document.getElementById('modalRoot').innerHTML) return;  // กำลังกรอกฟอร์มอยู่ อย่าเพิ่งรีเฟรช

      }
    }).catch(function(){ /* เน็ตสะดุด ไว้รอบหน้า */ });
  }, sec * 1000);
}

/* ---------------- format helpers ---------------- */

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(n, dec){
  var v = Number(n||0);
  return v.toLocaleString('th-TH',{minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
}
function baht(n){ return money(n) + ' ฿'; }
function pct(n){ return (Number(n)||0).toFixed(1) + '%'; }
function num(n){ return n==null||n==='' ? '–' : money(n); }

/** 2026-04-26 -> 26 เม.ย. 2569 */
var TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + ' ' + TH_MON[Number(m[2])-1] + ' ' + (Number(m[1])+543);
}
function thDateShort(iso){
  if (!iso) return '–';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(iso);
  return Number(m[3]) + '/' + Number(m[2]) + '/' + String(Number(m[1])+543).slice(2);
}
function daysAgo(iso){
  if (!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime())/86400000);
}

function statusBadge(st){
  var map = {
    'เสร็จสิ้น':'ok','ดำเนินการแล้ว':'ok','ใช้งานปกติ':'ok','ปิดหนี้แล้ว':'ok','อยู่ในประกัน':'ok','มีผู้เช่า':'ok','ปกติ':'ok',
    'กำลังซ่อม':'info','กำลังดำเนินการ':'info','นัดหมายแล้ว':'info','กำลังผ่อน':'info','ว่าง':'info',
    'รอดำเนินการ':'warn','เลื่อนนัด':'warn','ใกล้หมดประกัน':'warn','ต้องซ่อม':'warn','พักชำระ':'warn','ปิดปรับปรุง':'warn','เกินกำหนด':'warn','ยังไม่เคยล้าง':'warn',
    'ยกเลิก':'mute','ปลดระวาง':'mute','ไม่ระบุ':'mute',
    'หมดอายุแล้ว':'dgr','ด่วนมาก':'dgr','ด่วน':'warn'
  };
  if (!st) return '';
  return '<span class="b ' + (map[st]||'mute') + '">' + esc(st) + '</span>';
}

function progress(percent, cls){
  var p = Math.max(0, Math.min(100, Number(percent)||0));
  return '<div class="pbar ' + (cls||'') + '"><i style="width:' + p + '%"></i></div>';
}

function thumbsHtml(refs, big){
  if (!refs || !refs.length) return '<span class="faint fs12">–</span>';
  return '<div class="thumbs">' + refs.map(function(r){
    if (r.thumb) {
      return '<img class="thumb' + (big?' big':'') + '" loading="lazy" src="' + esc(r.thumb) + '" ' +
             'onclick="window.open(\'' + esc(r.url) + '\',\'_blank\')" ' +
             'onerror="this.onerror=null;this.replaceWith(fileChip(' + JSON.stringify(JSON.stringify(r)).replace(/"/g,'&quot;') + '))">';
    }
    return '<a class="b info" href="' + esc(r.url) + '" target="_blank">ไฟล์</a>';
  }).join('') + '</div>';
}
function fileChip(json){
  var r = typeof json === 'string' ? JSON.parse(json) : json;
  var a = document.createElement('a');
  a.className = 'b info'; a.href = r.url; a.target = '_blank'; a.textContent = '📎 ไฟล์';
  return a;
}

function emptyBox(text, action){
  return '<div class="empty"><div class="big">🗂️</div>' + esc(text) +
         (action ? '<div class="mt12">' + action + '</div>' : '') + '</div>';
}

function barChart(items, labelKey, valueKey, formatter){
  if (!items || !items.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  var max = Math.max.apply(null, items.map(function(i){ return Number(i[valueKey])||0; })) || 1;
  return '<div class="bars">' + items.map(function(i){
    var v = Number(i[valueKey])||0;
    return '<div class="bar-row">' +
      '<div class="clip" title="' + esc(i[labelKey]) + '">' + esc(i[labelKey]) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (v/max*100) + '%"></div></div>' +
      '<div class="v">' + (formatter ? formatter(i) : money(v)) + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ---------------- modal ---------------- */

function openModal(title, bodyHtml, footHtml, wide){
  var root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="ov" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal' + (wide?' wide':'') + '">' +
        '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
        '<div class="modal-b">' + bodyHtml + '</div>' +
        (footHtml ? '<div class="modal-f">' + footHtml + '</div>' : '') +
      '</div>' +
    '</div>';

  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

function confirmAction(text, onYes){
  openModal('ยืนยัน',
    '<p>' + esc(text) + '</p>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn dgr" id="cfmBtn">ยืนยัน</button>');
  document.getElementById('cfmBtn').onclick = function(){ closeModal(); onYes(); };

/* ---------------- toast ---------------- */

function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(function(){ el.remove(); }, kind==='err' ? 5200 : 2800);
}

/* ---------------- nav (mobile) ---------------- */

function toggleNav(){
  var nav = document.getElementById('nav');
  nav.classList.toggle('open');
  if (nav.classList.contains('open')) {
    var s = document.createElement('div');
    s.className = 'scrim'; s.id = 'scrim';

    document.body.appendChild(s);

}
function removeScrim(){

/* ---------------- search ---------------- */

var searchTimer = null;
function onSearch(q){
  clearTimeout(searchTimer);
  if (!q || q.trim().length < 2) return;
  searchTimer = setTimeout(function(){
    callApi('app.search', { q: q }).then(function(rows){
      openModal('ผลการค้นหา "' + q + '" (' + rows.length + ')',

          return '<div class="ali" onclick="closeModal();go(\'' + jumpPage(r.module) + '\')">' +
            '<div class="ic">' + moduleIcon(r.module) + '</div><div>' +
            '<div class="tt">' + esc(r.title) + '</div>' +

            '</div></div>';
        }).join('') + '</div>'
        : '<div class="empty">ไม่พบรายการที่ตรงกับคำค้น</div>', '', true);
    }).catch(function(e){ toast(e.message||e, 'err'); });
  }, 420);

function jumpPage(module){
  return ({purchases:'purchases', repairs:'repairs', building:'building', ac:'ac', debt:'debtMain', rooms:'rooms'})[module] || 'dashboard';
}
function moduleIcon(module){
  return ({purchases:'🛒', repairs:'🔧', building:'🏢', ac:'❄️', debt:'💰', rooms:'🚪'})[module] || '📄';
}

/* ---------------- file upload ---------------- */

/**
 * อ่านไฟล์จาก <input type=file> เป็น dataURL แล้วส่งขึ้น Drive
 * คืน array ของ {id,name,url,thumb}
 */
function uploadFiles(inputEl, bucket){
  var files = Array.prototype.slice.call(inputEl.files || []);
  if (!files.length) return Promise.resolve([]);
  var MAX = 12 * 1024 * 1024;
  var tooBig = files.filter(function(f){ return f.size > MAX; });
  if (tooBig.length) {
    return Promise.reject(new Error('ไฟล์ใหญ่เกิน 12 MB: ' + tooBig.map(function(f){return f.name;}).join(', ')));
  }
  return Promise.all(files.map(readAsDataUrl))
    .then(function(payloads){ return callApi('file.upload', { bucket: bucket, files: payloads }); });
}

function readAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve({ name: file.name, mimeType: file.type, dataUrl: r.result }); };
    r.onerror = function(){ reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name)); };
    r.readAsDataURL(file);
  });
}

<script>

ROUTES.dashboard = {

    var b = d.building;

      kpi('ยอดหนี้คงเหลือทั้งหมด', baht(d.debtAll.remaining),
          'จากยอดหนี้ ' + baht(d.debtAll.totalDebt) + ' · ชำระแล้ว ' + pct(d.debtAll.percent), 'accent') +
      kpi('ชำระแล้ว (หนี้หลัก)', pct(d.debtMain.percent), baht(d.debtMain.paid) + ' จาก ' + baht(d.debtMain.total), 'good') +
      kpi('ค่าใช้จ่ายปี ' + d.year, baht(d.spendThisYear), 'ซื้อของ + ซ่อมแซม + ล้างแอร์') +
      kpi('งานซ่อมค้าง', d.repairs.openJobs + ' งาน', d.repairs.overdue + ' งานเกินกำหนด', d.repairs.overdue ? 'bad' : '');

    var alerts = d.alerts.length
      ? '<div class="alist">' + d.alerts.slice(0,12).map(function(a){
          return '<div class="ali l-' + a.level + '" onclick="go(\'' + jumpPage(a.module) + '\')">' +
                 '<div class="ic">' + a.icon + '</div><div><div class="tt">' + esc(a.title) + '</div>' +
                 '<div class="dd">' + esc(a.detail) + '</div></div></div>';
        }).join('') + '</div>'
      : '<div class="empty"><div class="big">✅</div>ไม่มีงานค้าง — ทุกอย่างเรียบร้อย</div>';

    return '' +
      '<div class="grid g4 mb12">' + kpis + '</div>' +

      '<div class="grid g2 mb12">' +
        card('💰 รายการสรุปรวม (หนี้หลัก)',
          debtMini(d.debtMain, 'debtMain'),
          '<button class="btn sm" onclick="go(\'debtMain\')">ดูทั้งหมด →</button>') +
        card('🧾 หนี้สิน (หนี้รอง)',
          debtMini(d.debtSub, 'debtSub') +
          (d.debtSub.interestThisYear ? '<div class="fs12 muted mt8">ดอกเบี้ยที่ชำระปี ' + d.year + ': <b>' + baht(d.debtSub.interestThisYear) + '</b></div>' : ''),
          '<button class="btn sm" onclick="go(\'debtSub\')">ดูทั้งหมด →</button>') +
      '</div>' +

      '<div class="grid g4 mb12">' +
        kpi('ห้องทั้งหมด', b.totalRooms + ' ห้อง', 'มีผู้เช่า ' + b.occupied + ' · ว่าง ' + b.vacant) +
        kpi('ล้างแอร์ปี ' + d.year, d.ac.roomsDone + '/' + b.totalRooms + ' ห้อง', d.ac.doneInYear + ' รอบ · ค้าง ' + d.ac.roomsPending + ' ห้อง', d.ac.roomsPending ? 'warn' : 'good') +
        kpi('ซื้อของปี ' + d.year, baht(d.purchases.yearTotal), d.purchases.yearCount + ' รายการ') +
        kpi('ประกันใกล้หมด', d.purchases.warranty.expiring + ' รายการ', 'หมดอายุแล้ว ' + d.purchases.warranty.expired, d.purchases.warranty.expiring ? 'warn' : '') +
      '</div>' +

      '<div class="grid g2 mb12">' +
        card('📒 รายรับ-รายจ่ายหอ ปี ' + d.year,
          '<div class="grid g3 mb12">' +
            kpi('รายรับ', baht(d.finance.income), 'เฉลี่ย ' + baht(d.finance.avgIncome) + '/เดือน', 'good') +
            kpi('รายจ่าย', baht(d.finance.expense), 'เฉลี่ย ' + baht(d.finance.avgExpense) + '/เดือน', 'bad') +
            kpi('คงเหลือสุทธิ', baht(d.finance.net), 'อัตรากำไร ' + pct(d.finance.margin)) +
          '</div>' + miniMonthChart(d.finance.byMonth),
          '<button class="btn sm" onclick="go(\'finance\')">ดูทั้งหมด →</button>') +
        card('🗓️ งานที่กำลังจะถึง (' + d.upcoming.length + ')',
          d.upcoming.length ? '<div class="alist">' + d.upcoming.slice(0,7).map(function(u){
            var lvl = u.daysLeft < 0 ? 'danger' : (u.daysLeft <= 7 ? 'warn' : 'info');
            return '<div class="ali l-' + lvl + '" onclick="go(\'' + jumpPage(u.module) + '\')">' +
              '<div class="ic">' + u.icon + '</div><div><div class="tt">' + esc(u.title) + '</div>' +
              '<div class="dd">' + thDate(u.date) + ' · ' +
                (u.daysLeft < 0 ? 'เลยกำหนด ' + (-u.daysLeft) + ' วัน' : (u.daysLeft === 0 ? 'วันนี้' : 'อีก ' + u.daysLeft + ' วัน')) +
              '</div></div></div>';
          }).join('') + '</div>' : '<div class="empty"><div class="big">🌤️</div>ไม่มีงานนัดหมายเร็ว ๆ นี้</div>',
          '<button class="btn sm" onclick="go(\'reports\')">ปฏิทินเต็ม →</button>', true) +
      '</div>' +

      '<div class="grid g2">' +
        card('🔔 สิ่งที่ต้องทำ (' + d.alerts.length + ')', alerts, '', true) +
        card('🏢 งานซ่อมแซมตึกโดยรวม',
          '<div class="grid g2">' +
            kpi('งานปี ' + d.year, d.buildingRepairs.yearCount + ' งาน', 'ค้าง ' + d.buildingRepairs.openCount) +
            kpi('ค่าใช้จ่าย', baht(d.buildingRepairs.yearCost), 'ครบกำหนดเร็ว ๆ นี้ ' + d.buildingRepairs.upcoming) +
          '</div>' +
          (d.debtMain.forecast && d.debtMain.forecast.monthsLeft
            ? '<div class="hr"></div><div class="fs13"><b>ประมาณการปิดหนี้หลัก</b><div class="muted mt8">' +
              'จากอัตราชำระเฉลี่ย ' + baht(d.debtMain.forecast.avgPerMonth) + '/เดือน (12 เดือนล่าสุด) ' +
              'คาดว่าอีก <b>' + d.debtMain.forecast.monthsLeft + ' เดือน</b> ' +
              '(ราว ' + thDate(d.debtMain.forecast.payoffDate) + ')</div></div>'
            : ''),
          '<button class="btn sm" onclick="go(\'building\')">ดูทั้งหมด →</button>') +
      '</div>';
  },
  after: function(d){
    setBadge('repairs', d.repairs.openJobs);
    setBadge('ac', d.ac.roomsPending);
  }
};

function miniMonthChart(byMonth){
  var max = Math.max.apply(null, byMonth.map(function(m){ return Math.max(m.income, m.expense); })) || 1;
  return '<div style="display:flex;gap:3px;align-items:flex-end;height:74px">' + byMonth.map(function(m){
    var hi = Math.round(m.income / max * 66), he = Math.round(m.expense / max * 66);
    return '<div style="flex:1;text-align:center" title="' + m.label + ' · รับ ' + money(m.income) + ' · จ่าย ' + money(m.expense) + '">' +
      '<div style="display:flex;gap:1px;align-items:flex-end;justify-content:center;height:66px">' +
        '<div style="width:6px;height:' + hi + 'px;background:var(--ok);border-radius:2px 2px 0 0"></div>' +
        '<div style="width:6px;height:' + he + 'px;background:var(--danger);border-radius:2px 2px 0 0"></div>' +
      '</div><div class="faint" style="font-size:9.5px">' + m.label.replace('.','') + '</div></div>';
  }).join('') + '</div>' +
  '<div class="row fs12 muted mt8"><span class="b ok">รายรับ</span><span class="b dgr">รายจ่าย</span></div>';
}

function debtMini(x, page){
  return '<div class="pmeta" style="margin:0 0 6px"><span>ชำระแล้ว <b>' + baht(x.paid) + '</b></span>' +
         '<span><b>' + pct(x.percent) + '</b></span></div>' +
         progress(x.percent, 'lg') +
         '<div class="pmeta"><span>คงเหลือ <b>' + baht(x.remaining) + '</b></span>' +
         '<span>ยอดหนี้ทั้งหมด <b>' + baht(x.total) + '</b></span></div>' +
         '<div class="fs12 muted mt8">ชำระในปีที่เลือก: <b>' + baht(x.thisYear) + '</b></div>';
}

function setBadge(page, n){
  var el = document.getElementById('badge-' + page);
  if (!el) return;
  if (n > 0) { el.textContent = n; el.style.display = ''; }
  else el.style.display = 'none';
}

/* ============================================================
   2) หนี้หลัก / หนี้รอง (ใช้ตัววาดร่วมกัน)
   ============================================================ */
function debtRoute(ledger, title){
  return {
    load: function(){
      return Promise.all([
        callApi('debt.summary', { ledger: ledger, year: S.year }),
        callApi('debt.payments', { ledger: ledger, year: S.year })
      ]).then(function(r){
        var d = r[0]; d.payments = r[1]; d.ledger = ledger; d.pageTitle = title;
        return d;
      });
    },
    render: renderDebt,
    after: cacheAllDebts
  };
}
ROUTES.debtMain = debtRoute('หนี้หลัก', 'รายการสรุปรวม The M Corner AP');
ROUTES.debtSub  = debtRoute('หนี้รอง', 'หนี้สิน');

/** เก็บรายชื่อก้อนหนี้ทุกบัญชีไว้ให้ฟอร์มเลือก "เป็นส่วนหนึ่งของ" */
function cacheAllDebts(){
  callApi('debt.list', {}).then(function(list){
    ALL_DEBTS = list.map(function(d){
      return { id: d.id, title: d.title, ledger: d.ledger, parentId: d.parentId || '' };
    });
  }).catch(function(){});
}

function renderDebt(d){
  var yearLabel = S.year === 'all' ? 'ทุกปี' : 'ปี ' + S.year;

  var head = '<div class="card mb12"><div class="card-b">' +
    '<div class="row mb12"><h3 style="margin:0;font-size:15px">' + esc(d.pageTitle) + '</h3>' +
    '<span class="sp"></span>' +
    '<button class="btn pri sm" onclick="formDebtPayment(null,\'' + d.ledger + '\')">+ บันทึกการชำระ</button>' +
    '<button class="btn sm" onclick="formDebt(null,\'' + d.ledger + '\')">+ เพิ่มก้อนหนี้</button></div>' +
    '<div class="pmeta" style="margin:0 0 7px"><span>ความคืบหน้าการชำระ</span><span><b>' + pct(d.percent) + '</b></span></div>' +
    progress(d.percent, 'lg ' + (d.percent >= 100 ? 'ok' : '')) +
    '<div class="grid g4 mt16">' +
      kpi('ยอดหนี้ทั้งหมด', baht(d.totalDebt), d.debts.length + ' ก้อนหนี้') +
      kpi('ชำระแล้ว', baht(d.paid), d.paymentCount + ' รายการโอน', 'good') +
      kpi('คงเหลือ', baht(d.remaining), 'อีก ' + pct(100 - d.percent) + ' จะปิดหนี้', 'bad') +
      kpi('ชำระใน' + yearLabel, baht(d.selectedYearPaid), d.selectedYearCount + ' รายการ' +
          (d.selectedYearInterest ? ' · ดอกเบี้ย ' + baht(d.selectedYearInterest) : '')) +
    '</div></div></div>';

  var perDebt = d.debts.length ? '<div class="grid g-auto mb12">' + d.debts.map(function(x){
    return '<div class="card"><div class="card-b">' +
      '<div class="clip" style="font-weight:650;font-size:13.5px;min-height:38px">' + esc(x.title) + '</div>' +
      '<div class="row fs12 muted mb8">' + statusBadge(x.status) +
        '<span>' + esc(x.creditor || '–') + (x.startDate ? ' · ' + thDate(x.startDate) : '') + '</span></div>' +
      (x.parentTitle
        ? '<div class="b info mb8" title="ยอดก้อนนี้อยู่ในก้อนแม่แล้ว จ่ายคืนก้อนนี้ก้อนแม่จะลดตาม">' +
          '↳ เป็นส่วนหนึ่งของ ' + esc(x.parentTitle) + '</div>'
        : '') +
      progress(x.percent) +
      '<div class="pmeta"><span>ชำระ <b>' + baht(x.paid) + '</b></span><span>คงเหลือ <b>' + baht(x.remaining) + '</b></span></div>' +
      (x.children && x.children.length
        ? '<div class="hr" style="margin:12px 0 10px"></div>' +
          '<div class="fs12 muted mb8">ในยอดนี้มีก้อนย่อยอยู่ ' + x.children.length + ' ก้อน</div>' +
          x.children.map(function(c){
            return '<div class="mb8">' +
              '<div class="row fs12"><span>↳ ' + esc(c.title) + '</span>' +
              '<span class="sp mono">' + money(c.paid) + ' / ' + money(c.principal) + '</span></div>' +
              progress(c.percent, 'ok') + '</div>';
          }).join('') +
          (x.paidFromChildren ? '<div class="fs12 muted">รวมยอดที่มาจากก้อนย่อย ' + baht(x.paidFromChildren) + '</div>' : '')
        : '') +
      (x.interestPerMonth ? '<div class="fs12 muted mt8">ดอกเบี้ย ' + baht(x.interestPerMonth) + '/เดือน</div>' : '') +
      (x.planPerMonth ? '<div class="fs12 muted">แผนผ่อน ' + baht(x.planPerMonth) + '/เดือน</div>' : '') +
      '<div class="row mt12"><button class="btn sm" onclick=\'formDebt(' + attr(x) + ',"' + d.ledger + '")\'>แก้ไข</button>' +
      '<button class="btn sm dgr" onclick="delDebt(\'' + x.id + '\')">ลบ</button></div>' +
    '</div></div>';
  }).join('') + '</div>' : '';

  var byYear = d.byYear.length ? card('📅 ยอดชำระแยกตามปี',
    '<div class="tw"><table class="t"><thead><tr>' +
    '<th>ปี</th><th class="num">เงินต้น</th><th class="num">ดอกเบี้ย</th><th class="num">รวมที่โอน</th>' +
    '<th class="num">จำนวนครั้ง</th><th class="num">เงินต้นสะสม</th><th style="width:26%">ความคืบหน้าสะสม</th>' +
    '</tr></thead><tbody>' +
    d.byYear.map(function(y){
      var cum = y.cumulative != null ? y.cumulative : 0;
      var p = d.totalDebt ? (cum / d.totalDebt * 100) : 0;
      return '<tr onclick="setYearFromTable(' + y.year + ')" style="cursor:pointer">' +
        '<td><b>' + y.year + '</b> <span class="faint fs12">/ ' + (y.year+543) + '</span></td>' +
        '<td class="num">' + money(y.principal) + '</td>' +
        '<td class="num">' + (y.interest ? money(y.interest) : '–') + '</td>' +
        '<td class="num"><b>' + money(y.principal + y.interest) + '</b></td>' +
        '<td class="num">' + y.count + '</td>' +
        '<td class="num">' + money(cum) + '</td>' +
        '<td>' + progress(p) + '</td></tr>';
    }).join('') + '</tbody></table></div>', '', true) : '';

  var rows = d.payments;
  var list = card('🧾 รายการโอนใช้หนี้ · ' + yearLabel + ' (' + rows.length + ')',
    rows.length ? '<div class="tw"><table class="t"><thead><tr>' +
      '<th>วันที่</th><th>งวด</th><th class="num">เงินต้น</th><th class="num">ดอกเบี้ย</th>' +
      '<th class="num">รวมที่โอน</th><th>ช่องทาง</th>' +
      '<th>สลิป</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>' +
      rows.map(function(p){
        return '<tr>' +
          '<td class="nowrap">' + thDate(p.payDate) + '</td>' +
          '<td class="nowrap">' + esc(p.installment || '–') + '</td>' +
          '<td class="num">' + (p.principal ? '<b style="color:var(--ok)">' + money(p.principal) + '</b>' : '<span class="faint">–</span>') + '</td>' +
          '<td class="num">' + (p.interest ? '<b style="color:var(--warn)">' + money(p.interest) + '</b>' : '<span class="faint">–</span>') + '</td>' +
          '<td class="num"><b>' + money(p.amount) + '</b></td>' +
          '<td class="fs12">' + esc(p.channel || '–') + '</td>' +
          '<td>' + thumbsHtml(p.slipRefs) + '</td>' +
          '<td class="fs12 muted clip">' + esc(p.note || '') + '</td>' +
          '<td><div class="t-actions">' +
            '<button class="btn sm icon" onclick=\'formDebtPayment(' + attr(p) + ',"' + d.ledger + '")\'>✏️</button>' +
            '<button class="btn sm icon dgr" onclick="delDebtPayment(\'' + p.id + '\')">🗑</button>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table></div>'
    : emptyBox('ยังไม่มีรายการชำระใน' + yearLabel,
        '<button class="btn pri" onclick="formDebtPayment(null,\'' + d.ledger + '\')">+ บันทึกการชำระ</button>'),
    '', true);

  return head + perDebt + byYear + '<div class="mt12">' + list + '</div>';
}

function setYearFromTable(y){
  S.year = String(y);
  document.getElementById('yearSel').value = S.year;
  load();
}

      kpi('ยอดซื้อ ' + yearLabel, baht(d.yearTotal), d.yearCount + ' รายการ', 'accent') +
      kpi('ยอดสะสมทั้งหมด', baht(d.grandTotal), d.grandCount + ' รายการ') +
      kpi('อยู่ในประกัน', d.warranty.active + ' รายการ', 'ใกล้หมด ' + d.warranty.expiring, d.warranty.expiring ? 'warn' : 'good') +
      kpi('หมวดที่ใช้จ่ายสูงสุด', d.byCategory[0] ? d.byCategory[0].category : '–',

      }).join('') + '</div>';

    var rows = d.items;

        '<th class="num">ราคา</th><th>แหล่งที่ซื้อ</th><th>ประกัน</th><th>ภาพ</th><th>สลิป</th><th></th>' +
        '</tr></thead><tbody>' +
        rows.map(function(p){
          var w = p.warranty || {};
          return '<tr>' +
            '<td class="nowrap fs12">' + thDate(p.buyDate) + '</td>' +
            '<td><div class="clip" title="' + esc(p.item) + '"><b>' + esc(p.item) + '</b></div>' +
              '<div class="fs12 faint">' + esc(p.category || '') + (p.room ? ' · ห้อง ' + esc(p.room) : '') + '</div></td>' +
            '<td class="num">' + num(p.qty) + '</td>' +
            '<td class="num"><b>' + money(p.price) + '</b></td>' +
            '<td class="fs12">' + esc(p.vendor || '–') + '</td>' +
            '<td class="fs12">' + (w.has
                ? statusBadge(w.state) + '<div class="faint" style="font-size:11px">' + thDateShort(w.end) + '</div>'
                : '<span class="faint">–</span>') + '</td>' +
            '<td>' + thumbsHtml(p.photoRefs) + '</td>' +
            '<td>' + thumbsHtml(p.slipRefs) + '</td>' +
            '<td><div class="t-actions">' +
              '<button class="btn sm icon" onclick=\'formPurchase(' + attr(p) + ')\'>✏️</button>' +
              '<button class="btn sm icon dgr" onclick="delPurchase(\'' + p.id + '\')">🗑</button>' +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div>'
      : emptyBox('ยังไม่มีรายการซื้อใน' + yearLabel, '<button class="btn pri" onclick="formPurchase(null)">+ เพิ่มรายการซื้อ</button>'),
      '<button class="btn pri sm" onclick="formPurchase(null)">+ เพิ่มรายการซื้อ</button>', true);

    return head + charts + cats + table;
  }
};

function setParam(key, val){
  S.params[key] = val;
  load();
}

ROUTES.ac = {
  load: function(){ return callApi('ac.matrix', { year: S.year }); },
  render: function(d){

      kpi('รายรับ ' + yearLabel, baht(d.income), 'เฉลี่ย ' + baht(d.avgIncome) + '/เดือน', 'good') +
      kpi('รายจ่าย ' + yearLabel, baht(d.expense), 'เฉลี่ย ' + baht(d.avgExpense) + '/เดือน', 'bad') +
      kpi('คงเหลือสุทธิ', baht(d.net), 'อัตรากำไร ' + pct(d.margin), 'accent ' + (d.net >= 0 ? 'good' : 'bad')) +
      kpi('บันทึกแล้ว', d.monthsWithData + ' เดือน', d.count + ' รายการ') +
    '</div>';

    var maxBar = Math.max.apply(null, d.byMonth.map(function(m){ return Math.max(m.income, m.expense); })) || 1;
    var monthly = card('📅 รายเดือน · ' + yearLabel,
      '<div class="tw"><table class="t"><thead><tr>' +
      '<th>เดือน</th><th class="num">รายรับ</th><th class="num">รายจ่าย</th><th class="num">คงเหลือ</th>' +
      '<th style="width:38%">เทียบรายรับ / รายจ่าย</th></tr></thead><tbody>' +
      d.byMonth.map(function(m){
        var blank = !m.income && !m.expense;
        return '<tr' + (blank ? ' style="opacity:.45"' : '') + '>' +
          '<td><b>' + m.label + '</b></td>' +
          '<td class="num">' + (m.income ? money(m.income) : '–') + '</td>' +
          '<td class="num">' + (m.expense ? money(m.expense) : '–') + '</td>' +
          '<td class="num"><b style="color:' + (m.net >= 0 ? 'var(--ok)' : 'var(--danger)') + '">' +
            (blank ? '–' : money(m.net)) + '</b></td>' +
          '<td>' +
            '<div class="bar-track mb8"><div class="bar-fill" style="width:' + (m.income/maxBar*100) + '%;background:var(--ok)"></div></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (m.expense/maxBar*100) + '%;background:var(--danger)"></div></div>' +
          '</td></tr>';
      }).join('') + '</tbody></table></div>', '', true);

    var byKind = card('🧾 แยกตามรายการ · ' + yearLabel,
      barChart(d.byKind.map(function(k){ return { label: k.kind + ' (' + k.count + ')', total: k.total }; }),
               'label', 'total', function(i){ return money(i.total) + ' ฿'; }));

    var byYear = card('📊 เทียบรายปี',
      d.byYear.length ? '<div class="tw"><table class="t" style="min-width:auto"><thead><tr>' +
        '<th>ปี</th><th class="num">รายรับ</th><th class="num">รายจ่าย</th><th class="num">คงเหลือ</th></tr></thead><tbody>' +
        d.byYear.map(function(y){
          return '<tr onclick="setYearFromTable(' + y.year + ')" style="cursor:pointer">' +
            '<td><b>' + y.year + '</b> <span class="faint fs12">/ ' + (y.year+543) + '</span></td>' +
            '<td class="num">' + money(y.income) + '</td><td class="num">' + money(y.expense) + '</td>' +
            '<td class="num"><b style="color:' + (y.net>=0?'var(--ok)':'var(--danger)') + '">' + money(y.net) + '</b></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">ยังไม่มีข้อมูล</div>', '', true);

    var kinds = '<div class="chips mb12">' +
      '<button class="chip ' + (!S.params.kind?'on':'') + '" onclick="setParam(\'kind\',\'\')">ทุกรายการ</button>' +
      d.byKind.map(function(k){
        return '<button class="chip ' + (S.params.kind===k.kind?'on':'') + '" onclick="setParam(\'kind\',\'' + esc(k.kind) + '\')">' +
               esc(k.kind) + ' (' + k.count + ')</button>';

      rows.length ? '<div class="tw"><table class="t"><thead><tr>' +
        '<th>วันที่</th><th>รายการ</th><th class="num">จำนวนเงิน</th><th>รอบบิล</th><th>ช่องทาง</th>' +
        '<th>สลิป</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>' +
        rows.map(function(x){
          var inc = x.flow === 'รายรับ';
          return '<tr>' +
            '<td class="nowrap fs12">' + thDate(x.date) + '</td>' +

            '<td class="num"><b style="color:' + (inc?'var(--ok)':'var(--ink)') + '">' + (inc?'+':'−') + money(x.amount, 2) + '</b></td>' +
            '<td class="fs12">' + esc(x.billMonth || '–') + '</td>' +
            '<td class="fs12">' + esc(x.channel || '–') + '</td>' +
            '<td>' + thumbsHtml(x.slipRefs) + '</td>' +
            '<td class="fs12 muted clip">' + esc(x.note || '') + '</td>' +
            '<td><div class="t-actions">' +
              '<button class="btn sm icon" onclick=\'formFinance(' + attr(x) + ')\'>✏️</button>' +
              '<button class="btn sm icon dgr" onclick="delFinance(\'' + x.id + '\')">🗑</button>' +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div>'
      : emptyBox('ยังไม่มีรายการใน' + yearLabel, '<button class="btn pri" onclick="formFinance(null)">+ บันทึกรายการ</button>'),
      '<button class="btn pri sm" onclick="formFinance(null)">+ บันทึกรายรับ-รายจ่าย</button>', true);

    return head + monthly + '<div class="grid g2 mt12 mb12">' + byKind + byYear + '</div>' + kinds + list;
  }
};

/* ============================================================
   9) รายงาน & สำรองข้อมูล
   ============================================================ */
ROUTES.reports = {
  load: function(){
    return Promise.all([
      callApi('report.costPerRoom', { year: S.year }),
      callApi('report.upcoming', { days: 90 }),
      callApi('backup.sheets', {}),
      callApi('share.links', {}).catch(function(){ return {}; }),
      callApi('backup.history', {}).catch(function(){ return []; })
    ]).then(function(r){
      return { cost: r[0], upcoming: r[1], sheets: r[2], links: r[3] || {}, backups: r[4] || [], years: [] };

  },
  render: function(d){
    var yearLabel = S.year === 'all' ? 'ทุกปี' : 'ปี ' + S.year;

        '<th class="num">ของเข้าห้อง</th><th class="num">รวม</th><th style="width:26%"></th></tr></thead><tbody>' +
        top.map(function(r){

            '<td class="num">' + (r.purchase ? money(r.purchase) : '–') + '</td>' +
            '<td class="num"><b>' + money(r.total) + '</b></td>' +
            '<td><div class="bar-track"><div class="bar-fill" style="width:' + (r.total/maxCost*100) + '%"></div></div></td></tr>';

    var backup = card('💾 สำรองและกู้คืนข้อมูล',
      '<p class="fs13 muted">ข้อมูลทั้งหมดอยู่ในระบบนี้ — ควรดาวน์โหลดสำรองไว้เดือนละครั้ง ' +
      'ไฟล์ JSON นำกลับเข้าระบบได้ ส่วน CSV เปิดใน Excel หรือ Google Sheets ได้เลย</p>' +
      '<div class="row mt12">' +
        '<button class="btn pri" onclick="doExportJson()">⬇️ ดาวน์โหลดสำรองทั้งหมด (JSON)</button>' +
        '<button class="btn" onclick="doImportJson()">⬆️ กู้คืนจากไฟล์สำรอง</button>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="fs12 muted mb8">ส่งออกเป็น CSV แยกตาราง</div>' +
      '<div class="chips">' + d.sheets.map(function(n){
        return '<button class="chip" onclick="doExportCsv(\'' + esc(n) + '\')">' + esc(sheetLabel(n)) + '</button>';
      }).join('') + '</div>');

    var share = (canEdit() && d.links && d.links.viewUrl) ? card('🔗 ลิงก์เข้าใช้งาน',
      '<div class="f mb12"><label>🔑 ลิงก์ของคุณ (แก้ไขข้อมูลได้ — อย่าส่งต่อ)</label>' +
        '<input class="inp" readonly value="' + esc(d.links.adminUrl) + '" onclick="this.select()"></div>' +
      '<div class="f"><label>👀 ลิงก์แชร์ (เปิดดูได้อย่างเดียว — ส่งให้ใครก็ได้)</label>' +
        '<input class="inp" id="shareUrl" readonly value="' + esc(d.links.viewUrl) + '" onclick="this.select()"></div>' +
      '<div class="row mt12">' +
        '<button class="btn pri" onclick="copyShare()">📋 คัดลอกลิงก์แชร์</button>' +
        '<button class="btn dgr" onclick="doRotateShare()">🔁 ออกลิงก์แชร์ใหม่</button>' +
      '</div>' +
      '<p class="fs12 muted mt12">คนที่เปิดลิงก์แชร์จะเห็นข้อมูลทั้งหมดแบบอ่านอย่างเดียว ' +
      'ไม่ต้องมีบัญชี Google และไม่เห็น Google Sheet ของคุณ · ' +

        d.backups.slice(0,10).map(function(b){
          return '<tr><td class="fs12"><a href="' + esc(b.url) + '" target="_blank">' + esc(b.name) + '</a></td>' +
            '<td class="fs12">' + esc(b.at) + '</td>' +

function sheetLabel(n){
  return ({
    Debts:'ก้อนหนี้', DebtPayments:'รายการชำระหนี้', Purchases:'รายการซื้อของ', Rooms:'ทะเบียนห้อง',
    AcService:'ล้างแอร์', RoomRepairs:'ซ่อมแซมห้อง', BuildingRepairs:'ซ่อมแซมตึก',
    RoomAssets:'ทรัพย์สินห้อง', Finance:'รายรับ-รายจ่าย', Settings:'ตั้งค่า', ActivityLog:'ประวัติการแก้ไข'
  })[n] || n;
}

/* ============================================================
   ตัวช่วยวาดซ้ำ ๆ
   ============================================================ */

function kpi(label, value, cap, cls){
  return '<div class="kpi ' + (cls||'') + '">' +
    '<div class="lbl">' + esc(label) + '</div>' +
    '<div class="val">' + value + '</div>' +
    (cap ? '<div class="cap">' + cap + '</div>' : '') + '</div>';
}

function card(title, body, actions, flush){
  return '<div class="card">' +
    (title ? '<div class="card-h"><h3>' + title + '</h3>' + (actions ? '<div class="sp">' + actions + '</div>' : '') + '</div>' : '') +
    '<div class="card-b' + (flush ? ' flush' : '') + '">' + body + '</div></div>';
}

/** วาดผังห้องแบ่งตามชั้น — decorate(room) -> {cls, sub, onclick} */
function roomFloors(rooms, decorate){
  var byFloor = {};
  rooms.forEach(function(r){
    var f = r.floor || Number(String(r.room).charAt(0));
    (byFloor[f] = byFloor[f] || []).push(r);
  });
  var floors = Object.keys(byFloor).sort();
  return '<div class="floors">' + floors.map(function(f){
    return '<div class="floor"><div class="floor-tag"><b>' + f + '</b>ชั้น</div><div class="rooms">' +
      byFloor[f].map(function(r){
        var d = decorate(r);
        return '<div class="room ' + d.cls + '" onclick="' + d.onclick + '">' +
          '<span class="dot"></span><div class="no">' + esc(r.room) + '</div>' +
          '<div class="st">' + d.sub + '</div></div>';
      }).join('') + '</div></div>';
  }).join('') + '</div>';
}

/** ใส่ object ลงใน onclick attribute ได้อย่างปลอดภัย */
function attr(obj){
  var clean = {};
  Object.keys(obj).forEach(function(k){
    if (k.indexOf('_') === 0 || /Refs$/.test(k) || k === 'records' || k === 'warranty') return;
    clean[k] = obj[k];
  });
  return JSON.stringify(clean).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
<script>
/* =========================================================
   Forms.html — ฟอร์มเพิ่ม/แก้ไข และการลบ
   ========================================================= */

var FORM = { specs: [], keep: {}, bucket: 'misc' };

/* ---------------- form engine ---------------- */

function fieldsHtml(specs, rec){
  rec = rec || {};
  FORM.specs = specs;
  FORM.keep = {};
  return '<div class="fgrid">' + specs.map(function(f){
    var v = rec[f.key];
    var id = 'f_' + f.key;
    var inner;

    if (f.type === 'select') {
      var opts = (f.options || []).map(function(o){
        var val = typeof o === 'object' ? o.value : o;
        var lab = typeof o === 'object' ? o.label : o;
        return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('');
      inner = '<select class="sel" id="' + id + '">' + (f.blank !== false ? '<option value="">— เลือก —</option>' : '') + opts + '</select>';

    } else if (f.type === 'textarea') {
      inner = '<textarea class="ta" id="' + id + '" placeholder="' + esc(f.ph||'') + '">' + esc(v||'') + '</textarea>';

    } else if (f.type === 'files') {
      FORM.keep[f.key] = (rec[f.key] && rec[f.key].length) ? [].concat(rec[f.key]) : [];
      inner =
        '<div id="' + id + '_existing">' + existingFilesHtml(f.key) + '</div>' +
        '<label class="file-drop" for="' + id + '">📎 แตะเพื่อเลือกไฟล์ (เลือกได้หลายไฟล์ · ไม่เกิน 12 MB ต่อไฟล์)' +
        '<input type="file" id="' + id + '" multiple accept="image/*,application/pdf" style="display:none" ' +
        'onchange="previewPicked(this,\'' + id + '\')"></label>' +
        '<div id="' + id + '_preview" class="thumbs mt8"></div>';

    } else if (f.type === 'computed') {
      inner = '<div class="inp" id="' + id + '" style="background:var(--surface-2);font-weight:600;' +
              'font-variant-numeric:tabular-nums;cursor:default">0</div>';

    } else if (f.type === 'date') {
      inner = '<input type="date" class="inp" id="' + id + '" value="' + esc(v || '') + '">';

    } else if (f.type === 'number' || f.type === 'money') {
      inner = '<input type="number" step="' + (f.type === 'money' ? '0.01' : '1') + '" class="inp" id="' + id + '" ' +
              'value="' + (v == null || v === '' ? '' : esc(v)) + '" placeholder="' + esc(f.ph||'') + '" inputmode="decimal"' +
              (f.sums ? ' oninput="recalcSums()"' : '') + '>';

    } else {
      inner = '<input type="text" class="inp" id="' + id + '" value="' + esc(v || '') + '" placeholder="' + esc(f.ph||'') + '">';
    }

    return '<div class="f' + (f.full ? ' full' : '') + '">' +
      '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>' +
      inner + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/** อัปเดตช่องผลรวมทุกช่องในฟอร์มปัจจุบัน */
function recalcSums(){
  (FORM.specs || []).forEach(function(f){
    if (f.type !== 'computed' || !f.from) return;
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    var total = 0;
    f.from.forEach(function(k){
      var i = document.getElementById('f_' + k);
      if (i) total += Number(i.value) || 0;
    });
    el.textContent = total.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ฿';
    el.style.color = total > 0 ? 'var(--ok)' : 'var(--muted)';
  });
}

function existingFilesHtml(key){
  var list = FORM.keep[key] || [];
  if (!list.length) return '';
  return '<div class="thumbs mb8">' + list.map(function(url, i){
    var id = String(url).match(/[-\w]{20,}/);
    var thumb = id ? 'https://drive.google.com/thumbnail?id=' + id[0] + '&sz=w200' : '';
    return '<span style="position:relative;display:inline-block">' +
      (thumb ? '<img class="thumb" src="' + esc(thumb) + '" onclick="window.open(\'' + esc(url) + '\',\'_blank\')">'
             : '<a class="b info" href="' + esc(url) + '" target="_blank">ไฟล์ ' + (i+1) + '</a>') +
      '<button type="button" onclick="dropFile(\'' + key + '\',' + i + ')" title="เอาออก" ' +
      'style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:0;border-radius:99px;width:18px;height:18px;line-height:1;cursor:pointer;font-size:12px">×</button>' +
      '</span>';
  }).join('') + '</div>';
}

function dropFile(key, idx){
  FORM.keep[key].splice(idx, 1);
  document.getElementById('f_' + key + '_existing').innerHTML = existingFilesHtml(key);
}

function previewPicked(input, id){
  var box = document.getElementById(id + '_preview');
  var files = Array.prototype.slice.call(input.files || []);
  box.innerHTML = files.map(function(f){
    return '<span class="b info">' + esc(f.name.slice(0,26)) + ' · ' + Math.round(f.size/1024) + ' KB</span>';
  }).join(' ');
}

/** อ่านค่าจากฟอร์ม + อัปโหลดไฟล์ใหม่ แล้วคืน object พร้อมบันทึก */
function readForm(specs, bucket){
  var out = {};
  var uploads = [];

  specs.forEach(function(f){
    if (f.type === 'computed') return;          // ช่องคำนวณ ไม่ต้องบันทึก
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    if (f.type === 'files') {
      uploads.push(
        uploadFiles(el, bucket).then(function(refs){
          out[f.key] = (FORM.keep[f.key] || []).concat(refs.map(function(r){ return r.url; }));
        })
      );
    } else if (f.type === 'number' || f.type === 'money') {
      out[f.key] = el.value === '' ? null : Number(el.value);
    } else {
      out[f.key] = el.value;
    }
  });

  return Promise.all(uploads).then(function(){ return out; });
}

/** โครงฟอร์มมาตรฐาน: เปิด modal, จัดการปุ่มบันทึก, รีโหลดหน้า */
function openForm(opts){
  var rec = opts.record || {};
  openModal(opts.title,
    fieldsHtml(opts.fields, rec),
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    (rec.id && opts.onDelete ? '<button class="btn dgr" id="fDel">ลบรายการนี้</button>' : '') +
    '<button class="btn pri" id="fSave">' + (rec.id ? 'บันทึกการแก้ไข' : 'บันทึก') + '</button>',
    opts.wide);

  if (rec.id && opts.onDelete) {
    document.getElementById('fDel').onclick = function(){ closeModal(); opts.onDelete(rec.id); };
  }

  recalcSums();

  document.getElementById('fSave').onclick = function(){
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';

    readForm(opts.fields, opts.bucket || 'misc').then(function(data){
      var missing = opts.fields.filter(function(f){
        return f.required && (data[f.key] == null || data[f.key] === '');
      });
      if (missing.length) throw new Error('กรุณากรอก: ' + missing.map(function(f){ return f.label; }).join(', '));

      var record = Object.assign({}, opts.base || {}, data);
      if (rec.id) record.id = rec.id;
      return callApi(opts.action, Object.assign({ record: record }, opts.extra || {}));
    }).then(function(){
      closeModal();
      toast('บันทึกเรียบร้อย', 'ok');
      load();
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = rec.id ? 'บันทึกการแก้ไข' : 'บันทึก';
      toast(e.message || e, 'err');
    });
  };
}

function bulkPick(what){
  document.querySelectorAll('.bk').forEach(function(c){
    if (what === 'all') c.checked = true;
    else if (what === 'none') c.checked = false;
    else c.checked = String(c.value).charAt(0) === String(what);
  });
}

function doExportCsv(sheet){
  callApi('backup.csv', { sheet: sheet }).then(function(r){
    saveTextFile(r.filename, r.content, 'text/csv');
  }).catch(function(e){ toast(e.message||e, 'err'); });
}

/** ดาวน์โหลดไฟล์ — ใช้ downloads capability ถ้ามี ไม่งั้นใช้ลิงก์ปกติ */
function saveTextFile(filename, content, mime){
  if (typeof window.saveViaHost === 'function') return window.saveViaHost(filename, content, mime);
  var blob = new Blob([content], { type: mime + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ดาวน์โหลด ' + filename + ' แล้ว', 'ok');
}

function doImportJson(){
  openModal('⬆️ กู้คืนจากไฟล์สำรอง',
    '<p class="fs13">เลือกไฟล์ <b>.json</b> ที่เคยดาวน์โหลดไว้</p>' +
    '<label class="file-drop" for="impFile">📄 เลือกไฟล์สำรอง' +
      '<input type="file" id="impFile" accept="application/json,.json" style="display:none" ' +
      'onchange="document.getElementById(\'impName\').textContent=this.files[0]?this.files[0].name:\'\'"></label>' +
    '<div class="fs12 muted mt8" id="impName"></div>' +
    '<div class="hr"></div>' +
    '<div class="f"><label>วิธีกู้คืน</label>' +
    '<select class="sel" id="impMode">' +
      '<option value="merge">เพิ่มเฉพาะรายการที่ยังไม่มี (แนะนำ)</option>' +
      '<option value="replace">ล้างข้อมูลเดิมแล้วแทนที่ทั้งหมด</option>' +
    '</select></div>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="impGo">กู้คืนข้อมูล</button>');

  document.getElementById('impGo').onclick = function(){
    var f = document.getElementById('impFile').files[0];
    if (!f) return toast('กรุณาเลือกไฟล์ก่อน', 'err');
    var mode = document.getElementById('impMode').value;
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังกู้คืน…';
    var r = new FileReader();
    r.onload = function(){
      var parsed;
      try { parsed = JSON.parse(r.result); }
      catch (e) { btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; return toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'err'); }
      callApi('backup.import', { data: parsed, mode: mode }).then(function(stat){
        closeModal();
        var n = Object.keys(stat).reduce(function(a,k){ return a + (stat[k]||0); }, 0);
        toast('กู้คืนสำเร็จ ' + n + ' รายการ', 'ok');
        load();
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; toast(e.message||e, 'err');
      });
    };
    r.readAsText(f);
  };
}

/* ============================================================
   ลิงก์แชร์ และการสำรองลง Google Drive
   ============================================================ */

function copyShare(){
  var el = document.getElementById('shareUrl');
  if (!el) return;
  el.select();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(el.value)
      .then(function(){ toast('คัดลอกลิงก์แชร์แล้ว','ok'); })
      .catch(function(){ toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); });
  } else {
    try { document.execCommand('copy'); toast('คัดลอกลิงก์แชร์แล้ว','ok'); }
    catch (e) { toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); }
  }
}

function doRotateShare(){
  confirmAction('ออกลิงก์แชร์ชุดใหม่? คนที่ถือลิงก์เดิมจะเปิดไม่ได้อีก', function(){
    callApi('share.rotateToken', {}).then(function(){
      toast('ออกลิงก์แชร์ชุดใหม่แล้ว','ok'); load();
    }).catch(function(e){ toast(e.message||e,'err'); });
  });
}

function doBackupNow(){
  toast('กำลังสำรองข้อมูลลง Drive…');
  callApi('backup.backupNow', {}).then(function(r){
    toast('สำรองแล้ว: ' + r.name, 'ok'); load();
  }).catch(function(e){ toast(e.message||e,'err'); });
}
