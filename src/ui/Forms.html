<script>
/* =========================================================
   Forms.html — ฟอร์มเพิ่ม/แก้ไข และการลบ
   ========================================================= */

var FORM = { specs: [], keep: {}, bucket: 'misc', ocr: null };

/* ---------------- form engine ---------------- */

function fieldsHtml(specs, rec){
  rec = rec || {};
  FORM.specs = specs;
  FORM.keep = {};
  return '<div class="fgrid">' + specs.map(function(f){
    var v = rec[f.key];
    var id = 'f_' + f.key;
    var inner;

    if (f.type === 'select') {
      var opts = (f.options || []).map(function(o){
        var val = typeof o === 'object' ? o.value : o;
        var lab = typeof o === 'object' ? o.label : o;
        return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('');
      inner = '<select class="sel" id="' + id + '">' + (f.blank !== false ? '<option value="">— เลือก —</option>' : '') + opts + '</select>';

    } else if (f.type === 'textarea') {
      inner = '<textarea class="ta" id="' + id + '" placeholder="' + esc(f.ph||'') + '">' + esc(v||'') + '</textarea>';

    } else if (f.type === 'files') {
      FORM.keep[f.key] = (rec[f.key] && rec[f.key].length) ? [].concat(rec[f.key]) : [];
      inner =
        '<div id="' + id + '_existing">' + existingFilesHtml(f.key) + '</div>' +
        '<label class="file-drop" for="' + id + '">📎 แตะเพื่อเลือกไฟล์ (เลือกได้หลายไฟล์ · ไม่เกิน 12 MB ต่อไฟล์)' +
        '<input type="file" id="' + id + '" multiple accept="image/*,application/pdf" style="display:none" ' +
        'onchange="previewPicked(this,\'' + id + '\')"></label>' +
        '<div id="' + id + '_preview" class="thumbs mt8"></div>' +
        '<div id="' + id + '_ocr"></div>';

    } else if (f.type === 'computed') {
      inner = '<div class="inp" id="' + id + '" style="background:var(--surface-2);font-weight:600;' +
              'font-variant-numeric:tabular-nums;cursor:default">0</div>';

    } else if (f.type === 'date') {
      inner = '<input type="date" class="inp" id="' + id + '" value="' + esc(v || '') + '">';

    } else if (f.type === 'number' || f.type === 'money') {
      inner = '<input type="number" step="' + (f.type === 'money' ? '0.01' : '1') + '" class="inp" id="' + id + '" ' +
              'value="' + (v == null || v === '' ? '' : esc(v)) + '" placeholder="' + esc(f.ph||'') + '" inputmode="decimal"' +
              (f.sums ? ' oninput="recalcSums()"' : '') + '>';

    } else {
      inner = '<input type="text" class="inp" id="' + id + '" value="' + esc(v || '') + '" placeholder="' + esc(f.ph||'') + '">';
    }

    return '<div class="f' + (f.full ? ' full' : '') + '">' +
      '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>' +
      inner + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/** อัปเดตช่องผลรวมทุกช่องในฟอร์มปัจจุบัน */
function recalcSums(){
  (FORM.specs || []).forEach(function(f){
    if (f.type !== 'computed' || !f.from) return;
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    var total = 0;
    f.from.forEach(function(k){
      var i = document.getElementById('f_' + k);
      if (i) total += Number(i.value) || 0;
    });
    el.textContent = total.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ฿';
    el.style.color = total > 0 ? 'var(--ok)' : 'var(--muted)';
  });
}

function existingFilesHtml(key){
  var list = FORM.keep[key] || [];
  if (!list.length) return '';
  return '<div class="thumbs mb8">' + list.map(function(url, i){
    var id = String(url).match(/[-\w]{20,}/);
    var thumb = id ? 'https://drive.google.com/thumbnail?id=' + id[0] + '&sz=w200' : '';
    return '<span style="position:relative;display:inline-block">' +
      (thumb ? '<img class="thumb" src="' + esc(thumb) + '" onclick="window.open(\'' + esc(url) + '\',\'_blank\')">'
             : '<a class="b info" href="' + esc(url) + '" target="_blank">ไฟล์ ' + (i+1) + '</a>') +
      '<button type="button" onclick="dropFile(\'' + key + '\',' + i + ')" title="เอาออก" ' +
      'style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:0;border-radius:99px;width:18px;height:18px;line-height:1;cursor:pointer;font-size:12px">×</button>' +
      '</span>';
  }).join('') + '</div>';
}

function dropFile(key, idx){
  FORM.keep[key].splice(idx, 1);
  document.getElementById('f_' + key + '_existing').innerHTML = existingFilesHtml(key);
}

function previewPicked(input, id){
  var box = document.getElementById(id + '_preview');
  var files = Array.prototype.slice.call(input.files || []);
  box.innerHTML = files.map(function(f){
    return '<span class="b info">' + esc(f.name.slice(0,26)) + ' · ' + Math.round(f.size/1024) + ' KB</span>';
  }).join(' ');

  var slot = document.getElementById(id + '_ocr');
  if (!slot) return;
  slot.innerHTML = '';
  if (!ocrUsable() || !firstReadable(files)) return;

  var mode = (S.boot.settings && S.boot.settings.ocrAutofill) || 'ถามก่อนเติม';
  if (mode === 'ไม่เติม') return;
  if (mode === 'เติมให้เลย') return runOcr(id, true);

  slot.innerHTML =
    '<button type="button" class="btn sm mt8" onclick="runOcr(\'' + id + '\')">' +
    '🔎 อ่านข้อความจากรูปนี้ แล้วช่วยกรอกให้</button>';
}

/** อ่านค่าจากฟอร์ม + อัปโหลดไฟล์ใหม่ แล้วคืน object พร้อมบันทึก */
function readForm(specs, bucket){
  var out = {};
  var uploads = [];

  specs.forEach(function(f){
    if (f.type === 'computed') return;          // ช่องคำนวณ ไม่ต้องบันทึก
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    if (f.type === 'files') {
      uploads.push(
        uploadFiles(el, bucket).then(function(refs){
          out[f.key] = (FORM.keep[f.key] || []).concat(refs.map(function(r){ return r.url; }));
        })
      );
    } else if (f.type === 'number' || f.type === 'money') {
      out[f.key] = el.value === '' ? null : Number(el.value);
    } else {
      out[f.key] = el.value;
    }
  });

  return Promise.all(uploads).then(function(){ return out; });
}

/** โครงฟอร์มมาตรฐาน: เปิด modal, จัดการปุ่มบันทึก, รีโหลดหน้า */
function openForm(opts){
  var rec = opts.record || {};
  FORM.ocr = opts.ocr || null;
  openModal(opts.title,
    fieldsHtml(opts.fields, rec),
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    (rec.id && opts.onDelete ? '<button class="btn dgr" id="fDel">ลบรายการนี้</button>' : '') +
    '<button class="btn pri" id="fSave">' + (rec.id ? 'บันทึกการแก้ไข' : 'บันทึก') + '</button>',
    opts.wide);

  if (rec.id && opts.onDelete) {
    document.getElementById('fDel').onclick = function(){ closeModal(); opts.onDelete(rec.id); };
  }

  recalcSums();

  document.getElementById('fSave').onclick = function(){
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';

    readForm(opts.fields, opts.bucket || 'misc').then(function(data){
      var missing = opts.fields.filter(function(f){
        return f.required && (data[f.key] == null || data[f.key] === '');
      });
      if (missing.length) throw new Error('กรุณากรอก: ' + missing.map(function(f){ return f.label; }).join(', '));

      var record = Object.assign({}, opts.base || {}, data);
      if (rec.id) record.id = rec.id;
      return callApi(opts.action, Object.assign({ record: record }, opts.extra || {}));
    }).then(function(){
      closeModal();
      toast('บันทึกเรียบร้อย', 'ok');
      load();
    }).catch(function(e){
      btn.disabled = false;
      btn.textContent = rec.id ? 'บันทึกการแก้ไข' : 'บันทึก';
      toast(e.message || e, 'err');
    });
  };
}

/* ============================================================
   อ่านข้อความจากรูป (OCR) แล้วช่วยกรอกฟอร์ม

   ทุกค่าที่ได้เป็นแค่ข้อเสนอ ผู้ใช้กดเติมเองทีละช่องหรือเติมทั้งหมดก็ได้
   และแก้ไขต่อได้เสมอ เพราะตัวอ่านพลาดได้ โดยเฉพาะลายมือกับรูปเอียง
   ============================================================ */

var OCR_MAX = 8 * 1024 * 1024;   // รูปใหญ่กว่านี้ส่งไปอ่านแล้วมักหมดเวลา

function ocrUsable(){
  return !!(FORM.ocr && S.boot && S.boot.settings && S.boot.settings.ocrEnabled);
}

/** รูปแรกที่พออ่านได้ (ข้ามไฟล์ใหญ่เกินและไฟล์ที่ไม่ใช่รูป/PDF) */
function firstReadable(files){
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (f.size <= OCR_MAX && /^image\/|pdf$/.test(f.type || '')) return f;
  }
  return null;
}

/**
 * @param {string} id  id ของช่องแนบไฟล์ เช่น f_slips
 * @param {boolean} auto true = เติมช่องที่ยังว่างให้เลยโดยไม่ต้องกด
 */
function runOcr(id, auto){
  var input = document.getElementById(id);
  var slot = document.getElementById(id + '_ocr');
  if (!input || !slot) return;

  var file = firstReadable(Array.prototype.slice.call(input.files || []));
  if (!file) { slot.innerHTML = '<div class="hint mt8">ไม่มีรูปที่อ่านได้ (รองรับรูปภาพและ PDF ไม่เกิน 8 MB)</div>'; return; }

  slot.innerHTML = '<div class="ocr-box"><div class="hd"><span class="spin"></span> กำลังอ่านข้อความจาก ' +
                   esc(file.name.slice(0, 28)) + '…</div></div>';

  readAsDataUrl(file).then(function(p){
    return callApi('ocr.read', { dataUrl: p.dataUrl, mimeType: p.mimeType });
  }).then(function(r){
    slot.innerHTML = ocrBoxHtml(id, r);
    OCR_LAST[id] = r;
    if (auto) {
      var n = ocrApplyAll(id, true);
      toast(n ? 'อ่านรูปแล้ว เติมให้ ' + n + ' ช่อง — ตรวจดูก่อนบันทึกนะ' : 'อ่านรูปแล้ว แต่ยังจับค่าที่ใช้ได้ไม่ได้', n ? 'ok' : '');
    }
  }).catch(function(e){
    slot.innerHTML = '<div class="ocr-box"><div class="hd">⚠️ อ่านรูปไม่สำเร็จ</div>' +
      '<div class="hint">' + esc(e.message || e) + '</div>' +
      '<button type="button" class="btn sm mt8" onclick="runOcr(\'' + id + '\')">ลองอีกครั้ง</button></div>';
  });
}

var OCR_LAST = {};

/** ค่าที่อ่านได้ คู่กับช่องในฟอร์มที่จะเอาไปใส่ */
function ocrPairs(r){
  var m = FORM.ocr || {};
  var g = r.guess || {};
  var out = [];
  if (m.date   && g.date)   out.push({ field: m.date,   label: 'วันที่',     value: g.date,   show: thDate(g.date) });
  if (m.amount && g.amount) out.push({ field: m.amount, label: 'จำนวนเงิน',  value: g.amount, show: baht(g.amount) });
  if (m.vendor && g.vendor) out.push({ field: m.vendor, label: 'ร้าน/ผู้ขาย', value: g.vendor, show: g.vendor });
  if (m.title  && g.title)  out.push({ field: m.title,  label: 'ชื่อรายการ',  value: g.title,  show: g.title });
  if (m.note   && g.ref)    out.push({ field: m.note,   label: 'เลขอ้างอิง',  value: 'อ้างอิง ' + g.ref, show: g.ref });
  // ใบเสร็จหลายรายการ — รวมเป็นข้อความหลายบรรทัดให้เลือกใส่ทีเดียว
  if (m.title && g.items && g.items.length > 1) {
    var lines = g.items.map(function(it, i){ return (i+1) + '.' + it.name + ' ' + money(it.price, 2) + ' ฿'; }).join('\n');
    out.push({ field: m.title, label: 'ทุกรายการ (' + g.items.length + ')', value: lines, show: g.items.length + ' รายการในใบเสร็จ', multi: true });
  }
  return out;
}

function ocrBoxHtml(id, r){
  var pairs = ocrPairs(r);
  if (!pairs.length) {
    return '<div class="ocr-box"><div class="hd">🔎 อ่านข้อความได้ แต่ยังจับค่าที่ใช้ได้ไม่ได้' +
      '<span class="sp"><button type="button" class="btn sm" onclick="ocrToggleRaw(\'' + id + '\')">ดูข้อความที่อ่านได้</button></span></div>' +
      '<div class="ocr-raw" id="' + id + '_raw" hidden>' + esc(r.text || '(ว่าง)') + '</div></div>';
  }
  return '<div class="ocr-box">' +
    '<div class="hd">🔎 อ่านจากรูปได้แบบนี้ — กดเติมช่องที่ต้องการ' +
      '<span class="sp">' +
        '<button type="button" class="btn sm pri" onclick="ocrApplyAll(\'' + id + '\')">เติมทั้งหมด</button>' +
        '<button type="button" class="btn sm" onclick="ocrToggleRaw(\'' + id + '\')">ข้อความเต็ม</button>' +
      '</span></div>' +
    '<div class="ocr-hits">' + pairs.map(function(p, i){
      return '<div class="ocr-hit">' +
        '<span class="k">' + esc(p.label) + '</span>' +
        '<span class="v" title="' + esc(String(p.value)) + '">' + esc(p.show) + '</span>' +
        '<button type="button" class="btn sm" onclick="ocrApplyOne(\'' + id + '\',' + i + ')">เติม</button>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="ocr-raw" id="' + id + '_raw" hidden>' + esc(r.text || '(ว่าง)') + '</div>' +
    '<div class="hint mt8">ตรวจความถูกต้องก่อนบันทึกเสมอ — แก้ในช่องได้ตามปกติ</div>' +
  '</div>';
}

function ocrToggleRaw(id){
  var el = document.getElementById(id + '_raw');
  if (el) el.hidden = !el.hidden;
}

/** ใส่ค่าลงช่อง แล้วไฮไลต์ให้เห็นว่าช่องไหนถูกเติม */
function ocrFill(fieldKey, value){
  var el = document.getElementById('f_' + fieldKey);
  if (!el) return false;
  el.value = value;
  el.classList.add('ocr-filled');
  setTimeout(function(){ el.classList.remove('ocr-filled'); }, 1600);
  recalcSums();
  return true;
}

function ocrApplyOne(id, idx){
  var r = OCR_LAST[id];
  if (!r) return;
  var p = ocrPairs(r)[idx];
  if (p && ocrFill(p.field, p.value)) toast('เติม' + p.label + 'แล้ว', 'ok');
}

/**
 * @param {boolean} onlyEmpty true = เติมเฉพาะช่องที่ยังว่าง (ใช้ตอนเติมอัตโนมัติ
 *                            จะได้ไม่ทับสิ่งที่ผู้ใช้พิมพ์ไปแล้ว)
 * @return {number} จำนวนช่องที่เติมจริง
 */
function ocrApplyAll(id, onlyEmpty){
  var r = OCR_LAST[id];
  if (!r) return 0;
  var done = {};
  var n = 0;
  ocrPairs(r).forEach(function(p){
    if (done[p.field]) return;                       // ช่องเดียวกันเติมครั้งเดียว เอาตัวแรก
    var el = document.getElementById('f_' + p.field);
    if (!el) return;
    if (onlyEmpty && String(el.value || '').trim() !== '') return;
    if (ocrFill(p.field, p.value)) { done[p.field] = true; n++; }
  });
  if (!onlyEmpty) toast(n ? 'เติมให้ ' + n + ' ช่องแล้ว — ตรวจดูก่อนบันทึก' : 'ช่องที่จะเติมไม่อยู่ในฟอร์มนี้', n ? 'ok' : 'err');
  return n;
}

function roomOptions(){ return S.boot ? S.boot.rooms : []; }
function opt(name){ return (S.boot && S.boot.schema[name]) || []; }
function today(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   ฟอร์ม: ก้อนหนี้
   ============================================================ */
function formDebt(rec, ledger){
  // เลือกแม่ได้จากทุกบัญชี ยกเว้นตัวเอง
  var all = (ALL_DEBTS || []).filter(function(d){ return !rec || d.id !== rec.id; });
  openForm({
    title: rec && rec.id ? 'แก้ไขก้อนหนี้' : 'เพิ่มก้อนหนี้',
    record: rec, action: 'debt.save', base: { ledger: ledger },
    onDelete: delDebt,
    fields: [
      { key:'title',    label:'รายการหนี้', required:true, full:true, ph:'เช่น ค่าก่อสร้าง The M Corner AP' },
      { key:'ledger',   label:'ประเภทบัญชี', type:'select', options:['หนี้หลัก','หนี้รอง'], blank:false },
      { key:'creditor', label:'เจ้าหนี้', ph:'เช่น ครอบครัว / ธนาคาร / ป้าตา' },
      { key:'parentId', label:'เป็นส่วนหนึ่งของก้อนหนี้', type:'select', full:true,
        options: all.map(function(d){ return { value:d.id, label:d.title + ' (' + d.ledger + ')' }; }),
        hint:'ใช้เมื่อเงินก้อนนี้เป็นทุนของอีกก้อน เช่น เงินยืมป้าตาเป็นส่วนหนึ่งของหนี้ซื้อที่ดิน — ' +
             'จ่ายคืนก้อนนี้แล้วก้อนแม่จะลดตามไปด้วย และยอดรวมจะไม่ถูกนับซ้ำ' },
      { key:'startDate', label:'วันที่ก่อหนี้', type:'date' },
      { key:'principal', label:'ยอดหนี้ตั้งต้น (บาท)', type:'money', required:true },
      { key:'interestPerMonth', label:'ดอกเบี้ยต่อเดือน (บาท)', type:'money' },
      { key:'planPerMonth', label:'ยอดผ่อนต่อเดือน (บาท)', type:'money' },
      { key:'dueDay',   label:'กำหนดชำระ (วันที่ของเดือน)', type:'number', ph:'20' },
      { key:'status',   label:'สถานะ', type:'select', options:opt('debtStatuses'), blank:false },
      { key:'note',     label:'หมายเหตุ', type:'textarea', full:true }
    ]
  });
  if (!rec) { var e = document.getElementById('f_ledger'); if (e) e.value = ledger; }
}

function delDebt(id){
  confirmAction('ลบก้อนหนี้นี้? รายการชำระที่ผูกไว้จะยังอยู่', function(){
    callApi('debt.delete', { id: id }).then(function(){ toast('ลบแล้ว','ok'); load(); })
      .catch(function(e){ toast(e.message||e,'err'); });
  });
}

/* ============================================================
   ฟอร์ม: รายการโอนใช้หนี้
   ============================================================ */
function formDebtPayment(rec, ledger){
  var debts = (S.cache[S.page] && S.cache[S.page].debts) || [];
  openForm({
    title: rec && rec.id ? 'แก้ไขรายการชำระ' : 'บันทึกการโอนใช้หนี้',
    record: rec || { payDate: today(), channel: 'โอน QR' },
    action: 'debt.savePayment', base: { ledger: ledger }, bucket: 'debt',
    ocr: { date:'payDate', amount:'principal', note:'note' },
    onDelete: delDebtPayment,
    fields: [
      { key:'payDate', label:'วันที่ชำระ', type:'date', required:true },
      { key:'channel', label:'ช่องทาง', type:'select', options:opt('payChannels') },
      { key:'principal', label:'เงินต้น (บาท)', type:'money', sums:true,
        hint:'ส่วนที่ไปลดยอดหนี้จริง' },
      { key:'interest',  label:'ดอกเบี้ย (บาท)', type:'money', sums:true,
        hint:'ไม่ถูกนำไปลดยอดหนี้' },
      { key:'_total',  label:'รวมที่โอน', type:'computed', from:['principal','interest'],
        hint:'ตรวจให้ตรงกับยอดในสลิป · ระบบคิดให้อัตโนมัติ' },
      { key:'installment', label:'งวดที่', ph:'เช่น 9/2569' },
      { key:'debtId',  label:'ผูกกับก้อนหนี้', type:'select',
        options: debts.map(function(d){ return { value:d.id, label:d.title }; }),

function formBulkAc(){
  var rooms = roomOptions();
  var body =
    '<div class="fgrid">' +
      '<div class="f"><label>วันที่นัด <span style="color:var(--danger)">*</span></label>' +

      '<div class="f"><label>หมายเหตุ</label><input class="inp" id="bk_note"></div>' +
    '</div>' +

    '<div class="row mb8"><b class="fs13">เลือกห้อง</b><span class="sp"></span>' +
      '<button class="btn sm" onclick="bulkPick(\'all\')">ทั้งหมด</button>' +
      '<button class="btn sm" onclick="bulkPick(\'none\')">ล้าง</button>' +
      [1,2,3,4,5].map(function(f){ return '<button class="btn sm" onclick="bulkPick(' + f + ')">ชั้น ' + f + '</button>'; }).join('') +
    '</div>' +
    '<div class="rooms" id="bkRooms">' + rooms.map(function(r){
      return '<label class="room" style="cursor:pointer"><input type="checkbox" class="bk" value="' + r + '"> <b>' + r + '</b></label>';
    }).join('') + '</div>';

  openModal('📅 นัดล้างแอร์หลายห้องพร้อมกัน', body,
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="bkSave">สร้างนัดหมาย</button>', true);

  document.getElementById('bkSave').onclick = function(){
    var picked = Array.prototype.slice.call(document.querySelectorAll('.bk:checked')).map(function(c){ return c.value; });
    var date = document.getElementById('bk_date').value;
    if (!picked.length) return toast('เลือกอย่างน้อย 1 ห้อง', 'err');
    if (!date) return toast('กรุณาระบุวันที่นัด', 'err');
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    callApi('ac.bulkBook', {
      rooms: picked, bookDate: date,
      technician: document.getElementById('bk_tech').value,
      cost: document.getElementById('bk_cost').value,
      note: document.getElementById('bk_note').value
    }).then(function(n){
      closeModal(); toast('สร้างนัดหมาย ' + n + ' ห้องแล้ว', 'ok'); load();
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'สร้างนัดหมาย'; toast(e.message||e, 'err');
    });
  };
}

function bulkPick(what){
  document.querySelectorAll('.bk').forEach(function(c){
    if (what === 'all') c.checked = true;
    else if (what === 'none') c.checked = false;
    else c.checked = String(c.value).charAt(0) === String(what);
  });
}

/** ดาวน์โหลดไฟล์ — ใช้ downloads capability ถ้ามี ไม่งั้นใช้ลิงก์ปกติ */
function saveTextFile(filename, content, mime){
  if (typeof window.saveViaHost === 'function') return window.saveViaHost(filename, content, mime);
  var blob = new Blob([content], { type: mime + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ดาวน์โหลด ' + filename + ' แล้ว', 'ok');
}

function doImportJson(){
  openModal('⬆️ กู้คืนจากไฟล์สำรอง',
    '<p class="fs13">เลือกไฟล์ <b>.json</b> ที่เคยดาวน์โหลดไว้</p>' +
    '<label class="file-drop" for="impFile">📄 เลือกไฟล์สำรอง' +
      '<input type="file" id="impFile" accept="application/json,.json" style="display:none" ' +
      'onchange="document.getElementById(\'impName\').textContent=this.files[0]?this.files[0].name:\'\'"></label>' +
    '<div class="fs12 muted mt8" id="impName"></div>' +
    '<div class="hr"></div>' +
    '<div class="f"><label>วิธีกู้คืน</label>' +
    '<select class="sel" id="impMode">' +
      '<option value="merge">เพิ่มเฉพาะรายการที่ยังไม่มี (แนะนำ)</option>' +
      '<option value="replace">ล้างข้อมูลเดิมแล้วแทนที่ทั้งหมด</option>' +
    '</select></div>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn pri" id="impGo">กู้คืนข้อมูล</button>');

  document.getElementById('impGo').onclick = function(){
    var f = document.getElementById('impFile').files[0];
    if (!f) return toast('กรุณาเลือกไฟล์ก่อน', 'err');
    var mode = document.getElementById('impMode').value;
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังกู้คืน…';
    var r = new FileReader();
    r.onload = function(){
      var parsed;
      try { parsed = JSON.parse(r.result); }
      catch (e) { btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; return toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง', 'err'); }
      callApi('backup.import', { data: parsed, mode: mode }).then(function(stat){
        closeModal();
        var n = Object.keys(stat).reduce(function(a,k){ return a + (stat[k]||0); }, 0);
        toast('กู้คืนสำเร็จ ' + n + ' รายการ', 'ok');
        load();
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'กู้คืนข้อมูล'; toast(e.message||e, 'err');
      });
    };
    r.readAsText(f);
  };
}

function copyShare(){
  var el = document.getElementById('shareUrl');
  if (!el) return;
  el.select();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(el.value)
      .then(function(){ toast('คัดลอกลิงก์แชร์แล้ว','ok'); })
      .catch(function(){ toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); });
  } else {
    try { document.execCommand('copy'); toast('คัดลอกลิงก์แชร์แล้ว','ok'); }
    catch (e) { toast('คัดลอกไม่สำเร็จ — กดค้างที่ช่องแล้วเลือกคัดลอก','err'); }
  }
